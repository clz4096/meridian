<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge — The Rail</title>
<style>
  :root{
    --bg:#070B14; --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
    --text:#DCE6F2; --muted:#8FA3BE; --dim:#727D8E; --faint:#5C7291;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --teal:#7CC9EC; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
    --protein:#A78BEA; --hub:#F2B25C;
    --m-new:#5C6678; --m-shaky:#D8654F; --m-learning:#E0A64B; --m-solid:#6BBF73; --m-mastered:#4FB0A5;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --gutter:40px; --spine-x:19px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.4;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* ---- Header ---- */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,rgba(7,11,20,0));padding-top:20px}
  .h-title{font-size:15px;font-weight:600;letter-spacing:.2px;color:var(--text)}
  .meter{display:block;width:100%;border:0;background:none;padding:12px 0 4px;cursor:pointer;text-align:left}
  .meter-track{height:1px;width:100%;background:var(--surface-2);border-radius:1px;overflow:hidden}
  .meter-fill{display:block;height:1px;background:var(--teal);width:40%;transition:width .5s ease}
  .meter-label{display:block;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.1px}
  .meter:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:2px}

  /* ---- Study next card ---- */
  .studynext{margin:16px 0 6px;background:var(--surface-1);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
  .studynext .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--dim)}
  .sn-topic{font-size:21px;font-weight:600;margin:8px 0 8px;letter-spacing:.1px}
  .sn-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .sn-mastery{display:inline-flex;align-items:center;gap:7px}
  .m-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .sn-due{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .sn-actions{display:flex;align-items:center;gap:18px;margin-top:16px}
  .btn-study{
    appearance:none;border:0;cursor:pointer;font-family:var(--sans);font-weight:650;font-size:14px;
    color:#1a1206;background:var(--hub);padding:11px 22px;border-radius:10px;min-height:44px;
    box-shadow:0 1px 0 rgba(0,0,0,.25);transition:filter .15s ease,transform .05s ease;
  }
  .btn-study:hover{filter:brightness(1.06)}
  .btn-study:active{transform:translateY(1px)}
  .path-link{appearance:none;border:0;background:none;cursor:pointer;font-family:var(--sans);
    font-size:13px;color:var(--muted);padding:6px 2px;min-height:44px;display:inline-flex;align-items:center}
  .path-link:hover{color:var(--text)}
  /* collapsed (all caught up) */
  .sn-clear{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ok);padding:2px 0}
  .sn-clear .m-dot{background:var(--ok)}

  /* ---- The Rail ---- */
  .rail{position:relative;margin:22px 0 8px;padding-top:2px}
  .spine{position:absolute;left:var(--spine-x);top:6px;bottom:6px;width:1px;background:var(--line);z-index:0}
  .section-h{position:relative;z-index:1;padding-left:var(--gutter);margin:26px 0 6px;
    font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
  .section-h:first-child{margin-top:4px}

  .tile{
    position:relative;z-index:1;display:flex;align-items:baseline;gap:10px;width:100%;
    appearance:none;border:0;background:none;cursor:pointer;text-align:left;font-family:var(--sans);
    color:var(--text);padding:11px 12px 11px var(--gutter);min-height:44px;border-radius:10px;
    transition:background .15s ease,opacity .3s ease;
  }
  .tile:hover{background:var(--surface-1)}
  .tile:focus-visible{outline:2px solid var(--line-2);outline-offset:2px}
  .dot{position:absolute;left:calc(var(--spine-x) - 4px);top:15px;width:9px;height:9px;border-radius:50%;
    background:var(--m-new);box-shadow:0 0 0 3px var(--bg);transition:box-shadow .3s ease}
  .t-name{font-size:15px;font-weight:500;flex:none}
  .t-mastery{font-size:12.5px;font-weight:500}
  .t-due{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .t-check{position:absolute;left:calc(var(--spine-x) - 4px);top:14px;width:9px;height:9px;
    font-size:8px;line-height:9px;text-align:center;color:var(--bg);font-weight:900}

  /* states */
  .tile.done{opacity:.66}
  .tile.done .t-name{font-weight:450;color:var(--muted)}
  .tile.upcoming{opacity:.56}
  .tile.upcoming .t-name{color:var(--text)}
  .tile.current{
    opacity:1;background:var(--surface-1);box-shadow:0 1px 0 var(--line-2),0 6px 20px rgba(0,0,0,.28);
    border:1px solid var(--line);padding-top:12px;padding-bottom:12px;
  }
  .tile.current .dot{background:var(--hub);box-shadow:0 0 0 3px var(--bg),0 0 0 6px rgba(242,178,92,.20)}
  .tile.current .t-name{font-weight:650}
  .here{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--hub);
    margin-left:auto;white-space:nowrap}
  .tile.current .t-due{color:var(--muted)}

  /* ---- demo toggle ---- */
  .demo{margin:34px 0 40px;padding-top:22px;border-top:1px solid var(--line)}
  .demo-label{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{
    appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--muted);
    background:var(--surface-1);border:1px solid var(--line);padding:9px 13px;border-radius:9px;min-height:40px;
    transition:color .15s ease,background .15s ease,border-color .15s ease;
  }
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{color:var(--text);background:var(--surface-3);border-color:var(--line-2)}
  .seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ---- toast ---- */
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
    background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);border-radius:10px;
    padding:11px 16px;font-size:13px;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    #toast{transition:opacity .001s}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="h-title">Knowledge</div>
      <button class="meter" id="meter" type="button" aria-label="Progress">
        <span class="meter-track"><span class="meter-fill" id="meterFill"></span></span>
        <span class="meter-label" id="meterLabel">6 of 15 topics solid</span>
      </button>
    </header>

    <section id="studynext" aria-label="Study next"></section>

    <div class="rail" id="rail" aria-label="Curriculum rail">
      <div class="spine" aria-hidden="true"></div>
    </div>

    <section class="demo" aria-label="Demo states">
      <div class="demo-label">Demo state</div>
      <div class="seg" role="group" aria-label="Demo state">
        <button type="button" data-mode="default"  aria-pressed="true">Default</button>
        <button type="button" data-mode="caught"    aria-pressed="false">All caught up</button>
        <button type="button" data-mode="growing"   aria-pressed="false">Growing curriculum</button>
      </div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var MASTERY = {
    "new":     {c:"var(--m-new)",      w:"new"},
    "shaky":   {c:"var(--m-shaky)",    w:"shaky"},
    "learning":{c:"var(--m-learning)", w:"learning"},
    "solid":   {c:"var(--m-solid)",    w:"solid"},
    "mastered":{c:"var(--m-mastered)", w:"mastered"}
  };

  function base(){
    return [
      {name:"Foundations", topics:[
        {name:"Algorithms & LeetCode", m:"mastered"},
        {name:"Graph Theory",          m:"solid"},
        {name:"Probability & Statistics", m:"solid"},
        {name:"C++",                   m:"mastered"},
        {name:"Computer Architecture", m:"solid"}
      ]},
      {name:"Systems", topics:[
        {name:"Concurrency",           m:"solid"},
        {name:"Linux",                 m:"learning", due:3},
        {name:"Databases",             m:"shaky",    due:2},
        {name:"Networking",            m:"learning", due:5},
        {name:"Distributed Systems",   m:"new"}
      ]},
      {name:"Frontier", topics:[
        {name:"System Design",         m:"new"},
        {name:"Compilers",             m:"new"},
        {name:"ML Fundamentals",       m:"learning", due:4},
        {name:"GPUs & TPUs",           m:"new"},
        {name:"Behavioral",            m:"shaky",    due:1}
      ]}
    ];
  }

  function model(mode){
    var sections = base();
    var currentIndex = 6;              // Linux (2nd of Systems)
    var total = 15, solid = 6;
    var studyNext = {name:"Linux", m:"learning", due:3};

    if(mode === "caught"){
      sections.forEach(function(s){ s.topics.forEach(function(t){
        t.m = (t.m === "mastered") ? "mastered" : "solid";
        delete t.due;
      });});
      currentIndex = 14;              // rests on the deepest topic
      total = 15; solid = 15;
      studyNext = null;
    } else if(mode === "growing"){
      sections[2].topics.push({name:"LLMs & Transformers", m:"new"});
      sections[2].topics.push({name:"AI Alignment",        m:"new"});
      total = 17; solid = 6; currentIndex = 6;
    }
    return {sections:sections, currentIndex:currentIndex, total:total, solid:solid, studyNext:studyNext};
  }

  // ---- toast ----
  var toastEl = document.getElementById("toast"), tTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  function dot(color){ return '<span class="m-dot" style="background:'+color+'"></span>'; }

  // ---- render header + study-next ----
  function renderTop(m){
    var fill = document.getElementById("meterFill");
    var label = document.getElementById("meterLabel");
    fill.style.width = Math.round(m.solid / m.total * 100) + "%";
    label.textContent = m.solid + " of " + m.total + " topics solid";

    var sn = document.getElementById("studynext");
    if(!m.studyNext){
      sn.className = "studynext";
      sn.innerHTML =
        '<div class="eyebrow">STUDY NEXT</div>' +
        '<div class="sn-clear">'+dot("var(--ok)")+'<span>You&rsquo;re current &mdash; nothing due</span></div>';
      return;
    }
    var ms = MASTERY[m.studyNext.m];
    var due = m.studyNext.due ? '<span class="sn-due">'+m.studyNext.due+' due</span>' : '';
    sn.className = "studynext";
    sn.innerHTML =
      '<div class="eyebrow">STUDY NEXT</div>' +
      '<div class="sn-topic">'+m.studyNext.name+'</div>' +
      '<div class="sn-meta">' +
        '<span class="sn-mastery">'+dot(ms.c)+ms.w+'</span>' + due +
      '</div>' +
      '<div class="sn-actions">' +
        '<button type="button" class="btn-study" data-toast="Starting session: '+m.studyNext.name+'">Study</button>' +
        '<button type="button" class="path-link" data-toast="Today&rsquo;s path">Today&rsquo;s path &rarr;</button>' +
      '</div>';
  }

  // ---- render the rail ----
  function renderRail(m){
    var rail = document.getElementById("rail");
    rail.innerHTML = '<div class="spine" aria-hidden="true"></div>';
    var idx = 0;
    m.sections.forEach(function(sec){
      var h = document.createElement("div");
      h.className = "section-h";
      h.textContent = sec.name;
      rail.appendChild(h);

      sec.topics.forEach(function(t){
        var state = idx < m.currentIndex ? "done" : (idx === m.currentIndex ? "current" : "upcoming");
        var ms = MASTERY[t.m];
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tile " + state;
        b.setAttribute("data-toast", "Open topic: " + t.name);
        if(state === "current") b.setAttribute("aria-current", "step");

        var mark = state === "done"
          ? '<span class="t-check" aria-hidden="true">&#10003;</span>'
          : '';
        var spineDot = state === "done"
          ? '<span class="dot" style="background:'+ms.c+'"></span>'
          : '<span class="dot" style="background:'+ (state==="current" ? "var(--hub)" : ms.c) +'"></span>';

        var tail = state === "current"
          ? '<span class="here">you&rsquo;re here</span>'
          : (t.due ? '<span class="t-due">'+t.due+' due</span>' : '');

        var aria = t.name + ", " + ms.w + (t.due ? ", " + t.due + " due" : "") +
                   (state==="current" ? ", you are here" : state==="done" ? ", done" : "");
        b.setAttribute("aria-label", aria);

        b.innerHTML =
          spineDot + mark +
          '<span class="t-name">'+t.name+'</span>' +
          '<span class="t-mastery" style="color:'+ms.c+'">'+ms.w+'</span>' +
          tail;
        rail.appendChild(b);
        idx++;
      });
    });
  }

  function render(mode){
    var m = model(mode);
    renderTop(m);
    renderRail(m);
  }

  // ---- events ----
  document.getElementById("meter").addEventListener("click", function(){ toast("Progress"); });

  document.body.addEventListener("click", function(e){
    var t = e.target.closest("[data-toast]");
    if(t){ toast(t.getAttribute("data-toast")); return; }
    var seg = e.target.closest(".seg button");
    if(seg){
      var btns = document.querySelectorAll(".seg button");
      for(var i=0;i<btns.length;i++) btns[i].setAttribute("aria-pressed", btns[i]===seg ? "true":"false");
      render(seg.getAttribute("data-mode"));
    }
  });

  render("default");
})();
</script>
</body>
</html>
