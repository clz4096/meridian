<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge — Simplified flow</title>
<style>
  :root{
    --bg:#070B14; --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
    --text:#DCE6F2; --muted:#8FA3BE; --dim:#727D8E; --faint:#5C7291;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --teal:#7CC9EC; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
    --protein:#A78BEA; --hub:#F2B25C;
    --m-new:#5C6678; --m-shaky:#D8654F; --m-learning:#E0A64B; --m-solid:#6BBF73; --m-mastered:#4FB0A5;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    --gutter:40px; --spine-x:19px;
    --r-8:8px; --r-10:10px; --r-12:12px; --r-14:14px; --r-16:16px; --r-999:999px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(242,178,92,.05), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.4;
  }
  button{font-family:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--hub); outline-offset:2px; border-radius:6px}

  .wrap{max-width:560px; margin:0 auto; padding:0 18px 120px}
  .screen{display:none}
  .screen.active{display:block; animation:fade .28s var(--ease) both}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

  /* ============ LANDING (Rail look) ============ */
  header.rail-h{position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg) 78%,rgba(7,11,20,0)); padding-top:20px}
  .h-title{font-size:15px; font-weight:600; letter-spacing:.2px; color:var(--text)}
  .meter{display:block; width:100%; border:0; background:none; padding:12px 0 4px; text-align:left}
  .meter-track{height:1px; width:100%; background:var(--surface-2); border-radius:1px; overflow:hidden}
  .meter-fill{display:block; height:1px; background:var(--teal); width:40%; transition:width .5s var(--ease)}
  .meter-label{display:block; margin-top:9px; font-size:12px; color:var(--muted); letter-spacing:.1px}

  .studynext{margin:16px 0 6px; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r-14); padding:16px 16px 14px}
  .studynext .eyebrow{font-size:10.5px; font-weight:700; letter-spacing:1.4px; color:var(--dim)}
  .sn-topic{font-size:21px; font-weight:600; margin:8px 0 8px; letter-spacing:.1px}
  .sn-meta{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted); flex-wrap:wrap}
  .sn-mastery{display:inline-flex; align-items:center; gap:7px}
  .m-dot{width:8px; height:8px; border-radius:50%; flex:none}
  .sn-due{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
  .sn-actions{margin-top:16px}
  .btn-continue{
    appearance:none; border:0; font-family:var(--sans); font-weight:650; font-size:14.5px;
    color:#1a1206; background:var(--hub); padding:12px 22px; border-radius:var(--r-10); min-height:48px;
    box-shadow:0 1px 0 rgba(0,0,0,.25); transition:filter .15s var(--ease), transform .05s var(--ease);
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-continue:hover{filter:brightness(1.06)}
  .btn-continue:active{transform:translateY(1px)}

  .rail{position:relative; margin:22px 0 8px; padding-top:2px}
  .spine{position:absolute; left:var(--spine-x); top:6px; bottom:6px; width:1px; background:var(--line); z-index:0}
  .section-h{position:relative; z-index:1; padding-left:var(--gutter); margin:8px 0 6px;
    font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--dim)}
  .tile{
    position:relative; z-index:1; display:flex; align-items:baseline; gap:10px; width:100%;
    appearance:none; border:0; background:none; text-align:left; font-family:var(--sans);
    color:var(--text); padding:11px 12px 11px var(--gutter); min-height:44px; border-radius:var(--r-10);
    transition:background .15s var(--ease);
  }
  .tile:hover{background:var(--surface-1)}
  .dot{position:absolute; left:calc(var(--spine-x) - 4px); top:15px; width:9px; height:9px; border-radius:50%;
    background:var(--m-new); box-shadow:0 0 0 3px var(--bg)}
  .t-name{font-size:15px; font-weight:500; flex:none}
  .t-mastery{font-size:12.5px; font-weight:500}
  .t-due{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--dim); white-space:nowrap}
  .t-check{position:absolute; left:calc(var(--spine-x) - 4px); top:14px; width:9px; height:9px;
    font-size:8px; line-height:9px; text-align:center; color:var(--bg); font-weight:900}
  .tile.done{opacity:.66}
  .tile.done .t-name{font-weight:450; color:var(--muted)}
  .tile.current{opacity:1; background:var(--surface-1); box-shadow:0 1px 0 var(--line-2),0 6px 20px rgba(0,0,0,.28);
    border:1px solid var(--line); padding-top:12px; padding-bottom:12px}
  .tile.current .dot{background:var(--hub); box-shadow:0 0 0 3px var(--bg),0 0 0 6px rgba(242,178,92,.20)}
  .tile.current .t-name{font-weight:650}
  .here{font-size:10px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--hub);
    margin-left:auto; white-space:nowrap}
  .tile.current .t-due{color:var(--muted)}
  .tile-hint{margin:6px 0 0 var(--gutter); font-size:11.5px; color:var(--faint)}

  /* ============ TOPIC screen ============ */
  .topic-head{position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg) 80%,rgba(7,11,20,0)); padding:20px 0 8px}
  .th-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .backbtn{appearance:none; border:0; background:none; color:var(--muted); font-size:14px; padding:6px 8px 6px 0;
    min-height:44px; display:inline-flex; align-items:center; gap:4px; margin-left:-4px}
  .backbtn:hover{color:var(--text)}
  .th-name{font-size:17px; font-weight:650; letter-spacing:-.01em}
  .th-mastery{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-family:var(--mono)}
  .th-due{margin-left:auto; font-family:var(--mono); font-size:12.5px; color:var(--dim)}

  .review-row{
    display:flex; align-items:center; gap:10px; width:100%; margin:14px 0 12px;
    appearance:none; border:1px solid rgba(124,201,236,.28); background:rgba(124,201,236,.07);
    color:var(--text); text-align:left; padding:13px 16px; border-radius:var(--r-12); min-height:52px;
    transition:background .16s var(--ease), border-color .16s var(--ease);
  }
  .review-row:hover{background:rgba(124,201,236,.12); border-color:rgba(124,201,236,.45)}
  .review-row .rr-label{font-size:14.5px; font-weight:600}
  .review-row .rr-count{font-family:var(--mono); font-size:12.5px; color:var(--teal)}
  .review-row .rr-arrow{margin-left:auto; color:var(--teal); font-size:16px}

  .tucked{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 20px}
  .effort-filter{display:inline-flex; align-items:center; gap:6px}
  .effort-filter .ef-label{font-size:11px; color:var(--dim); letter-spacing:.02em}
  .seg{display:inline-flex; gap:4px; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r-999); padding:3px}
  .seg button{appearance:none; border:0; background:none; color:var(--dim); font-family:var(--mono); font-size:11px;
    padding:5px 9px; min-height:34px; border-radius:var(--r-999); transition:color .14s var(--ease), background .14s var(--ease)}
  .seg button:hover{color:var(--muted)}
  .seg button[aria-pressed="true"]{color:var(--text); background:var(--surface-3)}
  .gym-link{appearance:none; border:0; background:none; color:var(--dim); font-size:12.5px; padding:6px 4px;
    min-height:34px; display:inline-flex; align-items:center; gap:5px}
  .gym-link:hover{color:var(--muted)}

  /* card in the stack (topic) + one-up (review) share .qcard */
  .qcard{
    background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r-16);
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:12px; margin-bottom:14px;
    box-shadow:0 14px 40px -26px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.02);
  }
  .qc-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .mastery-chip{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
  .mastery-chip .dot2{width:8px; height:8px; border-radius:50%; flex:none}
  .mastery-chip .mword{font-family:var(--mono); font-size:11px; letter-spacing:.02em; text-transform:capitalize}
  .effort-chip{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px;
    color:var(--faint); background:var(--surface-2); border:1px solid var(--line); padding:4px 9px; border-radius:var(--r-999)}
  .effort-chip svg{opacity:.8}
  .prompt{font-size:16.5px; line-height:1.42; color:var(--text); letter-spacing:-.01em; margin:2px 0 0}
  .src{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.02em}

  .answer-wrap{display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--ease)}
  .answer-wrap.open{grid-template-rows:1fr}
  .answer-inner{overflow:hidden; min-height:0}
  .answer{border-top:1px dashed var(--line-2); margin-top:2px; padding-top:13px; display:flex; gap:10px}
  .answer .bar{flex:0 0 auto; width:3px; border-radius:var(--r-999); background:linear-gradient(var(--ok),rgba(59,185,140,.15))}
  .answer .label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ok); margin-bottom:6px}
  .answer .body{font-size:14px; line-height:1.5; color:#C6D3E4}

  .btn-reveal{width:100%; min-height:46px; background:var(--surface-3); color:var(--text);
    border:1px solid var(--line-2); border-radius:var(--r-12); font-size:14.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:9px; transition:background .18s var(--ease), border-color .18s var(--ease)}
  .btn-reveal:hover{background:#2E3644; border-color:var(--faint)}
  .btn-reveal .k{font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--line); padding:1px 6px; border-radius:6px}

  .grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .grade{min-height:58px; padding:8px 4px 7px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative;
    transition:transform .12s var(--ease), background .16s var(--ease)}
  .grade:hover{background:var(--surface-3)}
  .grade:active{transform:scale(.96)}
  .grade .g{font-size:13.5px; font-weight:650}
  .grade .hint{font-family:var(--mono); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
  .grade[data-g="again"]{border-color:rgba(216,101,79,.5)}  .grade[data-g="again"] .g{color:#EA8A76}
  .grade[data-g="hard"]{border-color:rgba(224,166,75,.42)}  .grade[data-g="hard"] .g{color:#E7B769}
  .grade[data-g="good"]{border-color:rgba(107,191,115,.42)} .grade[data-g="good"] .g{color:#84CC8B}
  .grade[data-g="easy"]{border-color:rgba(79,176,165,.42)}  .grade[data-g="easy"] .g{color:#6BC4BA}

  .qcard.reviewed{opacity:.6}
  .card-note{font-size:12.5px; color:var(--muted); font-family:var(--mono); letter-spacing:.02em; display:flex; align-items:center; gap:6px}
  .card-note svg{vertical-align:-2px}

  /* ============ REVIEW screen ============ */
  .rv-head{padding:20px 0 8px}
  .rv-line{display:flex; align-items:center; gap:12px}
  .rv-back{appearance:none; border:0; background:none; color:var(--muted); font-size:14px; padding:6px 8px 6px 0;
    min-height:44px; display:inline-flex; align-items:center; gap:4px; margin-left:-4px}
  .rv-back:hover{color:var(--text)}
  .rv-title{font-size:13px; color:var(--muted); font-weight:500}
  .rv-count{margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .rv-count b{color:var(--text); font-weight:600}
  .rv-track{height:3px; width:100%; border-radius:var(--r-999); background:var(--line); overflow:hidden; margin-top:10px}
  .rv-fill{display:block; height:100%; width:0%; border-radius:var(--r-999);
    background:linear-gradient(90deg,#3E8FB0,var(--teal)); transition:width .45s var(--ease)}
  .rv-stage{margin-top:18px}
  .qcard.rv-card{transition:transform .4s var(--ease), opacity .4s var(--ease)}
  .qcard.recede{transform:translateY(-12px) scale(.95); opacity:0}
  .qcard.enter{transform:translateY(16px) scale(.97); opacity:0}

  .done-panel{text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px 8px 8px;
    animation:rise .5s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)}}
  .done-panel .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--teal); opacity:.85}
  .done-panel h1{font-size:24px; font-weight:680; letter-spacing:-.02em; margin:0}
  .ledger{font-family:var(--mono); font-size:13.5px; color:var(--text); line-height:1.9;
    background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r-12); padding:14px 18px; width:100%; max-width:360px}
  .ledger .c-solid{color:var(--m-solid)} .ledger .c-shaky{color:var(--m-shaky)} .ledger .c-learn{color:var(--m-learning)}
  .ledger .sep{color:var(--dim)}
  .done-back{min-height:50px; padding:0 30px; border-radius:var(--r-999); border:1px solid var(--line-2);
    background:var(--surface-2); color:var(--text); font-size:15px; font-weight:600; margin-top:4px; transition:background .16s var(--ease)}
  .done-back:hover{background:var(--surface-3)}

  /* ============ toast + screen switcher ============ */
  #toast{position:fixed; left:50%; bottom:70px; transform:translate(-50%,14px); z-index:60;
    background:var(--surface-3); color:var(--text); border:1px solid var(--line-2); border-radius:var(--r-10);
    padding:11px 16px; font-size:13px; max-width:88vw; box-shadow:0 8px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease)}
  #toast.show{opacity:1; transform:translate(-50%,0)}

  .switcher{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50;
    display:inline-flex; gap:3px; background:rgba(23,28,36,.9); backdrop-filter:blur(8px);
    border:1px solid var(--line-2); border-radius:var(--r-999); padding:4px}
  .switcher button{appearance:none; border:0; background:none; color:var(--dim); font-family:var(--mono);
    font-size:11px; letter-spacing:.04em; padding:7px 13px; min-height:36px; border-radius:var(--r-999);
    transition:color .14s var(--ease), background .14s var(--ease)}
  .switcher button:hover{color:var(--muted)}
  .switcher button[aria-current="true"]{color:var(--text); background:var(--surface-3)}
  .sw-tag{font-size:9px; color:var(--faint); text-align:center; margin-top:6px; letter-spacing:.08em; font-family:var(--mono)}

  @media (max-width:400px){
    .prompt{font-size:15.5px}
    .grade .g{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important}
    .qcard.recede,.qcard.enter{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========================= SCREEN 1 · LANDING ========================= -->
  <section class="screen" id="s-landing" aria-label="Landing">
    <header class="rail-h">
      <div class="h-title">Knowledge</div>
      <button class="meter" type="button" id="meter" aria-label="6 of 15 topics solid">
        <span class="meter-track"><span class="meter-fill" style="width:40%"></span></span>
        <span class="meter-label">6 of 15 topics solid</span>
      </button>
    </header>

    <section class="studynext" aria-label="Study next">
      <div class="eyebrow">STUDY NEXT</div>
      <div class="sn-topic">Algorithms / LC</div>
      <div class="sn-meta">
        <span class="sn-mastery"><span class="m-dot" style="background:var(--m-learning)"></span>learning</span>
        <span class="sn-due">5 due</span>
      </div>
      <div class="sn-actions">
        <button class="btn-continue" type="button" id="continueBtn">Continue <span aria-hidden="true">→</span> Today&rsquo;s path</button>
      </div>
    </section>

    <div class="rail" aria-label="Topics">
      <div class="spine" aria-hidden="true"></div>
      <div class="section-h">Foundations</div>
      <button class="tile current" type="button" data-topic="algo" aria-current="step"
              aria-label="Algorithms / LC, learning, 5 due, you are here">
        <span class="dot"></span>
        <span class="t-name">Algorithms / LC</span>
        <span class="t-mastery" style="color:var(--m-learning)">learning</span>
        <span class="here">you&rsquo;re here</span>
      </button>
      <button class="tile done" type="button" data-topic="graph" aria-label="Graph Theory, solid, done">
        <span class="dot" style="background:var(--m-solid)"></span><span class="t-check" aria-hidden="true">&#10003;</span>
        <span class="t-name">Graph Theory</span>
        <span class="t-mastery" style="color:var(--m-solid)">solid</span>
      </button>
      <button class="tile" type="button" data-topic="prob" aria-label="Probability &amp; Statistics, shaky, 2 due">
        <span class="dot" style="background:var(--m-shaky)"></span>
        <span class="t-name">Probability &amp; Statistics</span>
        <span class="t-mastery" style="color:var(--m-shaky)">shaky</span>
        <span class="t-due">2 due</span>
      </button>
      <button class="tile" type="button" data-topic="cpp" aria-label="C++, learning, 3 due">
        <span class="dot" style="background:var(--m-learning)"></span>
        <span class="t-name">C++</span>
        <span class="t-mastery" style="color:var(--m-learning)">learning</span>
        <span class="t-due">3 due</span>
      </button>
      <div class="tile-hint">Tap a topic to open it.</div>
    </div>
  </section>

  <!-- ========================= SCREEN 2 · TOPIC ========================= -->
  <section class="screen" id="s-topic" aria-label="Topic">
    <header class="topic-head">
      <div class="th-line">
        <button class="backbtn" type="button" data-goto="landing" aria-label="Back to Knowledge">
          <span aria-hidden="true">‹</span> back
        </button>
        <span class="th-name">Algorithms / LC</span>
        <span class="th-mastery"><span class="m-dot" style="background:var(--m-learning)"></span>50%</span>
        <span class="th-due" id="topicDue">5 due</span>
      </div>
    </header>

    <button class="review-row" type="button" id="reviewRow" aria-label="Review 5 due">
      <span class="rr-label">Review</span>
      <span class="rr-count" id="reviewRowCount">5 due</span>
      <span class="rr-arrow" aria-hidden="true">→</span>
    </button>

    <div class="tucked">
      <div class="effort-filter">
        <span class="ef-label" id="efLabel">Effort</span>
        <div class="seg" role="group" aria-labelledby="efLabel">
          <button type="button" data-effort="all" aria-pressed="true">All</button>
          <button type="button" data-effort="5" aria-pressed="false">5m</button>
          <button type="button" data-effort="15" aria-pressed="false">15m</button>
          <button type="button" data-effort="30" aria-pressed="false">30m</button>
        </div>
      </div>
      <button class="gym-link" type="button" id="gymLink">🎧 Gym</button>
    </div>

    <div id="cardStack" aria-label="Cards"></div>
  </section>

  <!-- ========================= SCREEN 3 · REVIEW ========================= -->
  <section class="screen" id="s-review" aria-label="Focused review">
    <header class="rv-head">
      <div class="rv-line">
        <button class="rv-back" type="button" data-goto="topic" aria-label="Back to topic">
          <span aria-hidden="true">‹</span> topic
        </button>
        <span class="rv-title">Algorithms / LC</span>
        <span class="rv-count" id="rvCount"><b>1</b> of 5</span>
      </div>
      <div class="rv-track" aria-hidden="true"><span class="rv-fill" id="rvFill"></span></div>
    </header>
    <div class="rv-stage" id="rvStage"></div>
  </section>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<nav class="switcher-outer" aria-label="Prototype screen switcher">
  <div class="switcher" role="tablist">
    <button type="button" role="tab" data-screen="landing" aria-current="true">Landing</button>
    <button type="button" role="tab" data-screen="topic" aria-current="false">Topic</button>
    <button type="button" role="tab" data-screen="review" aria-current="false">Review</button>
  </div>
</nav>

<script>
(function(){
  "use strict";

  var MCOLOR = {new:'var(--m-new)',shaky:'var(--m-shaky)',learning:'var(--m-learning)',solid:'var(--m-solid)',mastered:'var(--m-mastered)'};
  var GRADES = [
    {id:'again', label:'Again', hint:'<10m'},
    {id:'hard',  label:'Hard',  hint:'1d'},
    {id:'good',  label:'Good',  hint:'4d'},
    {id:'easy',  label:'Easy',  hint:'9d'}
  ];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  // ---- topic deck: Algorithms / LC · mixed effort + mastery, a few due ----
  var DECK = [
    { id:'twoptr', mins:5, mastery:'learning', due:true,
      prompt:'When does the two-pointer technique apply, and what property of the input makes it valid?',
      src:'CSES §8.1 Two pointers · p.87',
      answer:'Two pointers works when the array is sorted (or has some monotonic property) and you are searching for a pair/triple satisfying a condition. Validity rests on monotonicity: moving the left pointer right only increases the sum, moving the right pointer left only decreases it — so at each step you eliminate an entire row or column of the search space without checking it. That turns O(n²) into O(n).' },

    { id:'winfix', mins:5, mastery:'solid', due:false,
      prompt:'Fixed-size sliding window: state the invariant and why it is O(n) not O(nk).',
      src:'CSES §8.2 Sliding window · p.89',
      answer:'The invariant is that the window always holds exactly k consecutive elements and you maintain its aggregate incrementally. Each step adds the entering element and removes the leaving one in O(1), so every element is added once and removed once — 2n operations total, hence O(n). Recomputing the aggregate from scratch each step would be the O(nk) naive version.' },

    { id:'winvar', mins:15, mastery:'shaky', due:true,
      prompt:'Variable-size sliding window (e.g. longest substring satisfying a constraint): describe the loop shape and when you shrink.',
      src:'CSES §8.2 Sliding window · p.89',
      answer:'Outer loop expands the right edge one element at a time, always adding to the window state. An inner while loop shrinks from the left as long as the window VIOLATES the constraint. After shrinking, the window is valid, so record the answer. Each pointer only moves forward across the whole run, so it is O(n) despite the nested loop. The tell: "longest/shortest subarray such that ..." with a constraint monotone in window size.' },

    { id:'binans', mins:15, mastery:'learning', due:true,
      prompt:'Binary search on the ANSWER: what problem shape signals it, and what must be true of the predicate?',
      src:'Skiena Ch.4 Sorting and searching · p.115',
      answer:'The signal is "minimize the maximum ..." or "find the smallest capacity/speed/time such that X is feasible" — you are searching the answer space, not an array. The predicate feasible(x) must be MONOTONE: if x works, every larger x works (or vice versa). Then binary search the value range, calling feasible() as the test, giving O(log(range) × cost of check). Getting the monotonicity argument right is the whole problem; the search itself is boilerplate.' },

    { id:'monostack', mins:30, mastery:'new', due:true,
      prompt:'Monotonic stack: what class of problems does it solve, and what invariant does the stack keep?',
      src:'CSES §8.3 Nearest smaller elements · p.91',
      answer:'It answers "nearest smaller/greater element" and "next warmer day" style queries in O(n). The stack keeps its elements in monotonic order (say increasing): before pushing x you pop everything that x invalidates — every popped element has just found x as its nearest greater element to the right. Each index is pushed and popped at most once, so the whole sweep is O(n) despite the inner while.' },

    { id:'prefix', mins:5, mastery:'learning', due:true,
      prompt:'Prefix sums / difference arrays: what does each precompute, and which query shape does each make O(1)?',
      src:'CSES §7 Range queries · p.79',
      answer:'A prefix-sum array stores cumulative totals so any range sum is pre[r] − pre[l−1] in O(1) after O(n) build — good for many range-sum queries on a static array. A difference array is the dual: it stores deltas so you add v to a whole range [l,r] in O(1) by adjusting two endpoints, then a single prefix pass materializes the final array — good for many range-updates, one readout.' },

    { id:'kadane', mins:5, mastery:'mastered', due:false,
      prompt:'Kadane’s algorithm: what subproblem does it track, and why is the greedy reset correct?',
      src:'CLRS §4.1 Maximum subarray · p.68',
      answer:'It tracks best(i) = the largest subarray sum ENDING at index i. The recurrence is best(i) = max(a[i], best(i−1) + a[i]): either extend the previous run or start fresh at i. Starting fresh is correct precisely when best(i−1) is negative — a negative prefix can only hurt any future extension, so dropping it never loses the optimum. The global answer is the max over all best(i), in O(n).' }
  ];
  var DUE_TOTAL = DECK.filter(function(c){return c.due}).length; // 5

  // ---- els / helpers ----
  var $=function(id){return document.getElementById(id)};
  var toastEl=$('toast'), tTimer;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(tTimer);
    tTimer=setTimeout(function(){toastEl.classList.remove('show');},1800); }

  function effortSvg(){ return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 2h6"/></svg>'; }

  // Build the reveal/grade body for a card element. onGrade(gid) called after grading.
  function wireCard(article, c, opts){
    opts = opts || {};
    var mcolor = MCOLOR[c.mastery];
    article.innerHTML =
      '<div class="qc-top">'+
        '<span class="mastery-chip"><span class="dot2" style="background:'+mcolor+'"></span>'+
          '<span class="mword" style="color:'+mcolor+'">'+c.mastery+'</span></span>'+
        '<span class="effort-chip">'+effortSvg()+c.mins+' min</span>'+
      '</div>'+
      '<p class="prompt">'+c.prompt+'</p>'+
      '<div class="src">'+c.src+'</div>'+
      '<div class="answer-wrap"><div class="answer-inner"><div class="answer">'+
        '<div class="bar"></div>'+
        '<div><div class="label">Model answer</div><div class="body">'+c.answer+'</div></div>'+
      '</div></div></div>'+
      '<div class="actions"><button class="btn-reveal" type="button">Reveal <span class="k" aria-hidden="true">R</span></button></div>';

    var actions = article.querySelector('.actions');
    var wrap = article.querySelector('.answer-wrap');
    var revealed=false, locked=false;

    function reveal(){
      if(revealed) return; revealed=true;
      wrap.classList.add('open');
      actions.innerHTML =
        '<div class="grades">'+
          GRADES.map(function(g){ return (
            '<button class="grade" type="button" data-g="'+g.id+'" aria-label="'+g.label+'">'+
              '<span class="g">'+g.label+'</span><span class="hint">'+g.hint+'</span></button>'); }).join('')+
        '</div>';
      Array.prototype.forEach.call(actions.querySelectorAll('.grade'), function(b){
        b.addEventListener('click', function(){ if(locked) return; locked=true; onGrade(b.getAttribute('data-g')); });
      });
    }
    function onGrade(gid){
      var g = GRADES.filter(function(x){return x.id===gid})[0];
      if(opts.onGrade){ opts.onGrade(gid,g); return; }
      // default (topic stack): show note, mark reviewed
      article.classList.add('reviewed');
      actions.innerHTML = '<div class="card-note">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3BB98C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
        g.label+' · back in '+g.hint+'</div>';
    }
    article.querySelector('.btn-reveal').addEventListener('click', reveal);
    return { reveal:reveal };
  }

  // ---- Topic card stack (filtered by effort) ----
  var effortFilter='all';
  function renderStack(){
    var stack=$('cardStack'); stack.innerHTML='';
    var list = DECK.filter(function(c){ return effortFilter==='all' || String(c.mins)===effortFilter; });
    if(!list.length){ stack.innerHTML='<div class="tile-hint" style="margin-left:0">No '+effortFilter+' min cards in this topic.</div>'; return; }
    list.forEach(function(c){
      var art=document.createElement('article'); art.className='qcard';
      stack.appendChild(art);
      wireCard(art, c);
    });
  }

  // ---- Focused review (capped one-up session) ----
  var CAP = 10;
  var session=null, rIdx=0;
  function startReview(){
    var due = DECK.filter(function(c){return c.due});
    session = due.slice(0, Math.min(due.length, CAP)).map(function(c){ return {card:c, grade:null}; });
    rIdx=0;
    setScreen('review');
    renderReviewCard(true);
  }
  function setRvProgress(){
    var n=session.length;
    $('rvCount').innerHTML='<b>'+Math.min(rIdx+1,n)+'</b> of '+n;
    $('rvFill').style.width=(rIdx/n*100)+'%';
  }
  function renderReviewCard(first){
    var stage=$('rvStage');
    setRvProgress();
    var s=session[rIdx];
    stage.innerHTML='';
    var art=document.createElement('article'); art.className='qcard rv-card';
    stage.appendChild(art);
    wireCard(art, s.card, { onGrade:function(gid,g){
      s.grade=gid;
      $('rvFill').style.width=((rIdx+1)/session.length*100)+'%';
      var delay = reduceMotion ? 120 : (gid==='again'||gid==='hard' ? 560 : 400);
      if(!reduceMotion) art.classList.add('recede');
      setTimeout(function(){
        rIdx++;
        if(rIdx>=session.length){ renderDone(); }
        else { renderReviewCard(false); }
      }, delay);
    }});
    if(!first && !reduceMotion){
      art.classList.add('enter'); void art.offsetWidth;
      requestAnimationFrame(function(){ art.classList.remove('enter'); });
    }
  }
  function renderDone(){
    $('rvCount').innerHTML='<b>'+session.length+'</b> of '+session.length;
    $('rvFill').style.width='100%';
    var solid=0, shaky=0, learn=0;
    session.forEach(function(s){
      var m=s.card.mastery;
      if(m==='solid'||m==='mastered') solid++;
      else if(m==='new'||m==='shaky') shaky++;
      else learn++;
    });
    $('rvStage').innerHTML =
      '<div class="done-panel">'+
        '<div class="eyebrow">Reviewed</div>'+
        '<h1>Done for today.</h1>'+
        '<div class="ledger">'+
          '<span class="c-solid">'+solid+' solid</span> <span class="sep">·</span> '+
          '<span class="c-learn">'+learn+' learning</span> <span class="sep">·</span> '+
          '<span class="c-shaky">'+shaky+' shaky</span>'+
        '</div>'+
        '<button class="done-back" type="button" data-goto="topic">Back to topic</button>'+
      '</div>';
  }

  // ---- screen switching ----
  var SCREENS={landing:'s-landing', topic:'s-topic', review:'s-review'};
  function setScreen(name){
    Object.keys(SCREENS).forEach(function(k){ $(SCREENS[k]).classList.toggle('active', k===name); });
    Array.prototype.forEach.call(document.querySelectorAll('.switcher button'), function(b){
      b.setAttribute('aria-current', b.getAttribute('data-screen')===name ? 'true':'false');
    });
    if(name==='topic') renderStack();
    window.scrollTo(0,0);
  }

  // ---- events ----
  $('continueBtn').addEventListener('click', function(){ toast('Today’s path'); });
  $('meter').addEventListener('click', function(){ toast('Progress'); });
  $('reviewRow').addEventListener('click', startReview);
  $('gymLink').addEventListener('click', function(){ toast('🎧 Gym — curated videos & readings (coming soon)'); });

  // topic tiles → drill in
  Array.prototype.forEach.call(document.querySelectorAll('.tile[data-topic]'), function(t){
    t.addEventListener('click', function(){
      if(t.getAttribute('data-topic')==='algo'){ setScreen('topic'); }
      else { toast('Open topic: '+t.querySelector('.t-name').textContent); }
    });
  });

  // effort filter
  Array.prototype.forEach.call(document.querySelectorAll('.effort-filter .seg button'), function(b){
    b.addEventListener('click', function(){
      effortFilter=b.getAttribute('data-effort');
      Array.prototype.forEach.call(document.querySelectorAll('.effort-filter .seg button'), function(x){
        x.setAttribute('aria-pressed', x===b ? 'true':'false');
      });
      renderStack();
    });
  });

  // back / done navigation
  document.body.addEventListener('click', function(e){
    var g=e.target.closest('[data-goto]');
    if(g){ setScreen(g.getAttribute('data-goto')); }
  });

  // bottom switcher
  Array.prototype.forEach.call(document.querySelectorAll('.switcher button'), function(b){
    b.addEventListener('click', function(){
      var name=b.getAttribute('data-screen');
      if(name==='review'){ startReview(); }
      else { setScreen(name); }
    });
  });

  // sync counts
  $('topicDue').textContent = DUE_TOTAL+' due';
  $('reviewRowCount').textContent = DUE_TOTAL+' due';

  setScreen('landing');
})();
</script>
</body>
</html>
