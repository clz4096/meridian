<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Lantern — Meridian Knowledge</title>
<style>
/* ── Meridian tokens (from src/styles/app.css :root) ─────────────────────── */
:root{
  --void:#070B14; --bg:var(--void);
  --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
  --hub:#F2B25C;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#DCE6F2; --muted:#8FA3BE; --dim:#727D8E; --faint:#5C7291;
  --teal:#7CC9EC; --tealSoft:#0d1c2b; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
  --protein:#A78BEA;
  --slate:#5C6678; /* new-topic ring */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.22s;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ── page shell — generous whitespace, quiet grey ─────────────────────────── */
.ln-wrap{max-width:1120px;margin:0 auto;padding:clamp(28px,7vw,64px) clamp(16px,5vw,40px) 40px}

/* (1) greeting — small, warm */
.ln-greet{font-size:14px;color:var(--muted);letter-spacing:.01em;margin:0}
.ln-greet b{color:var(--text);font-weight:600}

/* (2) study-next — the ONE saturated element, lots of room around it */
.ln-next{margin:clamp(20px,5vw,34px) 0 clamp(28px,6vw,42px);font-size:clamp(21px,4.6vw,30px);line-height:1.25;letter-spacing:-.015em;color:var(--muted);font-weight:500}
.ln-next-label{color:var(--muted);font-weight:500}
.ln-topic{display:inline;font:inherit;color:var(--fuel);font-weight:700;background:none;border:0;padding:2px 2px;margin:0 -2px;cursor:pointer;border-radius:8px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--fuel) 40%,transparent);text-underline-offset:5px;text-decoration-thickness:2px;transition:color var(--dur) var(--ease),text-decoration-color var(--dur) var(--ease)}
.ln-topic:hover{color:#efc06b;text-decoration-color:var(--fuel)}
.ln-topic:focus-visible{outline:2px solid var(--fuel);outline-offset:3px}
/* all-caught-up variant */
.ln-next.caught{color:var(--ok);font-weight:700}
.ln-caught-sub{display:block;margin-top:8px;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}

/* (3) one thin progress line — one honest number, one fill */
.ln-prog{margin:0 0 clamp(30px,7vw,48px);max-width:520px}
.ln-bar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.ln-bar>span{display:block;height:100%;border-radius:var(--r-pill);background:var(--teal);transition:width .5s var(--ease)}
.ln-prog-lbl{margin-top:10px;font-size:13px;color:var(--muted)}
.ln-prog-lbl .n{font-family:var(--mono);color:var(--text);font-variant-numeric:tabular-nums}

/* (4) topic grid — replicated verbatim from .tov-* in src/styles/app.css ──── */
.tov-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;grid-auto-rows:1fr;padding:2px 0 8px}
@media(min-width:520px){.tov-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.tov-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1040px){.tov-grid{grid-template-columns:repeat(5,1fr)}}
.tov-card{display:flex;height:100%}
.tov-cardlink{display:flex;flex-direction:column;gap:6px;width:100%;height:100%;padding:10px 11px 11px;border:1px solid var(--line);border-left:3px solid var(--tint,var(--line-2));border-radius:12px;background:var(--surface-1);cursor:pointer;color:inherit;text-align:left;font:inherit;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform .14s var(--ease)}
.tov-cardlink:hover{background:var(--surface-2);border-color:var(--line-2);border-left-color:var(--tint);transform:translateY(-2px)}
.tov-top{display:flex;align-items:center;gap:6px}
.tov-dom{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tov-swatch{width:8px;height:8px;border-radius:2px;flex:none}
.tov-spacer{flex:1}
.tov-fmark{display:inline-flex;flex:none}
.tov-fmark svg{width:12px;height:12px}
.tov-fmark.ready{color:var(--teal)}
.tov-fmark.near{color:var(--dim)}
.tov-newdot{flex:none;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.tov-newdot i{width:6px;height:6px;border-radius:50%;background:var(--slate);flex:none}
.tov-badge{flex:none;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--teal);background:rgba(124,201,236,.14);border-radius:var(--r-pill);padding:2px 8px;line-height:1.5}
.tov-pulse{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.tov-badge.clear{color:var(--ok);background:rgba(59,185,140,.13)}
.tov-mid{display:flex;align-items:center;gap:10px;min-width:0}
.tov-ring{width:46px;height:46px;flex:none}
.tov-ring-pct{font-family:var(--mono);font-weight:800;letter-spacing:-.03em}
.tov-nameblock{display:flex;flex-direction:column;gap:1px;min-width:0}
.tov-name{font-size:13.5px;line-height:1.2;letter-spacing:-.01em;font-weight:700;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tov-meta{font-size:11px;color:var(--muted)}
.tov-open{color:var(--dim)}
.tov-mastery{margin-top:auto;display:flex;align-items:center;gap:8px}
.tov-track{flex:1;height:5px;background:var(--surface-3);border-radius:var(--r-pill);overflow:hidden}
.tov-track>span{display:block;height:100%;border-radius:var(--r-pill)}
.tov-word{flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.tov-cardlink:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}

/* footer — a single tucked muted link */
.ln-foot{margin-top:clamp(24px,6vw,38px)}
.ln-progresslink{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:8px 4px;margin-left:-4px;cursor:pointer;border-radius:8px}
.ln-progresslink:hover,.ln-progresslink:focus-visible{color:var(--text);text-decoration:underline;outline:none}
.ln-progresslink:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* demo-state toggle — parked at the very bottom, visually detached */
.ln-demo{margin-top:clamp(40px,10vw,72px);padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ln-demo-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ln-demo-seg{display:inline-flex;gap:4px;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px}
.ln-demo-seg button{min-height:34px;padding:6px 14px;border:0;background:none;border-radius:var(--r-pill);font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.ln-demo-seg button:hover{color:var(--text)}
.ln-demo-seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.ln-demo-seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* toast */
.ln-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);z-index:80;max-width:min(88vw,420px);padding:12px 18px;border-radius:14px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--text);font-size:13.5px;box-shadow:0 18px 44px -18px rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.ln-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main class="ln-wrap">
  <!-- (1) greeting -->
  <p class="ln-greet">Evening, <b>Albert</b>.</p>

  <!-- (2) study-next — the one bright element -->
  <p class="ln-next" id="ln-next"></p>

  <!-- (3) one honest progress line -->
  <div class="ln-prog">
    <div class="ln-bar" role="img" id="ln-bar-wrap" aria-label="">
      <span id="ln-bar-fill"></span>
    </div>
    <p class="ln-prog-lbl" id="ln-prog-lbl"></p>
  </div>

  <!-- (4) the shipped topic grid -->
  <div class="tov-grid" id="ln-grid"></div>

  <!-- tucked footer link -->
  <div class="ln-foot">
    <button type="button" class="ln-progresslink" data-toast="Progress opens your mastery, retention & study-day charts">Progress →</button>
  </div>

  <!-- demo-state toggle (prototype only) -->
  <div class="ln-demo" role="group" aria-label="Demo state">
    <span class="ln-demo-lbl">Demo state</span>
    <div class="ln-demo-seg" id="ln-demo-seg">
      <button type="button" data-state="default" aria-pressed="true">Default</button>
      <button type="button" data-state="caught" aria-pressed="false">All caught up</button>
      <button type="button" data-state="growing" aria-pressed="false">Growing curriculum</button>
    </div>
  </div>
</main>

<div class="ln-toast" id="ln-toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  // domain → tint (Theory violet · Systems teal · ML amber · Career green)
  var TINT = { Theory:"var(--protein)", Systems:"var(--teal)", ML:"var(--fuel)", Career:"var(--ok)" };

  // real 15 topics — counts sum to 268, mastered (solid) sum to 34
  var TOPICS = [
    { name:"Algorithms / LC",     domain:"Theory",  count:30, mastered:12, due:4 },
    { name:"Graph Theory",        domain:"Theory",  count:16, mastered:2,  due:0 },
    { name:"Prob & Stats",        domain:"Theory",  count:18, mastered:5,  due:2 },
    { name:"C++",                 domain:"Systems", count:28, mastered:9,  due:3 },
    { name:"Concurrency",         domain:"Systems", count:20, mastered:3,  due:5 },
    { name:"Comp Arch",           domain:"Systems", count:16, mastered:0,  due:0 },
    { name:"Databases",           domain:"Systems", count:22, mastered:2,  due:6 },
    { name:"System Design",       domain:"Systems", count:24, mastered:0,  due:0 },
    { name:"Networking",          domain:"Systems", count:18, mastered:0,  due:2 },
    { name:"Linux",               domain:"Systems", count:16, mastered:0,  due:0 },
    { name:"Distributed Systems", domain:"Systems", count:18, mastered:0,  due:3 },
    { name:"Compilers",           domain:"Systems", count:12, mastered:0,  due:0 },
    { name:"ML Fundamentals",     domain:"ML",      count:16, mastered:0,  due:0 },
    { name:"GPUs / TPUs",         domain:"ML",      count:8,  mastered:0,  due:0 },
    { name:"Behavioral",          domain:"Career",  count:6,  mastered:1,  due:1 }
  ];

  // two topics that surface only in the "growing curriculum" state (slate new ring)
  var NEW_TOPICS = [
    { name:"Operating Systems", domain:"Systems", count:14, mastered:0, due:0, isNew:true },
    { name:"Information Theory", domain:"Theory", count:6,  mastered:0, due:0, isNew:true }
  ];

  function pct(t){ return t.count ? Math.round(100 * t.mastered / t.count) : 0; }

  // mastery ramp — always colour AND word (matches masteryTone in KnowledgeTab.tsx)
  function tone(p){
    if (p >= 60) return { color:"var(--ok)",      word:"Solid",    aria:"solid grasp" };
    if (p >= 25) return { color:"var(--fuel)",    word:"Building", aria:"building fluency" };
    return            { color:"var(--deficit)", word:"Early",    aria:"just getting started" };
  }

  function ring(p, color){
    var r = 28, C = 2 * Math.PI * r, off = C * (1 - p / 100);
    return '<svg class="tov-ring" viewBox="0 0 68 68" aria-hidden="true">'
      + '<circle cx="34" cy="34" r="28" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="6"/>'
      + '<circle cx="34" cy="34" r="28" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round"'
      + ' stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 34 34)"/>'
      + '<text class="tov-ring-pct" x="34" y="35" text-anchor="middle" dominant-baseline="middle" font-size="19" fill="var(--text)">' + p + '</text>'
      + '</svg>';
  }

  // living-curriculum cue: spark on solid topics, up-tick on climbers
  function fmark(p){
    if (p >= 60) return '<span class="tov-fmark ready" title="Deeper questions ready to generate" aria-label="deeper questions ready to generate">'
      + '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.6 5.2L19 10l-5.4 1.8L12 17l-1.6-5.2L5 10l5.4-1.8L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>';
    if (p >= 40) return '<span class="tov-fmark near" title="Nearing a deeper question set" aria-label="nearing a deeper question set">'
      + '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    return '';
  }

  function card(t, caughtUp){
    var tint = TINT[t.domain];
    var p = pct(t);
    var due = caughtUp ? 0 : t.due;
    var ringColor = t.isNew ? "var(--slate)" : tone(p).color;
    var trackColor = t.isNew ? "var(--slate)" : tone(p).color;
    var word = t.isNew ? "New" : tone(p).word;
    var wordColor = t.isNew ? "var(--slate)" : tone(p).color;

    var top = '<span class="tov-dom" style="color:' + tint + '"><span class="tov-swatch" style="background:' + tint + '" aria-hidden="true"></span>' + t.domain + '</span>';
    top += t.isNew ? '<span class="tov-newdot" aria-hidden="true"><i></i>new</span>' : fmark(p);
    top += '<span class="tov-spacer"></span>';
    top += due > 0
      ? '<span class="tov-badge" aria-hidden="true"><span class="tov-pulse"></span>' + due + '</span>'
      : '<span class="tov-badge clear" aria-hidden="true">✓</span>';

    var dueLabel = t.isNew ? "just added" : (due > 0 ? due + " due for review" : "all caught up");
    var aria = t.isNew
      ? t.name + ", " + t.domain + ", just added. " + t.count + " questions. Not started yet."
      : t.name + ", " + t.domain + ". " + t.count + " questions, " + dueLabel + ". Mastery " + p + " percent, " + tone(p).aria + ".";

    return '<article class="tov-card"><button class="tov-cardlink" style="--tint:' + tint + '" aria-label="' + aria.replace(/"/g,'&quot;') + '"'
      + ' data-toast="' + t.name.replace(/"/g,'&quot;') + ' — opens the topic study view">'
      + '<span class="tov-top">' + top + '</span>'
      + '<span class="tov-mid">' + ring(t.isNew ? 0 : p, ringColor)
      + '<span class="tov-nameblock"><span class="tov-name">' + t.name + '</span>'
      + '<span class="tov-meta">' + t.count + ' q<span class="tov-open"> · growing</span></span></span></span>'
      + '<span class="tov-mastery"><span class="tov-track"><span style="width:' + (t.isNew ? 0 : p) + '%;background:' + trackColor + '"></span></span>'
      + '<span class="tov-word" style="color:' + wordColor + '">' + word + '</span></span>'
      + '</button></article>';
  }

  // ── toast ────────────────────────────────────────────────────────────────
  var toastEl = document.getElementById("ln-toast"), toastT;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove("on"); }, 2400);
  }

  // ── render for a given state ───────────────────────────────────────────────
  var STUDY_NEXT = "Concurrency"; // most-due, still-early topic

  function render(state){
    var caughtUp = state === "caught";
    var growing  = state === "growing";
    var list = growing ? NEW_TOPICS.concat(TOPICS) : TOPICS.slice();

    // (2) study-next line
    var nextEl = document.getElementById("ln-next");
    if (caughtUp){
      nextEl.className = "ln-next caught";
      nextEl.innerHTML = "You’re all caught up.<span class=\"ln-caught-sub\">Review anything below.</span>";
    } else {
      nextEl.className = "ln-next";
      nextEl.innerHTML = '<span class="ln-next-label">Study next: </span>'
        + '<button type="button" class="ln-topic" id="ln-topic-btn">' + STUDY_NEXT + '</button>';
      document.getElementById("ln-topic-btn").addEventListener("click", function(){
        toast("Launches Today’s path — your FSRS-paced session for " + STUDY_NEXT + ".");
      });
    }

    // (3) progress — one honest number + one fill
    var totalQ = list.reduce(function(n, t){ return n + t.count; }, 0);
    var solidQ = list.reduce(function(n, t){ return n + t.mastered; }, 0); // 34
    var fillPct = totalQ ? (100 * solidQ / totalQ) : 0;
    document.getElementById("ln-bar-fill").style.width = fillPct.toFixed(1) + "%";
    document.getElementById("ln-prog-lbl").innerHTML =
      '<span class="n">' + solidQ + '</span> of <span class="n">' + totalQ + '</span> questions solid';
    document.getElementById("ln-bar-wrap").setAttribute("aria-label",
      solidQ + " of " + totalQ + " questions solid");

    // (4) grid
    document.getElementById("ln-grid").innerHTML = list.map(function(t){ return card(t, caughtUp); }).join("");
  }

  // ── delegated taps: cards + footer show placeholder toasts ─────────────────
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-toast]");
    if (el){ toast(el.getAttribute("data-toast")); }
  });

  // ── demo-state toggle ──────────────────────────────────────────────────────
  var seg = document.getElementById("ln-demo-seg");
  seg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-state]");
    if (!b) return;
    Array.prototype.forEach.call(seg.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", String(x === b));
    });
    render(b.getAttribute("data-state"));
  });

  render("default");
})();
</script>
</body>
</html>
