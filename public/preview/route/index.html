<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian · The Route</title>
<style>
:root{
  --bg:#070B14; --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
  --text:#DCE6F2; --muted:#8FA3BE; --dim:#727D8E; --faint:#5C7291;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --teal:#7CC9EC; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
  --protein:#A78BEA; --hub:#F2B25C;
  /* mastery */
  --m-new:#5C6678; --m-shaky:#D8654F; --m-learning:#E0A64B; --m-solid:#6BBF73; --m-mastered:#4FB0A5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r8:8px; --r12:12px; --r16:16px; --r999:999px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  overflow-x:hidden;
}
/* warm base-camp glow at the top of the climb */
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:340px; pointer-events:none; z-index:0;
  background:radial-gradient(120% 90% at 50% -10%, rgba(242,178,92,.10), rgba(242,178,92,0) 60%);
}
.wrap{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:20px 16px 40px;}
button{font-family:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--hub); outline-offset:2px; border-radius:6px}

/* ---------- status line ---------- */
.status{font-size:14px; color:var(--muted); margin:2px 2px 16px; letter-spacing:.1px}
.status .g{color:var(--text)}
.status .alt{color:var(--text); font-weight:600}
.status .tail{color:var(--dim); font-family:var(--mono); font-size:12px; white-space:nowrap}
.status .sep{color:var(--faint); margin:0 6px}

/* ---------- next move card ---------- */
.nextmove{
  background:linear-gradient(180deg, var(--surface-2), #1b2028);
  border:1px solid var(--line-2);
  border-radius:var(--r16); padding:18px 18px 16px; margin-bottom:22px;
  box-shadow:0 0 0 1px rgba(242,178,92,.06), 0 14px 40px -20px rgba(242,178,92,.35), 0 10px 30px -18px rgba(0,0,0,.8);
  position:relative; overflow:hidden;
}
.nextmove::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(80% 120% at 100% 0%, rgba(242,178,92,.10), transparent 60%);
}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--hub); text-transform:uppercase; margin-bottom:8px; position:relative}
.rec{font-size:21px; line-height:1.3; letter-spacing:-.2px; margin:0 0 4px; position:relative}
.rec b{font-weight:700; color:var(--text)}
.rec .lead{color:var(--muted); font-weight:500}
.reason{display:flex; align-items:baseline; gap:8px; color:var(--muted); font-size:14px; margin:6px 0 16px; position:relative}
.reason .mdot{position:relative; top:1px}
.reason .mword{font-weight:600}
.btns{display:flex; gap:10px; position:relative}
.btn{
  flex:1; min-height:46px; border-radius:var(--r12); font-size:14.5px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  border:1px solid transparent; transition:transform .08s ease, filter .15s ease, background .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--hub); color:#241a08; border-color:rgba(0,0,0,.15); box-shadow:0 6px 18px -8px rgba(242,178,92,.7)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary[disabled]{background:var(--surface-3); color:var(--dim); box-shadow:none; cursor:default; border-color:var(--line)}
.btn-secondary{background:transparent; color:var(--text); border-color:var(--line-2); flex:0 1 auto; padding:0 16px}
.btn-secondary:hover{background:var(--surface-1)}

/* ---------- spine ---------- */
.spine{position:relative; padding-left:2px; margin-bottom:8px}
/* subtle vertical connector — no altitude/fill, just threads the camps */
.rail{position:absolute; left:21px; width:2px; border-radius:2px; top:26px; bottom:24px; background:var(--line-2)}

.frontier{position:relative; display:flex; gap:12px; align-items:flex-start; padding:4px 0 10px}
.frontier .node-rail{width:40px; flex:none; display:flex; justify-content:center; padding-top:2px}
.fnode{
  width:22px; height:22px; border-radius:var(--r999);
  border:1.5px dashed rgba(124,201,236,.55);
  background:radial-gradient(circle at 50% 40%, rgba(124,201,236,.35), rgba(124,201,236,.04));
  position:relative; z-index:2;
  animation:shimmer 3.4s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{box-shadow:0 0 6px rgba(124,201,236,.25)}50%{box-shadow:0 0 16px rgba(124,201,236,.6)}}
.frontier .ftext{padding-top:1px}
.frontier .ftitle{font-size:13.5px; color:var(--teal); font-weight:600; letter-spacing:.2px}
.frontier .fsub{font-size:12.5px; color:var(--dim); margin-top:1px}

.node{position:relative; display:flex; gap:12px; align-items:flex-start; margin:2px 0}
.node-rail{width:40px; flex:none; display:flex; justify-content:center}
.dot{
  width:16px; height:16px; border-radius:var(--r999); position:relative; z-index:2;
  margin-top:15px; border:2px solid var(--bg);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.dot svg{width:9px; height:9px}
.node.here .dot{
  width:20px; height:20px; margin-top:13px;
  box-shadow:0 0 0 4px rgba(242,178,92,.16), 0 0 14px rgba(242,178,92,.55);
}

.camp{flex:1; min-width:0}
.camp-head{
  width:100%; text-align:left; background:transparent; border:0; padding:12px 6px; border-radius:var(--r12);
  display:flex; align-items:center; gap:10px; min-height:48px; transition:background .15s ease;
}
.camp-head:hover{background:var(--surface-1)}
.camp-title{font-size:15px; font-weight:600; letter-spacing:.1px}
.camp-num{font-family:var(--mono); font-size:11px; color:var(--faint); margin-right:2px}
.camp-sub{font-size:12px; color:var(--dim); margin-top:2px}
.camp-meta{margin-left:auto; display:flex; align-items:center; gap:8px}
.chip{
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--r999);
  border:1px solid var(--line); color:var(--muted); white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.chip .cdot{width:7px; height:7px; border-radius:50%}
.chev{width:16px; height:16px; color:var(--dim); transition:transform .2s ease; flex:none}
.camp.open .chev{transform:rotate(180deg)}

.node.climbed{opacity:.62}
.node.climbed .camp-title{color:var(--muted)}
.node.ahead{opacity:.5}
.node.ahead .camp-title{color:var(--muted)}
.node.here .camp-head{background:linear-gradient(180deg, rgba(242,178,92,.07), rgba(242,178,92,.02)); box-shadow:inset 0 0 0 1px rgba(242,178,92,.18)}
.node.here .camp-title{color:var(--text)}
.youare{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--hub); background:rgba(242,178,92,.12); border:1px solid rgba(242,178,92,.3);
  padding:3px 8px; border-radius:var(--r999); white-space:nowrap;
}

/* topics */
.topics{overflow:hidden; transition:height .28s ease}
.topics-inner{padding:4px 2px 10px}
.trow{
  width:100%; text-align:left; background:transparent; border:0; border-radius:10px;
  display:flex; align-items:center; gap:10px; padding:9px 10px; min-height:44px; transition:background .13s ease;
}
.trow:hover{background:var(--surface-1)}
.tdot{width:9px; height:9px; border-radius:50%; flex:none}
.tword{font-size:12px; font-weight:600; width:62px; flex:none}
.ttitle{font-size:14px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tdue{
  font-family:var(--mono); font-size:11px; font-weight:600; color:var(--deficit);
  background:rgba(216,101,79,.13); border:1px solid rgba(216,101,79,.28);
  padding:2px 8px; border-radius:var(--r999); flex:none;
}

/* milestone banner */
.milestone{
  position:relative; margin:2px 0 2px 52px; padding:7px 12px;
  font-size:12px; color:var(--dim);
  border-left:2px solid var(--line-2);
  background:linear-gradient(90deg, rgba(255,255,255,.02), transparent);
  border-radius:0 8px 8px 0;
}
.milestone b{color:var(--muted); font-weight:600}

.ghostline{margin:6px 0 6px 52px; font-size:12px; color:var(--faint)}

/* footer */
.foot{margin-top:14px}
.footdoor{
  width:100%; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r12);
  padding:14px 16px; display:flex; align-items:center; gap:8px; min-height:50px;
  font-size:14px; color:var(--muted); font-weight:500; transition:background .15s ease;
}
.footdoor:hover{background:var(--surface-2)}
.footdoor .arr{margin-left:auto; color:var(--dim)}

/* demo toggle */
.demo{
  margin:26px auto 0; display:flex; gap:4px; padding:4px; width:max-content;
  background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r999);
}
.demo-label{display:block; text-align:center; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin:28px 0 8px}
.demo button{
  border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600;
  padding:8px 14px; border-radius:var(--r999); min-height:36px; transition:background .15s, color .15s;
}
.demo button[aria-pressed="true"]{background:var(--surface-3); color:var(--text)}

/* toast */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px);
  background:var(--surface-3); color:var(--text); border:1px solid var(--line-2);
  padding:11px 16px; border-radius:var(--r999); font-size:13.5px; font-weight:500;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.8); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:90vw;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast .tk{color:var(--hub); font-weight:700}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important}
  .topics, .rail-fill, .btn, .chev, .toast, .camp-head, .trow, .footdoor{transition:none !important}
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="status" id="status"></div>

  <section class="nextmove" aria-labelledby="nm-eyebrow">
    <div class="eyebrow" id="nm-eyebrow">Study next</div>
    <p class="rec" id="nm-rec"></p>
    <div class="reason" id="nm-reason"></div>
    <div class="btns">
      <button class="btn btn-primary" id="nm-primary"></button>
      <button class="btn btn-secondary" id="nm-secondary">Just this topic →</button>
    </div>
  </section>

  <section class="spine" id="spine" aria-label="Your route — current camp, then what's next, with finished camps at the bottom">
    <div class="rail" aria-hidden="true"></div>
    <div id="spine-body"></div>
  </section>

  <div class="foot">
    <button class="footdoor" id="footdoor">See your climb <span class="arr">→</span></button>
  </div>

  <div class="demo-label">Demo state</div>
  <div class="demo" role="group" aria-label="Demo state">
    <button data-state="mid" aria-pressed="true">Mid-climb</button>
    <button data-state="fresh" aria-pressed="false">Fresh</button>
    <button data-state="caught" aria-pressed="false">Caught up</button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const MASTERY = {
  new:      {word:"new",      color:"var(--m-new)"},
  shaky:    {word:"shaky",    color:"var(--m-shaky)"},
  learning: {word:"learning", color:"var(--m-learning)"},
  solid:    {word:"solid",    color:"var(--m-solid)"},
  mastered: {word:"mastered", color:"var(--m-mastered)"},
};

// --- topic sets (reused across states, tuned per state) ---
function t(title, mastery, due){ return {title, mastery, due:due||0}; }

// camp factory
function camp(o){ o.type = "camp"; return o; }
const FRONTIER = { type:"frontier", title:"New terrain forming", sub:"unlocks as you master ML" };

// Spine reads TOP → BOTTOM: current camp first, then what's next flowing down,
// then the frontier, then finished camps (dimmed) at the bottom.
const SPINE_MID = [
  camp({ num:3, name:"Applied Systems", state:"here",
    fill:{word:"in progress", color:"var(--hub)"},
    milestone:'<b>Applied</b> — 1 of 5 solid · finish it to unlock Machine Learning.',
    topics:[
      t("Databases","solid",1),
      t("System Design","learning",2),
      t("Networking","learning",2),
      t("Distributed Systems","shaky",4),
      t("Compilers","new"),
    ] }),
  camp({ num:4, name:"Machine Learning", state:"ahead",
    fill:{word:"next up", color:"var(--m-new)"},
    topics:[ t("ML Fundamentals","new"), t("GPUs / TPUs","new") ] }),
  camp({ num:5, name:"Career", state:"ahead",
    fill:{word:"later", color:"var(--m-new)"},
    topics:[ t("Behavioral","new") ] }),
  FRONTIER,
  camp({ num:2, name:"Core Systems", state:"climbed",
    fill:{word:"solid", color:"var(--m-solid)"},
    milestone:'<b>Core Systems</b> — 4 of 4 solid · done.',
    topics:[
      t("C++","mastered"), t("Concurrency / Parallel","solid",1),
      t("Comp Arch / Assembly","solid"), t("Linux / Systems","solid"),
    ] }),
  camp({ num:1, name:"Foundations", state:"climbed",
    fill:{word:"mastered", color:"var(--m-mastered)"},
    topics:[
      t("Algorithms / LC","mastered"), t("Graph Theory","solid",1), t("Prob & Stats","solid"),
    ] }),
];

const SPINE_CAUGHT = [
  camp({ num:3, name:"Applied Systems", state:"here",
    fill:{word:"in progress", color:"var(--hub)"},
    milestone:'<b>Applied</b> — 2 of 5 solid · finish it to unlock Machine Learning.',
    topics:[
      t("Databases","solid"), t("System Design","solid"), t("Networking","learning"),
      t("Distributed Systems","learning"), t("Compilers","new"),
    ] }),
  camp({ num:4, name:"Machine Learning", state:"ahead", fill:{word:"next up", color:"var(--m-new)"},
    topics:[ t("ML Fundamentals","new"), t("GPUs / TPUs","new") ] }),
  camp({ num:5, name:"Career", state:"ahead", fill:{word:"later", color:"var(--m-new)"},
    topics:[ t("Behavioral","new") ] }),
  FRONTIER,
  camp({ num:2, name:"Core Systems", state:"climbed", fill:{word:"solid", color:"var(--m-solid)"},
    milestone:'<b>Core Systems</b> — 4 of 4 solid · done.',
    topics:[ t("C++","mastered"), t("Concurrency / Parallel","solid"),
      t("Comp Arch / Assembly","solid"), t("Linux / Systems","solid") ] }),
  camp({ num:1, name:"Foundations", state:"climbed", fill:{word:"mastered", color:"var(--m-mastered)"},
    topics:[ t("Algorithms / LC","mastered"), t("Graph Theory","solid"), t("Prob & Stats","solid") ] }),
];

const SPINE_FRESH = [
  camp({ num:1, name:"Foundations", state:"here", fill:{word:"in progress", color:"var(--hub)"},
    topics:[ t("Algorithms / LC","new",3), t("Graph Theory","new"), t("Prob & Stats","new") ] }),
  { type:"ghost", text:"Camps 2–5 open up as you finish Foundations." },
  { type:"frontier", title:"New terrain forming", sub:"the route grows as you go" },
];

const STATES = {
  mid: {
    status:{ alt:"Camp 3 of 5 · 61% of the route", tail:"12 due · 🔥9 · 91% retention" },
    nm:{
      eyebrow:"Study next",
      recHTML:'<b>Distributed Systems</b>',
      lead:null,
      reasonMastery:"shaky",
      reasonHTML:'· 4 due, and it’s the last thing before Applied is done.',
      primary:"Start Today’s Path (12 due)", primaryDisabled:false,
    },
    spine:SPINE_MID,
  },
  fresh: {
    status:{ alt:"Camp 1 of 5 · just getting started", tail:"3 due · 🔥1 · new" },
    nm:{
      eyebrow:"Start here",
      lead:"Start here:",
      recHTML:'<b>Algorithms / LC</b>',
      reasonMastery:"new",
      reasonHTML:'· your first topic. Everything else builds on it.',
      primary:"Start Today’s Path (3 due)", primaryDisabled:false,
    },
    spine:SPINE_FRESH,
  },
  caught: {
    status:{ alt:"Camp 3 of 5 · 61% of the route", tail:"all caught up ✓ · 🔥9 · 94% retention" },
    nm:{
      eyebrow:"Push forward",
      lead:"Nothing due —",
      recHTML:'push forward: <b>Distributed Systems</b>',
      reasonMastery:"learning",
      reasonHTML:'· solidify it and Applied is one topic from done.',
      primary:"Queue clear", primaryDisabled:true,
    },
    spine:SPINE_CAUGHT,
  },
};

// ---------- render ----------
const $ = s => document.querySelector(s);
const spineBody = $("#spine-body");
let current = "mid";
let openNum = null; // which camp is expanded

const CHECK = '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 5 8.6 9.5 3.6" stroke="#0b1119" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function masteryDot(key, size){
  const m = MASTERY[key];
  return `<span class="tdot" style="width:${size}px;height:${size}px;background:${m.color}"></span>`;
}

function reasonBlock(nm){
  const m = MASTERY[nm.reasonMastery];
  return `${masteryDot(nm.reasonMastery,9)}<span><span class="mword" style="color:${m.color}">${m.word}</span> <span>${nm.reasonHTML}</span></span>`;
}

function render(){
  const S = STATES[current];

  // status line
  $("#status").innerHTML =
    `<span class="g">Morning, Albert — </span><span class="alt">${S.status.alt}</span>` +
    `<span class="sep">·</span><span class="tail">${S.status.tail}</span>`;

  // next move
  const nm = S.nm;
  $("#nm-eyebrow").textContent = nm.eyebrow;
  $("#nm-rec").innerHTML = (nm.lead ? `<span class="lead">${nm.lead}</span> ` : "") + nm.recHTML;
  $("#nm-reason").innerHTML = reasonBlock(nm);
  const pb = $("#nm-primary");
  pb.textContent = nm.primary;
  pb.disabled = !!nm.primaryDisabled;

  // spine — renders top → bottom: current camp, then ahead, then frontier, then finished camps
  spineBody.innerHTML = "";
  S.spine.forEach(item => {
    if(item.type === "frontier"){ renderFrontier(item); return; }
    if(item.type === "ghost"){
      const g = document.createElement("div");
      g.className = "ghostline";
      g.textContent = item.text;
      spineBody.appendChild(g);
      return;
    }
    renderCamp(item);
  });

  // wire topic rows
  spineBody.querySelectorAll(".trow").forEach(r => {
    r.addEventListener("click", () => toast(`Drilling into <span class="tk">${r.dataset.title}</span> — coming soon`));
  });
}

function renderFrontier(item){
  const f = document.createElement("div");
  f.className = "frontier";
  f.innerHTML =
    `<div class="node-rail"><span class="fnode"></span></div>` +
    `<div class="ftext"><div class="ftitle">✦ ${item.title}</div>` +
    `<div class="fsub">${item.sub}</div></div>`;
  spineBody.appendChild(f);
}

function renderCamp(c){
  const isOpen = (c.num === openNum);
  const node = document.createElement("div");
  node.className = "node " + c.state;

  const sub = c.state==="here"
    ? `${c.topics.length} topics · you're here`
    : `${c.topics.length} topics`;

  const dotInner = c.state==="climbed" ? CHECK : "";
  const dotColor = c.fill.color;

  const camp = document.createElement("div");
  camp.className = "camp" + (isOpen ? " open" : "");

  const meta = c.state==="here"
    ? `<span class="youare">you're here</span>`
    : `<span class="chip"><span class="cdot" style="background:${c.fill.color}"></span>${c.fill.word}</span>`;

  camp.innerHTML =
    `<button class="camp-head" aria-expanded="${isOpen}" aria-controls="topics-${c.num}">
       <span>
         <span class="camp-title"><span class="camp-num">C${c.num}</span> ${c.name}</span>
         <span class="camp-sub">${sub}</span>
       </span>
       <span class="camp-meta">${meta}${CHEV}</span>
     </button>
     <div class="topics" id="topics-${c.num}"><div class="topics-inner">${topicsHTML(c)}</div></div>`;

  node.innerHTML =
    `<div class="node-rail"><span class="dot" style="background:${dotColor}">${dotInner}</span></div>`;
  node.appendChild(camp);
  spineBody.appendChild(node);

  // wire expand/collapse
  const head = camp.querySelector(".camp-head");
  const topics = camp.querySelector(".topics");
  head.addEventListener("click", () => toggleCamp(c.num));
  setTopicsHeight(topics, isOpen);

  // milestone banner directly under this camp
  if(c.milestone){
    const mb = document.createElement("div");
    mb.className = "milestone";
    mb.innerHTML = c.milestone;
    spineBody.appendChild(mb);
  }
}

function topicsHTML(c){
  return c.topics.map(tp => {
    const m = MASTERY[tp.mastery];
    const due = tp.due ? `<span class="tdue">${tp.due} due</span>` : "";
    return `<button class="trow" data-title="${tp.title}">
      ${masteryDot(tp.mastery,9)}
      <span class="tword" style="color:${m.color}">${m.word}</span>
      <span class="ttitle">${tp.title}</span>
      ${due}
    </button>`;
  }).join("");
}

function setTopicsHeight(el, open){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ el.style.height = open ? "auto" : "0px"; return; }
  if(open){ el.style.height = el.querySelector(".topics-inner").offsetHeight + "px"; }
  else { el.style.height = "0px"; }
}

function toggleCamp(num){
  openNum = (openNum === num) ? null : num;
  // update DOM without full re-render to keep transitions smooth
  spineBody.querySelectorAll(".camp").forEach(camp => {
    const head = camp.querySelector(".camp-head");
    const id = head.getAttribute("aria-controls");
    const n = parseInt(id.replace("topics-",""),10);
    const open = (n === openNum);
    camp.classList.toggle("open", open);
    head.setAttribute("aria-expanded", open);
    setTopicsHeight(camp.querySelector(".topics"), open);
  });
}

// ---------- interactions ----------
function toast(html){
  const el = $("#toast");
  el.innerHTML = html;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

$("#nm-primary").addEventListener("click", e => {
  if(e.currentTarget.disabled) return;
  toast('Launching <span class="tk">Today’s Path</span> — coming soon');
});
$("#nm-secondary").addEventListener("click", () => {
  const rec = current==="fresh" ? "Algorithms / LC" : "Distributed Systems";
  toast(`Opening <span class="tk">${rec}</span> — coming soon`);
});
$("#footdoor").addEventListener("click", () => toast('Opening <span class="tk">Progress</span> — coming soon'));

document.querySelectorAll(".demo button").forEach(b => {
  b.addEventListener("click", () => {
    current = b.dataset.state;
    document.querySelectorAll(".demo button").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    openNum = hereNum(current); // default open camp = the current ("here") camp
    render();
  });
});

function hereNum(state){
  const c = STATES[state].spine.find(i => i.type==="camp" && i.state==="here");
  return c ? c.num : null;
}

// init: current camp expanded
openNum = hereNum(current);
render();
</script>
