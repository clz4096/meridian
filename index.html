<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#070B14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meridian">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Meridian</title>
<style>
:root{
  /* dark elevation: higher surface = lighter (Material/dark-mode canon) */
  --bg:var(--void); --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
  --panel:var(--surface-1); --panel2:var(--surface-2);
  /* canonical Meridian palette (single source of truth, mirrored in src/tokens.ts).
     Used by the graph landing now; the rest of the app migrates to these incrementally
     (see docs/token-migration-plan.md). --hub amber is the lone warm accent — used sparingly. */
  --void:#070B14; --core:#BFE9FF; --hub:#F2B25C;
  --edge:rgba(120,170,220,.18); --ring:rgba(150,200,255,.28); --faint:#5C7291;
  /* borders as hairlines; elevation carries most of the separation */
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#DCE6F2; --muted:#8FA3BE; --dim:#727D8E; --track:#232A33;
  --teal:#7CC9EC; --tealSoft:#0d1c2b; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
  --protein:#A78BEA; --interview:#D8654F;
  /* 8pt spacing scale */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px;
  /* radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* type scale (sans for UI, mono for numbers) */
  --fs-micro:11px; --fs-caption:12px; --fs-body:14px; --fs-h3:15px; --fs-h2:19px; --fs-h1:26px; --fs-hero:40px;
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.22s;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
/* iOS standalone: always paint the bottom safe-area (home-indicator) strip in the
   surface colour, so a reflowing fixed bar or a short page can never reveal the
   default black backdrop. On the landing the strip is the void; the graph sits above it. */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 1px);background:var(--panel);z-index:39;pointer-events:none}
body.pre-enter::after{background:var(--void)}
.appwrap{max-width:820px;margin:0 auto;padding:0 14px 90px;min-height:100vh;min-height:100dvh}
.brandrow{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 2px 8px;position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:20}
.brand{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--text)}
.brand b{color:var(--text)}
.brand .mn{color:var(--hub)}
/* save status chip */
.savechip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none}
/* rest timer — one clean floating bar, above the safe area, never over the content */
.restbar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px -10px rgba(0,0,0,.75);overflow:hidden}
.restfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(124,201,236,.16),rgba(124,201,236,.04));border-right:1px solid rgba(124,201,236,.45);transition:width .25s linear}
.restbar.over .restfill{width:100%!important;background:linear-gradient(90deg,rgba(59,185,140,.16),rgba(59,185,140,.04));border-right-color:rgba(59,185,140,.5)}
.restrow{position:relative;display:flex;align-items:center;gap:14px}
.resttime{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:60px}
.restbar.over .resttime{color:var(--ok);font-size:17px}
.restmeta{flex:1;min-width:0}
.restl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.reste{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restskip{background:var(--void);border:1px solid var(--line-2);color:var(--text);border-radius:12px;font:600 13px var(--sans);min-height:44px;padding:0 18px;cursor:pointer;flex:none;transition:border-color var(--dur) var(--ease)}
.restskip:hover,.restskip:focus-visible{border-color:var(--teal);outline:none}
/* quiet auto-save status, top-right corner */
.savestat{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right));z-index:61;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);background:rgba(14,17,22,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:7px 12px;cursor:pointer;user-select:none;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),bottom .25s var(--ease)}
body.resting .savestat{bottom:calc(104px + env(safe-area-inset-bottom))}
.savestat .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savestat.dirty{color:var(--faint)}
.savestat.dirty .dot{background:var(--hub)}
.savestat.failed{color:var(--deficit);border-color:rgba(216,101,79,.4)}
.savestat.failed .dot{background:var(--deficit)}
.appwrap{padding-bottom:100px}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip.dirty{cursor:pointer;border-color:var(--fuel);color:var(--fuel)}
.savechip.dirty .dot{background:var(--fuel)}
.savechip.saving{color:var(--muted)}
/* tab bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(0,0,0,.35)}
.navbar button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--dim);cursor:pointer;padding:8px 2px;font-family:inherit}
.navbar button .ni{font-size:17px;line-height:1;display:block;padding:3px 14px;border-radius:14px;transition:background .15s,color .15s}
.navbar button .nl{font-size:12px;letter-spacing:.02em}
.navbar button.on{color:var(--teal)}
.navbar button.on .ni{background:var(--tealSoft,rgba(90,200,140,.16));color:var(--teal)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--panel2);color:var(--text);border-color:var(--teal)}
.tabpane{display:none}
.tabpane.on{display:block}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel-t{font-family:var(--sans);font-size:var(--fs-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 var(--sp3)}
.empty{color:var(--dim);font-size:var(--fs-body)}
/* progress charts */
.prog{margin-top:var(--sp5)}
.prog-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);margin-bottom:var(--sp3)}
.prog-h .panel-t{margin:0}
.prog-hl{display:flex;align-items:baseline;gap:var(--sp2);min-width:0}
.prog-hl .note{font-size:var(--fs-caption);white-space:nowrap;color:var(--muted)}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg button{font-family:var(--sans);font-size:var(--fs-caption);font-weight:500;line-height:1;border:0;background:transparent;color:var(--dim);padding:7px 9px;border-radius:6px;cursor:pointer;min-width:30px;transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.seg-row{display:flex;gap:var(--sp2)}
/* hero stat */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp4);margin:2px 0 var(--sp2)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin:18px 2px 4px}
.ctrl-row{display:flex;justify-content:flex-end;align-items:center;gap:var(--sp2);margin:var(--sp3) 0 var(--sp1)}
.ctrl-toggle{font-family:var(--mono);font-size:var(--fs-caption);letter-spacing:.06em;color:var(--muted);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 11px;cursor:pointer;min-height:0;white-space:nowrap;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.ctrl-toggle:hover,.ctrl-toggle.on,.ctrl-toggle:focus-visible{color:var(--teal);border-color:var(--line-2);outline:none}
/* workout: today's session header + tucked options (single-screen layout) */
.exhead{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:26px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.exhead-r{display:flex;align-items:center;gap:10px}
.exhead-m{color:var(--muted);letter-spacing:.06em}
.ex-opts{font-size:13px;line-height:1;color:var(--muted);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 9px;cursor:pointer;min-height:0;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.ex-opts:hover,.ex-opts.on,.ex-opts:focus-visible{color:var(--teal);border-color:var(--line-2);outline:none}
.wk-extras{margin-top:var(--sp3)}
.wk-complete{background:var(--hub);color:#0e1116;border:0;font-weight:600}
.wk-complete:hover,.wk-complete:focus-visible{background:var(--fuel);outline:none}
.wk-complete.on{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
/* ===== streamlined exercise card ===== */
.ex{border-top:1px solid var(--line)}
.ex:last-of-type{border-bottom:1px solid var(--line)}
.ex-top{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;cursor:pointer;color:inherit;text-align:left;font:inherit;padding:17px 2px;min-height:44px}
.ex-name{flex:1;font-size:15.5px;font-weight:500;color:var(--text)}
.ex-status{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-status .lbl{color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-size:10px;margin-left:6px}
.ex-chev{color:var(--faint);transition:transform var(--dur) var(--ease);flex:none}
.ex.open .ex-chev{transform:rotate(90deg);color:var(--teal)}
.ex.done .ex-name{color:var(--muted)}
.ex.done .ex-status{color:var(--ok)}
.ex-check{color:var(--ok);flex:none}
.ex-body{max-height:0;overflow:hidden;transition:max-height .32s var(--ease)}
.ex.open .ex-body{max-height:760px}
.ex-inner{padding:2px 2px 20px}
.rx{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 14px}
.rx-what{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.rx-what.all-done{color:var(--ok)}
.rx-cue{font-family:var(--mono);font-size:12px;color:var(--ok)}
.rx-cue.muted{color:var(--dim)}
.logrow{display:flex;align-items:stretch;gap:10px}
.field{flex:1;min-width:0;background:var(--surface-1);border:1px solid var(--line-2);border-radius:12px;padding:9px 8px;text-align:center;transition:border-color var(--dur) var(--ease)}
.field:focus-within{border-color:var(--teal)}
.field .fv{width:100%;background:none;border:0;text-align:center;font-family:var(--mono);font-size:25px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.field .fv::-webkit-outer-spin-button,.field .fv::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field .fv:focus{outline:none}
.field .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.times{align-self:center;color:var(--faint);font-size:18px}
.logbtn{flex:1.1;display:flex;align-items:center;justify-content:center;background:var(--teal);color:#04212e;border:0;border-radius:12px;font:600 15px/1 var(--sans);cursor:pointer;min-height:56px;letter-spacing:.01em;transition:transform .1s var(--ease)}
.logbtn:active{transform:scale(.99)}
.logbtn:focus-visible{outline:2px solid var(--core);outline-offset:2px}
.sets{margin-top:16px;display:grid;gap:2px}
.set{display:flex;align-items:center;gap:12px;padding:9px 4px;font-family:var(--mono);font-size:13.5px}
.set .st{width:16px;flex:none;text-align:center}
.set .nm{width:74px;flex:none;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.set .vl{color:var(--text);font-variant-numeric:tabular-nums}
.set .undo{margin-left:auto;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px;min-height:0}
.set.done .st{color:var(--ok)}.set.done .vl{color:var(--muted)}
.set.now{background:var(--surface-1);border-radius:10px}
.set.now .st{color:var(--teal)}.set.now .nm{color:var(--teal)}
.set.up{opacity:.5}
.more{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.more a,.more button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);text-decoration:none;cursor:pointer;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 12px;min-height:0;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.more a:hover,.more button:hover,.more a:focus-visible,.more button:focus-visible{color:var(--teal);border-color:var(--line-2);outline:none}
.more .more-done{margin-left:auto;color:var(--teal);border-color:rgba(124,201,236,.28)}
.more-rest{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.03em;margin-left:4px}
/* ===== streamlined meal log ===== */
.log-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.datenav{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.datenav .dlabel{min-width:128px;text-align:center;color:var(--muted)}
.macros{margin-top:16px;display:grid;gap:14px}
.macro-t{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;margin-bottom:6px}
.macro-l{color:var(--muted);letter-spacing:.04em}
.macro-v{color:var(--text);font-variant-numeric:tabular-nums}
.macro-v small{color:var(--faint)}
.macro-track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.macro-fill{height:100%;border-radius:6px;transition:width var(--dur) var(--ease)}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
.meal-extras{margin-top:16px;display:grid;gap:12px}
.addcard{background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:14px}
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface-3);border:1px solid var(--line-2);border-radius:20px;padding:9px 14px;white-space:nowrap;cursor:pointer;min-height:0}
.mchip .k{color:var(--faint);margin-left:6px}
.addrow,.airow{display:flex;gap:8px;margin-top:12px}
.airow{margin-top:10px}
.minp{background:var(--void);border:1px solid var(--line-2);border-radius:10px;color:var(--text);font:15px var(--sans);padding:12px;min-height:46px}
.minp::placeholder{color:var(--faint)}
.minp:focus{outline:none;border-color:var(--teal)}
.minp.name{flex:1;min-width:0}
.minp.num{width:74px;text-align:center;font-family:var(--mono);-moz-appearance:textfield}
.minp.num::-webkit-outer-spin-button,.minp.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.airow .minp{flex:1;min-width:0}
.madd{background:var(--teal);color:#04212e;border:0;border-radius:10px;font:600 14px var(--sans);padding:0 18px;min-height:46px;cursor:pointer}
.maibtn{background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:10px;font:600 12px var(--mono);padding:0 14px;min-height:46px;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.maibtn:hover,.maibtn:focus-visible{color:var(--teal);border-color:var(--teal);outline:none}
.mealrow{display:flex;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--line)}
.mealrow:last-child{border-bottom:1px solid var(--line)}
.mealnm{flex:1;font-size:14.5px}
.mealest{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--protein);border:1px solid rgba(167,139,234,.4);border-radius:10px;padding:2px 6px;margin-left:6px}
.mealmac{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mealrm{color:var(--faint);cursor:pointer;padding:4px 8px;font-size:16px;min-height:0}
.mealrm:hover{color:var(--deficit)}
.hero-k{font-family:var(--sans);font-size:var(--fs-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--sp1)}
.hero-v{font-family:var(--mono);font-size:48px;font-weight:600;line-height:.95;letter-spacing:-.02em}
.hero-u{font-size:20px;color:var(--muted);font-weight:500}
.hero-d{font-family:var(--mono);font-size:var(--fs-body);font-weight:600;color:var(--dim)}
.hero-d.up{color:var(--ok)} .hero-d.down{color:var(--deficit)}
.chart{margin:var(--sp2) 0;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 13px}
.chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp2);margin-bottom:0}
.chart-t{font-family:var(--sans);font-size:var(--fs-body);font-weight:500;color:var(--text)}
.chart-v{font-family:var(--mono);font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em}
.chart-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.chart svg{width:100%;height:auto;display:block;margin-top:10px}
.chart-empty{font-family:var(--sans);font-size:var(--fs-caption);color:var(--dim);padding:var(--sp5) 0;text-align:center}
.prog-lift{display:flex;gap:var(--sp2);overflow-x:auto;margin:var(--sp3) 0 var(--sp1);padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.prog-lift::-webkit-scrollbar{display:none}
.prog-lift button{font-family:var(--sans);font-size:var(--fs-caption);font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface-1);color:var(--muted);padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;min-height:32px;transition:all var(--dur) var(--ease)}
.prog-lift button.on{border-color:var(--fuel);color:var(--fuel);background:rgba(224,166,75,.08)}
/* graphs-first navigation: Progress screen CTA + Detail screen back */
.cta-log{display:flex;align-items:center;justify-content:space-between;gap:var(--sp2);width:100%;margin-top:var(--sp5);font-family:var(--sans);font-size:var(--fs-h3);font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp4);cursor:pointer;min-height:56px;transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.cta-log:hover{background:var(--surface-3)}
.cta-log:active{transform:scale(.99)}
.cta-arrow{color:var(--teal);font-size:var(--fs-h2);line-height:1}

/* ==================================================================
   Accessibility & platform conventions
   WCAG 2.2 AA (2.4.7 focus, 2.3.3 motion, 2.5.8 target size),
   Apple HIG 44pt targets, Material 3 48dp navigation.
   ================================================================== */

/* 2.4.7 Focus Visible — keyboard users had no indicator at all. */
:focus-visible{
  outline:2px solid var(--teal);
  outline-offset:2px;
  border-radius:6px;
}
/* Only suppress the ring for pointer input, never for keyboard. */
:focus:not(:focus-visible){ outline:none; }

/* 2.3.3 Animation from Interactions — honour the OS-level preference. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* 2.5.8 Target Size (Minimum): 24px is the AA floor; 44px is the
   Apple/Material comfort target. Applied to every interactive control
   that was previously sized only by its text. */
button,.chk,.setpill,.rm,a.mbtn{ min-height:44px; }
.chk{ min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

/* Light mode: the app was dark-only, which ignores an explicit OS setting. */
@media (prefers-color-scheme: light){
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#F0F2F6;
    --line:rgba(0,0,0,.34);
    --text:#12161C; --muted:#4A5464; --dim:#5F6B7C;
    --track:#E3E7ED; --tealSoft:#DEEBF6;
    /* Accents darkened for a white surface. The dark-theme values sit at
       2.2-3.6:1 on white and fail WCAG 1.4.3; these clear 4.5:1 while
       preserving hue, so the palette reads the same in both themes. */
    --teal:#1F6F98; --fuel:#966F32; --ok:#198663;
    --deficit:#BC5845; --interview:#BC5845; --protein:#7F6AB2;
  }
  /* brand accent letter: the dark-theme amber fails contrast on white */
  .brand .mn{color:#B0781E}
}

/* --- Workout density: progressive disclosure --- */
.setrow.logged-line,.setrow.next-line{display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.setlabel{min-width:74px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.setlabel.cur{color:var(--teal)}
.setval{font-family:var(--mono);font-size:14px;color:var(--text)}
.setval.dim{color:var(--dim)}
.setrow.logged-line .setval{color:var(--muted)}
.setrow.cur{background:var(--tealSoft);border-radius:10px;padding:8px;margin:6px -8px;gap:8px}
.setcue{font-family:var(--mono);font-size:12px;color:var(--dim);margin:-2px 0 6px 74px}
.lift.collapsed{padding:10px 12px}
.lift.collapsed .lift-h{margin:0}
.chk.on{color:var(--ok)}
/* one native disclosure replaces three permanent buttons per card */
/* secondary exercise controls — inline row inside the expanded dropdown */
.exmore-body{display:flex;flex-wrap:wrap;gap:var(--sp2);margin-top:var(--sp3)}
.exmore-body .mbtn{text-decoration:none}
.exmore-body .note{flex-basis:100%;margin-top:var(--sp1)}
/* ===== graph landing (shown on every launch; Enter → dashboard) ===== */
#landing{position:fixed;inset:0;z-index:100;background:var(--void);-webkit-tap-highlight-color:transparent;user-select:none;transition:opacity .5s var(--ease)}
#landing.leaving{opacity:0;pointer-events:none}
#stage{position:fixed;inset:0;touch-action:none;opacity:0;transition:opacity 1.1s ease}
#stage.ready{opacity:1}
#landing .overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));
  padding-left:max(clamp(20px,5vw,56px),env(safe-area-inset-left));padding-right:max(clamp(20px,5vw,56px),env(safe-area-inset-right));
  font-family:var(--mono);color:var(--text)}
#landing .mark{font-size:clamp(15px,2.2vw,22px);letter-spacing:.5em;font-weight:600;text-transform:uppercase;opacity:.92}
#landing .mark span{color:var(--hub)}
#landing .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
#landing .tag{max-width:26ch;font-size:clamp(12px,1.4vw,14px);letter-spacing:.04em;line-height:1.6;color:var(--muted)}
#landing .enter{pointer-events:auto;display:inline-flex;align-items:center;gap:.6em;padding:13px 22px;min-height:44px;
  font:600 13px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text);text-decoration:none;white-space:nowrap;
  background:rgba(191,233,255,.04);border:1px solid var(--ring);border-radius:2px;

#landing .hint{position:absolute;right:max(clamp(20px,5vw,56px),env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);transition:opacity 1.2s ease}
#landing .hint.gone{opacity:0}
@media (prefers-reduced-motion:reduce){#landing .hint{display:none}#stage{transition:none;opacity:1}}
/* dashboard chrome hidden until Enter */
.pre-enter .appwrap,.pre-enter .navbar,.pre-enter .savestat,.pre-enter .restbar,.pre-enter .savedflash{display:none!important}

<script>
(function(){
  var body = document.body;
  body.classList.add('pre-enter'); // hide the dashboard chrome until Enter
  var root = document.documentElement;
  root.style.background = '#070B14'; // paint the root void so no safe-area edge shows black under the landing
  var landing = document.getElementById('landing');
  var entered = false;
  function enter(){
    if(entered) return; entered = true;
    body.classList.remove('pre-enter');
    root.style.background = ''; // hand the backdrop back to the app surface
    if(landing){ landing.classList.add('leaving'); setTimeout(function(){ if(landing) landing.remove(); }, 550); }
    window.MeridianCore.mountApp(new window.MeridianCore.DomAppHost(document));
  }
  // lazily pull in the graph chunk (Three) and mount the landing; on failure, still let the user in
  import('./meridian-landing.js')
    .then(function(m){ m.mountLanding(document, enter); })
    .catch(function(){ var e = document.getElementById('enter'); if(e){ e.addEventListener('click', function(ev){ ev.preventDefault(); enter(); }); } });
})();
</script>
