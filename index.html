<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meridian">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Meridian</title>
<style>
:root{
  --bg:#0E1116; --panel:#161B22; --panel2:#1C222B; --line:rgba(255,255,255,.34);
  --text:#E7EBF2; --muted:#8B95A7; --dim:#7A8698; --track:#232A33;
  --teal:#4FB0A5; --tealSoft:#10241d; --fuel:#E0A64B; --ok:#1D9E75; --deficit:#D8654F;
  --protein:#A78BEA; --interview:#D8654F;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
.appwrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
.brandrow{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px;position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:20}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em}
.brand b{color:var(--teal)}
/* save status chip */
.savechip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.lift.exdone{opacity:.55}
.lift.exdone .lift-name{text-decoration:line-through}
.discardfab{min-height:44px;position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:24px;padding:12px 16px;font-family:var(--mono);font-size:12px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
.savefab{min-height:44px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;border:none;border-radius:24px;padding:12px 22px;cursor:pointer;user-select:none;background:var(--panel2,#1a1c22);color:var(--muted);box-shadow:0 6px 20px rgba(0,0,0,.45);transition:background .15s,color .15s}
.savefab .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savefab.dirty{background:var(--fuel);color:#0e0f13;font-weight:600}
.savefab.dirty .dot{background:#0e0f13}
.savefab.saving{opacity:.7}
.appwrap{padding-bottom:150px}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip.dirty{cursor:pointer;border-color:var(--fuel);color:var(--fuel)}
.savechip.dirty .dot{background:var(--fuel)}
.savechip.saving{color:var(--muted)}
/* tab bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(0,0,0,.35)}
.navbar button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--dim);cursor:pointer;padding:8px 2px;font-family:inherit}
.navbar button .ni{font-size:17px;line-height:1;display:block;padding:3px 14px;border-radius:14px;transition:background .15s,color .15s}
.navbar button .nl{font-size:12px;letter-spacing:.02em}
.navbar button.on{color:var(--teal)}
.navbar button.on .ni{background:var(--tealSoft,rgba(90,200,140,.16));color:var(--teal)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--panel2);color:var(--text);border-color:var(--teal)}
.tabpane{display:none}
.tabpane.on{display:block}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:var(--mono);margin:0 0 12px}
.empty{color:var(--dim);font-size:13px}
.placeholder{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;color:var(--dim);text-align:center;margin-top:14px;font-size:14px}
/* buttons/inputs */
.mbtn{min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font-size:13.5px;font-family:var(--sans)}
.mbtn:hover{border-color:var(--dim)}
.mbtn.primary{background:var(--teal);color:#04211d;border:none;font-weight:600}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mpanel input,.mpanel select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;border-radius:8px;padding:8px 10px;outline:none}
.mpanel input:focus,textarea:focus{border-color:var(--teal)}
/* today stat row */
.statgrid{display:flex;gap:22px;flex-wrap:wrap}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500}
.stat .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
/* schedule rows */
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px;margin:3px 0;font-size:14px;border:1px solid transparent}
.tdrow.tnow{background:var(--panel2);border-color:var(--teal)}
.tdrow.done{opacity:.5}.tdrow.done .lab{text-decoration:line-through}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ok);font-weight:700;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;gap:2px}
.lab{}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
.nowtag{font-size:12px;background:var(--teal);color:#04211d;padding:1px 6px;border-radius:8px;margin-left:4px}
.bar{height:8px;background:var(--track);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar>div{height:100%;background:var(--ok);border-radius:6px}
.goalrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.goalrow:last-child{border-bottom:none}
.chiprow{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:96px}
.chip .cv{font-family:var(--mono);font-size:17px}
.chip .ck{font-size:12px;color:var(--dim);text-transform:uppercase}
.savedflash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#04211d;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.savedflash.show{opacity:1}
.note{font-size:12px;color:var(--muted)}
.dictxt{width:100%;min-height:150px;font-family:var(--mono);font-size:12px}
/* study */
.slabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.sched-edit{display:flex;align-items:center;gap:8px;padding:8px 4px;border-radius:8px;margin:2px 0;font-size:13.5px;border:1px solid transparent}
.sched-edit.tnow{background:var(--panel2);border-color:var(--teal)}
.sched-edit .ed,.sched-edit .rm{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;font-size:12px;font-family:var(--mono)}
.sched-edit .ed:hover{color:var(--text)}.sched-edit .rm:hover{color:var(--deficit)}
.subblocks{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px 30px}
.sb{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.sb.work{color:var(--teal);border-color:var(--tealSoft);background:var(--tealSoft)}
.sb.rest{color:var(--dim)}
.mapline{font-family:var(--mono);font-size:12px;color:var(--fuel);margin:2px 0 0 30px}
.noteline{font-size:12px;color:var(--muted);margin:2px 0 0 30px}
.sentry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sentry:last-child{border-bottom:none}
.sentry .rm{margin-left:auto;color:var(--dim);cursor:pointer;padding:0 5px}
.sentry .rm:hover{color:var(--deficit)}
.mchip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:12px;font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);color:var(--muted);padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text)}
/* workout */
.lift{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.lift-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lift-name{font-size:16px;font-weight:600}
.cue{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:12px;white-space:nowrap}
.cue.bump{background:var(--tealSoft);color:var(--teal)}
.cue.hold{background:var(--panel2);color:var(--muted)}
.cue.add{background:#2a2010;color:var(--fuel)}
.cue.deload{background:#3a1a1a;color:var(--deficit)}
.lift-target{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:3px}
.setrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.setrow input{width:66px;text-align:center}
.setrow.done{opacity:.85;padding:6px 0}
.setrow.cur{background:var(--tealSoft);border-radius:8px;padding:4px 6px;margin-left:-6px}
.lastline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:6px}
.logged{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.setpill{min-height:44px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
/* knowledge */
.ktabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.ktabs::-webkit-scrollbar{display:none}

.tprog{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--teal)}
.ktab{min-height:44px;flex:1 1 auto;min-width:calc(33.333% - 6px);background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 10px;font-size:12px;cursor:pointer;white-space:nowrap;text-align:center}
@media(max-width:420px){.ktab{min-width:calc(50% - 6px)}}
.ktab.on{background:var(--panel2);color:var(--text);border-color:var(--protein)}
.ktab .cnt{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:5px}
.timebar{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 10px}

.rate button{min-height:44px;min-width:44px}
.timebar button{min-height:44px;border:0;background:var(--panel2);color:var(--muted);padding:6px 11px;font-family:var(--mono);font-size:12px;cursor:pointer}
.timebar button.on{background:var(--protein);color:#0d0716}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtime{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--protein);white-space:nowrap}
.qprompt{font-size:14.5px;margin:8px 0 6px;line-height:1.55}
.qsrc{font-family:var(--mono);font-size:12px;color:var(--fuel)}
.qsrc a,.klink a{color:var(--teal)}
.qvid{font-size:12px;margin-top:4px}.qvid a{color:var(--teal)}
.qactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reveal{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line);font-size:13.5px;line-height:1.55;display:none}
.reveal.on{display:block}
.rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rate button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.rate button:hover{border-color:var(--protein);color:var(--text)}
.masterbadge{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:9px}
.klink{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12.5px}
.klink b{color:var(--text)}
.stub{color:var(--dim);font-size:13px;margin-top:10px}


/* ==================================================================
   Accessibility & platform conventions
   WCAG 2.2 AA (2.4.7 focus, 2.3.3 motion, 2.5.8 target size),
   Apple HIG 44pt targets, Material 3 48dp navigation.
   ================================================================== */

/* 2.4.7 Focus Visible — keyboard users had no indicator at all. */
:focus-visible{
  outline:2px solid var(--teal);
  outline-offset:2px;
  border-radius:6px;
}
/* Only suppress the ring for pointer input, never for keyboard. */
:focus:not(:focus-visible){ outline:none; }

/* 2.3.3 Animation from Interactions — honour the OS-level preference. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* 2.5.8 Target Size (Minimum): 24px is the AA floor; 44px is the
   Apple/Material comfort target. Applied to every interactive control
   that was previously sized only by its text. */
button,.chk,.setpill,.rm,a.mbtn{ min-height:44px; }
.chk{ min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

/* Light mode: the app was dark-only, which ignores an explicit OS setting. */
@media (prefers-color-scheme: light){
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#F0F2F6;
    --line:rgba(0,0,0,.34);
    --text:#12161C; --muted:#4A5464; --dim:#5F6B7C;
    --track:#E3E7ED; --tealSoft:#DCF2EC;
    /* Accents darkened for a white surface. The dark-theme values sit at
       2.2-3.6:1 on white and fail WCAG 1.4.3; these clear 4.5:1 while
       preserving hue, so the palette reads the same in both themes. */
    --teal:#3A827A; --fuel:#966F32; --ok:#198663;
    --deficit:#BC5845; --interview:#BC5845; --protein:#7F6AB2;
  }
}

/* --- Workout density: progressive disclosure --- */
.setrow.logged-line,.setrow.next-line{display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.setlabel{min-width:74px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.setlabel.cur{color:var(--teal)}
.setval{font-family:var(--mono);font-size:14px;color:var(--text)}
.setval.dim{color:var(--dim)}
.setrow.logged-line .setval{color:var(--muted)}
.setrow.cur{background:var(--tealSoft);border-radius:10px;padding:8px;margin:6px -8px;gap:8px}
.setcue{font-family:var(--mono);font-size:12px;color:var(--dim);margin:-2px 0 6px 74px}
.lift.collapsed{padding:10px 12px}
.lift.collapsed .lift-h{margin:0}
.chk.on{color:var(--ok)}
/* one native disclosure replaces three permanent buttons per card */
.exmore{margin-left:auto;position:relative}
.exmore summary{list-style:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-size:20px;border-radius:10px}
.exmore summary::-webkit-details-marker{display:none}
.exmore[open] summary{background:var(--panel2);color:var(--text)}
.exmore-body{position:absolute;right:0;top:46px;z-index:30;min-width:210px;display:flex;flex-direction:column;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.exmore-body .mbtn{justify-content:flex-start;text-decoration:none}
</style>

<script>
/* =========================================================================
   MERIDIAN v2 — SAVE / SYNC CORE  (slice 1)
   - Keeps the 4 existing v1 storage keys so old data survives.
   - Adds an explicit save layer: in-memory state + a Save chip that shows
     "Unsaved changes" the moment anything changes, and commits on demand.
   - Auto-commit is ALSO on (debounced) so nothing is ever lost, but the
     chip gives you manual control + visible confirmation (kills the
     "did my data save?" anxiety that caused v1 data loss).
   ========================================================================= */
const KEYS = {
  core:    'meridian-core',          // schedule + study entries (this app owns)
  overload:'overload-tracker-state', // workout (v1)
  surplus: 'surplus-tracker-state',  // weight gain + tadalafil (v1)
  csgraph: 'csgraph_profile_v2'       // knowledge graph (v1)
};
const hasWS = (typeof window!=='undefined' && window.storage && window.storage.get);

/* ---- Durable storage: three backends, newer-wins ----
   - IndexedDB  : primary local store (survives iOS eviction, large quota)
   - localStorage: synchronous fast copy (survives hard-kill mid-write)
   - window.storage: Claude-account store → shared across mobile + browser
   Every write stamps a version (timestamp) in a companion key in each backend.
   Every read returns the copy with the newest version, so a stale/dropped
   write can never overwrite good data. Writes are explicit + awaited. */

// IndexedDB minimal promise wrapper
const IDB = (function(){
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        const r=indexedDB.open('meridian_db',1);
        r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function get(key){ try{ const db=await open(); return await new Promise((res)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(key); t.onsuccess=()=>res(t.result==null?null:t.result); t.onerror=()=>res(null); }); }catch(e){ return null; } }
  async function set(key,val){ try{ const db=await open(); return await new Promise((res)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }
  return {get,set, ok:(typeof indexedDB!=='undefined')};
})();

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key,v){ try{ localStorage.setItem(key,v); return true; }catch(e){ return false; } }
async function wsGet(key){ if(!hasWS) return null; try{ const r=await window.storage.get(key); return (r&&r.value!=null)?r.value:null; }catch(e){ return null; } }
async function wsSet(key,v){ if(!hasWS) return false; try{ await window.storage.set(key,v); return true; }catch(e){ return false; } }

async function rawGet(key){
  const vk=key+'__v';
  // gather (value, version) from all three backends
  const lv=lsGet(key), lvv=parseInt(lsGet(vk)||'0',10)||0;
  const iv=await IDB.get(key), ivv=parseInt((await IDB.get(vk))||'0',10)||0;
  let wv=null,wvv=0; if(hasWS){ wv=await wsGet(key); wvv=parseInt((await wsGet(vk))||'0',10)||0; }
  const cands=[[lv,lvv],[iv,ivv],[wv,wvv]].filter(c=>c[0]!=null);
  if(!cands.length) return null;
  cands.sort((a,b)=>b[1]-a[1]);           // newest version first
  const best=cands[0];
  // heal the other backends toward the newest copy (so all converge)
  if(best[0]!=null){ lsSet(key,best[0]); lsSet(vk,String(best[1]||Date.now())); IDB.set(key,best[0]); IDB.set(vk,String(best[1]||Date.now())); }
  return best[0];
}
async function rawSet(key,val){
  const vk=key+'__v', now=Date.now();
  lsSet(key,val); lsSet(vk,String(now));          // sync — survives hard kill
  await IDB.set(key,val); await IDB.set(vk,String(now));   // durable local
  if(hasWS){ await wsSet(key,val); await wsSet(vk,String(now)); }  // cross-device
  return true;
}

// ---- CORE (this app's own store): { schedule:{date:[tasks]}, entries:[] } ----
let CORE = { schedule:{}, entries:[] };
let dirty = false;
let saveTimer = null;
// Snapshot of the last known-clean (saved or freshly loaded) state, for Discard.

/* ================= CLOUD BACKEND (Pantry REST store) =================
   A real cross-device backend: a free hosted JSON store reached over HTTP.
   Setup once: get a Pantry ID at getpantry.cloud, paste it in Data > Cloud.
   Model: cloud is the source of truth. Save -> push. Load -> pull.
   The Pantry ID lives only in localStorage (never synced, never in exports). */
function cloudEnabled(){ 
  try{ return !!(localStorage.getItem('meridian_supabase_url') && localStorage.getItem('meridian_supabase_key')); }catch(e){ return false; } 
}

/* ================= MERGE-BASED SYNC =================
   Timestamp "who wins" logic cannot work when both devices have real edits.

/* ---- DeepSeek (via OpenRouter) through a Supabase proxy ----
   All three AI features — meal estimation, knowledge answer, knowledge grade —
   call DeepSeek v4 Pro through OpenRouter. A Claude Max/Pro subscription does
   NOT grant API access, so we use the OpenRouter key the user already has.
   That key lives only in the Edge Function's secret store (OPENROUTER_API_KEY),
   never in the browser; the client authenticates to the proxy with the Supabase
   anon key it already holds for sync. See supabase/functions/openrouter-proxy. */

// Single source of truth for the model slug. If OpenRouter returns 404 /
// "model not found", this exact string is wrong — copy the correct slug from
// openrouter.ai/models and change it HERE and in the proxy's ALLOWED_MODELS.
const AI_MODEL = 'deepseek/deepseek-v4-pro';

function aiProxyUrl(){
  try{
    const u = localStorage.getItem('meridian_supabase_url'); if(!u) return '';
    const base = u.startsWith('http') ? u : 'https://' + u;
    return base.replace(/\/+$/,'') + '/functions/v1/openrouter-proxy';
  }catch(e){ return ''; }
}
function aiAnon(){ try{ return localStorage.getItem('meridian_supabase_key')||''; }catch(e){ return ''; } }

/**
 * One entry point for every AI call. OpenAI-shaped (OpenRouter) request through
 * the proxy; returns { ok, text } or { ok:false, error }. temperature is allowed
 * here (unlike the Anthropic API), so we use it to steer determinism.
 */
async function aiCall({ maxTokens, messages, temperature, jsonMode }){
  const url = aiProxyUrl(), anon = aiAnon();
  if(!url || !anon) return { ok:false, error:'no proxy' };
  const body = { model: AI_MODEL, max_tokens: maxTokens, messages };
  if(typeof temperature === 'number') body.temperature = temperature;
  if(jsonMode){ body.response_format = { type:'json_object' }; body.reasoning = { enabled:false }; }
  try{
    const r = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+anon, 'apikey':anon },
      body: JSON.stringify(body),
    });
    if(r.status === 401 || r.status === 403) return { ok:false, error:'proxy auth failed' };
    if(r.status === 429) return { ok:false, error:'rate limited' };
    let data; try{ data = await r.json(); }catch(e){ return { ok:false, error:'HTTP '+r.status }; }
    if(!r.ok) return { ok:false, error:(data && data.error && data.error.message) || ('HTTP '+r.status) };
    const text = ((((data.choices||[])[0]||{}).message)||{}).content || '';
    if(!text) return { ok:false, error:'model returned no text' };
    return { ok:true, text, usage:data.usage };
  }catch(e){ return { ok:false, error:(e && e.message) || 'network error' }; }
}

/** Estimate macros with DeepSeek. Returns {name,cal,protein} or {error}. */
async function ossEstimate(desc){
  const res = await aiCall({
    maxTokens:512,    temperature:0.2,
    jsonMode:true,
    messages:[{ role:'user', content:
      'Estimate total calories and protein grams for this food. Reply with ONLY a JSON object of exactly this shape, no prose: {"name":"short label","cal":<integer>,"protein":<integer>}. Food: ' + desc }],
  });
  if(!res.ok) return { error: res.error };
  // JSON mode returns a bare object, but tolerate a fenced/wrapped payload too.
  const m = res.text.replace(/```json|```/g,'').match(/\{[\s\S]*\}/);
  let o; try{ o = JSON.parse(m ? m[0] : res.text); }catch(e){ return { error:'bad response' }; }
  const cal = Math.max(0, Math.round(+o.cal||0));
  const protein = Math.max(0, Math.round(+o.protein||0));
  // Same physical bound the estimator enforces: protein alone is 4 kcal/g.
  if (protein > 0 && cal < protein * 4) return { error: 'model returned impossible macros' };
  return { name: String(o.name||desc).slice(0,60), cal, protein };
}

  const items = kgTopic === '__review__' ? dueItems()
              : kgTopic === '__target__' ? allTargetItems()
              : (KG_ITEMS[kgTopic] || []);
  const shown = items.filter(it => (kgTime === 'all' || String(it.mins) === kgTime) && itemMatchesTarget(it));
  const topic = KG_TOPICS.find(t => t.id === kgTopic);
  const gm = (kgGym && KG_GYM[kgTopic]) ? KG_GYM[kgTopic] : null;
  const link = (pair, kind, i) => ({ label: pair[0], url: pair[1], key: kgTopic+'|'+kind+'|'+i, done: !!KG.gymDone[kgTopic+'|'+kind+'|'+i] });

  ensureKnowledgeView().repaint({
    topicId: kgTopic,
    topics: KG_TOPICS.map(tp => {
      const arr = KG_ITEMS[tp.id] || [];
      const mastered = arr.filter(it => (KG.mastery[it.id]||0) >= 4).length;
      return { id: tp.id, name: tp.name, books: tp.books,
               total: arr.length, mastered, percent: arr.length ? Math.round(100*mastered/arr.length) : 0 };
    }),
    items: shown.map(it => { const b = KG_BOOKS[it.src.book] || {}; return { ...it, src: { ...it.src, title: b.t, url: b.u } }; }),
    mastery: KG.mastery,
    dueCount: dueItems().length,
    timeFilter: kgTime,
    target: kgTarget,
    targets: KG_TARGETS,
    targetCount: allTargetItems().length,
    gymMode: !!gm,
    gym: gm ? {
      concepts: (gm.concepts||[]).map((v,i)=>link(v,'c',i)),
      practice: (gm.practice||[]).map((v,i)=>link(v,'p',i)),
      reading:  (gm.reading||[]).map((r,i)=>{ const b=KG_BOOKS[r[0]]; return { label:r[1], url:b?b.u:'#', key:kgTopic+'|r|'+i, done:!!KG.gymDone[kgTopic+'|r|'+i] }; }),
    } : null,
    sources: (topic && topic.books ? topic.books : []).map(bk => { const b = KG_BOOKS[bk]; return b ? { title: b.t, url: b.u } : null; }).filter(Boolean),
    revealed: kgRevealed,
  });
}

/** Undo: revert to the last PERSISTED state via the engine, never a memory snapshot. */
async function discardChanges(){
  const res = await MC.sync.discard();
  if (!res.restored.length) return false;
  paintSaveChip();
  try{
    if (document.getElementById('pane-workout').classList.contains('on')) renderWorkout();
    if (document.getElementById('pane-weight').classList.contains('on')) renderWeight();
    if (document.getElementById('pane-knowledge').classList.contains('on')) renderKnowledge();
    if (document.getElementById('pane-data').classList.contains('on')) renderData();
  }catch(e){}
  return true;
}

/* ---- Knowledge: SRS + mastery derived by the proven core ---- */
/** Cards due on or before today, most overdue first. */
function dueItems(){
  const byId = {}; allKGItems().forEach(it=>{ byId[it.id]=it; });
  return MC.dueCards(Object.keys(byId), KG, dstr()).map(c=>byId[c.id]).filter(Boolean);
}
/** SM-2 transition. Pure, property-tested: pass grows the interval, fail floors it. */
function schedule(id, rating){
  if (!KG.srs) KG.srs = {};
  const next = MC.schedule(KG.srs[id], rating, dstr());
  KG.srs[id] = next;
  return next;
}

/* ---- Save lifecycle: delegated to the SyncEngine ---- */
function anyDirty(){ return MC.sync.anyDirty() || dirty || wkDirty || sgDirty || (typeof kgDirtyFlag!=='undefined' && kgDirtyFlag); }

/** Snapshot for the Discard button. The engine owns persistence; this is UI-level undo. */

/** Backgrounding: hand everything to the engine. It writes synchronously first. */
function flushAll(reason){
  try{
    MC.sync.save();
    localStorage.setItem('meridian_last_flush', new Date().toISOString()+' ('+(reason||'')+')');
  }catch(e){}
}

/* ---- Workout tab: typed selectors + delegated view ---- */
let wkView = null;
function ensureWorkoutView(){
  if (wkView) return wkView;
  wkView = MC.mountWorkoutView({
    container: paneWorkout,
    videoUrl: exVideo,
    dateLabel: dLabel,
    actions: {
      logSet(ex, type, weight, reps){
        if (!ex || !weight || !reps) return;
        const td = wkDate || dstr();
        if (!WK.days[td]) WK.days[td] = [];
        const m = exMeta(ex);
        WK.days[td].push({ id: uid(), ex, muscle: m.muscle || '', group: m.group || '', type, weight, reps });
        wkMarkDirty();
        // auto-complete: tick the exercise once every prescribed set is in
        const planned = MC.selectWorkoutView(WK, td, dstr(), { deload: wkDeload }).plans[ex];
        const need = planned && !planned.cardio ? planned.warms.length + 1 + planned.backs.length : 1;
        if ((WK.days[td].filter(s=>s.ex===ex).length) >= need) {
          if (!WK.done) WK.done = {};
          if (!WK.done[td]) WK.done[td] = [];
          if (WK.done[td].indexOf(ex) < 0) WK.done[td].push(ex);
          dismissRestFor(ex);
        }
        wkView.clearEdits(cssId(ex));
        renderWorkout();
      },
      deleteSet(date, id){
        tomb(WK, id);
        WK.days[date] = (WK.days[date]||[]).filter(s => String(s.id) !== String(id));
        wkMarkDirty(); renderWorkout();
      },
      toggleExerciseDone(ex){
        const k = wkDate || dstr();
        if (!WK.done) WK.done = {};
        if (!WK.done[k]) WK.done[k] = [];
        const i = WK.done[k].indexOf(ex);
        if (i >= 0) WK.done[k].splice(i,1); else { WK.done[k].push(ex); dismissRestFor(ex); }
        wkMarkDirty(); renderWorkout();
      },
      toggleSessionDone(){
        const k = wkDate || dstr();
        if (!WK.sessionDone) WK.sessionDone = {};
        WK.sessionDone[k] = !WK.sessionDone[k];
        if (WK.sessionDone[k]) stopRest(true);
        wkMarkDirty(); renderWorkout(); saveAll(false);
      },
      toggleDeload(ex){ wkDeload[ex] = !wkDeload[ex]; renderWorkout(); },
      editIncrement(ex){
        const cur = MC.inferIncrement(WK, ex);
        const v = prompt('Smallest weight step for '+ex+' at your gym (lb).\n\nPlate-loaded: 5 or 10. Selectorized stack: often 10, 12.5, 15 or 20.', cur);
        if (v === null || v === '') return;
        if (!WK.incr) WK.incr = {};
        WK.incr[ex] = Math.max(1, +v || 5);
        wkMarkDirty(); renderWorkout();
      },
      startRest(ex, type){ startRest(ex, type); },
      undoLastSet(ex){
        const td = wkDate || dstr();
        if (!WK.days[td]) return;
        const sets = WK.days[td];
        for (let i = sets.length - 1; i >= 0; i--) {
          if (sets[i].ex === ex) {
            sets.splice(i, 1);
            wkMarkDirty();
            if (WK.done && WK.done[td]) {
              WK.done[td] = WK.done[td].filter(e => e !== ex);
            }
            renderWorkout();
            return;
          }
        }
      },
      changeDate(which){
        wkDate = which === 'today' ? dstr() : MC.shiftDate(wkDate || dstr(), which === 'next' ? 1 : -1);
        wkSplitTouched = false;
        renderWorkout();
      },
      changeSplit(split){ wkSplit = split; wkSplitTouched = true; renderWorkout(); },
      logBodyweight(v){
        if (!v) return;
        WK.bw[wkDate || dstr()] = v;
        if (!WK.settings.bwCurrent) WK.settings.bwCurrent = v;
        wkMarkDirty(); renderWorkout();
      },
    },
  });
  return wkView;
}

function renderWorkout(){
  if (!wkLoaded) { paneWorkout.innerHTML = '<div class="empty">Loading\u2026</div>'; wkLoad().then(()=>renderWorkout()); return; }
  const today = dstr();
  ensureWorkoutView().repaint(
    WK,
    wkDate || today,
    today,
    { deload: wkDeload, split: wkSplitTouched ? wkSplit : undefined },
    { current: currentBW(), goal: +WK.settings.bwGoal || null },
  );
}
function restSecs(ex, type){ return MC.restSeconds(WK, ex, type); }

/* ---- Meal tab: mounted once, repainted from the typed view model ---- */
let mealView = null;
function ensureMealView(){
  if (mealView) return mealView;
  mealView = MC.mountMealView(paneWeight, {
    addMeal(name, cal, protein){
      if (!name && !cal && !protein) { const e=document.getElementById('meal-status'); if(e){e.style.color='var(--deficit)';e.textContent='Enter a meal name, or calories/protein.';} return; }
      if (!sgDate) sgDate = dstr();
      (SG.days[sgDate] = SG.days[sgDate] || []).push({ id: uid(), name: name || 'Meal', cal: +cal||0, protein: +protein||0, est: false });
      sgMarkDirty(); renderWeight();
      ['meal-name','meal-cal','meal-pro'].forEach(k=>{ const el=document.getElementById(k); if(el) el.value=''; });
    },
    addPreset(name, cal, protein){
      if (!sgDate) sgDate = dstr();
      (SG.days[sgDate] = SG.days[sgDate] || []).push({ id: uid(), name, cal, protein, est: false });
      sgMarkDirty(); renderWeight();
    },
    deleteMeal(id){
      tomb(SG, id);
      SG.days[sgDate] = (SG.days[sgDate]||[]).filter(m => String(m.id) !== String(id));
      sgMarkDirty(); renderWeight();
    },
    async estimateWithAI(desc){
      if (!desc) return;
      const st = document.getElementById('meal-eststatus');
      const show = (msg, colour) => { if (st) { st.style.color = colour; st.textContent = msg; } };
      show('Asking DeepSeek\u2026', 'var(--muted)');

      const res = await ossEstimate(desc);
      if (res.error) {
        show(res.error === 'no proxy'
          ? 'Set up cloud sync (Data \u2192 Cloud backend) to enable AI estimation.'
          : 'Estimate failed: ' + res.error + ' \u2014 enter macros manually.', 'var(--deficit)');
        return;
      }
      if (!sgDate) sgDate = dstr();
      (SG.days[sgDate] = SG.days[sgDate] || []).push({ id: uid(), name: res.name, cal: res.cal, protein: res.protein, est: true });
      sgMarkDirty(); renderWeight();
      show('\u2713 ' + res.cal + ' kcal \u00b7 ' + res.protein + 'g', 'var(--ok)');
    },
    changeDate(which){
      sgDate = which==='today' ? dstr() : MC.shiftDate(sgDate||dstr(), which==='next'?1:-1);
      renderWeight();
    },
    editTargets(){
      const ask=(label,cur)=>{ const v=prompt(label,cur); return (v===null||v==='')?null:+v; };
      const c=ask('Current weight (lb):',SG.settings.current);   if(c!==null) SG.settings.current=c;
      const g=ask('Goal weight (lb):',SG.settings.goal);         if(g!==null) SG.settings.goal=g;
      const m=ask('Maintenance calories:',SG.settings.maintenance); if(m!==null) SG.settings.maintenance=m;
      const s=ask('Daily surplus (kcal):',SG.settings.surplus);  if(s!==null) SG.settings.surplus=s;
      const p=ask('Protein target (g):',SG.settings.proteinTarget); if(p!==null) SG.settings.proteinTarget=p;
      sgMarkDirty(); renderWeight();
    },
    adjustSupplement(delta){
      const k = sgDate || dstr();
      if (!SG.tad) SG.tad = {};
      SG.tad[k] = Math.max(0, (+SG.tad[k]||0) + delta);
      sgMarkDirty(); renderWeight();
    },
  }, {
    dateLabel: dLabel,
    presets: [
      { label:'Core Power Elite \u00b7 230 / 42g', name:'Core Power Elite', cal:230, protein:42 },
      { label:'Cook Unity \u00b7 900 / 40g',       name:'Cook Unity',       cal:900, protein:40 },
    ],
  });
  return mealView;
}

function renderWeight(){
  if (!sgLoaded) { paneWeight.innerHTML = '<div class="empty">Loading\u2026</div>'; sgLoad().then(renderWeight); return; }
  if (!sgDate) sgDate = dstr();
  ensureMealView().repaint(SG, sgDate, dstr());
}

/* ---- Data tab ---- */
let dataView = null;
let dataMsg = { text:'', bad:false };
function dmsg(text, bad){ dataMsg = { text, bad: !!bad }; renderData(); }
const paneData = document.getElementById('pane-data');
function ensureDataView(){
  if (dataView) return dataView;
  dataView = MC.mountDataView(paneData, {
    savePantryId(url, key){
      try{ localStorage.setItem('meridian_supabase_url', url); localStorage.setItem('meridian_supabase_key', key); }catch(e){}
      dmsg(url ? 'Saved. Cloud sync is ON — tap Test connection.' : 'Cleared. Cloud sync is OFF.');
    },
    async testConnection(){
      if (!cloudEnabled()) return dmsg('Add a Pantry ID first.', true);
      dmsg('Testing\u2026');
      const r = await MC.sync.save();
      dmsg(r.cloud==='synced'||r.cloud==='noop' ? '\u2713 Connection works. Cloud sync is live.'
                                                : 'Could not reach cloud: '+((r.cloudError&&r.cloudError.message)||r.cloud), r.cloud==='failed');
    },
    async push(){ dmsg('Pushing\u2026'); const r = await MC.sync.save();
      dmsg(r.cloud==='synced' ? '\u2713 Pushed.' : r.cloud==='noop' ? 'Already in sync.' : 'Push: '+r.cloud, r.cloud==='failed'); },
    async pull(){ dmsg('Pulling\u2026'); const applied = await MC.sync.pull();
      dmsg(applied ? '\u2713 Pulled. Reloading\u2026' : 'Already up to date.');
      if (applied) setTimeout(()=>location.reload(), 700); },
    exportAll(){
      const bundle = MC.exportBundle({ core:CORE, overload:WK, surplus:SG, csgraph:KG }, dstr());
      const io = document.getElementById('d-io'); if (io) io.value = MC.serialise(bundle);
      dmsg('Exported all 4 stores.');
    },
    importPasted(text){
      const r = MC.importBundle(text);
      if (!r.ok) return dmsg('Import failed: '+r.errors.join('; '), true);
      CORE=r.state.core; WK=r.state.overload; SG=r.state.surplus; KG=r.state.csgraph;
      markDirty(); wkMarkDirty(); sgMarkDirty();
      MC.sync.save().then(()=>{ dmsg('\u2713 Imported'+(r.warnings.length?' ('+r.warnings.length+' warning'+(r.warnings.length>1?'s':'')+')':'')+'. Reloading\u2026');
        setTimeout(()=>location.reload(), 800); });
    },
    copyToClipboard(){
      const io = document.getElementById('d-io');
      if (io && io.value) { try{ navigator.clipboard.writeText(io.value); dmsg('Copied.'); }catch(e){ dmsg('Copy failed \u2014 select and copy manually.', true); } }
      else dmsg('Export first.', true);
    },
    importSingle(store, text){
      if (!text.trim()) return dmsg('Paste a backup first.', true);
      let parsed; try{ parsed = JSON.parse(text); }catch(e){ return dmsg('Invalid JSON: '+e.message, true); }
      if (store==='overload') WK = MC.normaliseState({ overload: parsed }).overload;
      if (store==='surplus')  SG = MC.normaliseState({ surplus: parsed }).surplus;
      if (store==='core')     CORE = MC.normaliseState({ core: parsed }).core;
      if (store==='csgraph')  KG = MC.normaliseState({ csgraph: parsed }).csgraph;
      markDirty(); wkMarkDirty(); sgMarkDirty();
      MC.sync.save().then(()=>{ dmsg('\u2713 Imported into '+store+'. Reloading\u2026'); setTimeout(()=>location.reload(), 800); });
    },
    restoreSnapshot(){
      const raw = lsGet('meridian_prev_snapshot');
      if (!raw) return dmsg('No snapshot found on this device.', true);
      try{
        const s = JSON.parse(raw);
        if (!confirm('Restore the snapshot taken '+new Date(s.at).toLocaleString()+'?')) return;
        ['core','overload','surplus','csgraph'].forEach(k=>{ if (s[k]) lsSet(KEYS[k], s[k]); });
        dmsg('\u2713 Restored. Reloading\u2026'); setTimeout(()=>location.reload(), 700);
      }catch(e){ dmsg('Snapshot unreadable.', true); }
    },
    async showDiagnostics(){
      const out = document.getElementById('d-diagout'); if (!out) return;
      out.textContent = 'Checking\u2026';
      const metrics = MC.storageMetrics(MC.normaliseState({ core:CORE, overload:WK, surplus:SG, csgraph:KG }));
      const dirtyList = ['core','overload','surplus','csgraph'].filter(k=>MC.sync.isDirtyCloud(k));
      out.textContent =
        'cloud: '+(cloudEnabled()?'configured':'not configured')+'\n'+
        'payload: '+metrics.kilobytes+'KB\n'+
        'revision: '+MC.sync.baseRev()+'\n'+
        'unsynced stores: '+(dirtyList.length?dirtyList.join(', '):'none')+'\n'+
        'tombstones: '+metrics.counts.tombstones+' (cap 500)';
    },
  });
  return dataView;
}

function renderData(){
  const state = MC.normaliseState({ core:CORE, overload:WK, surplus:SG, csgraph:KG });
  ensureDataView().repaint({
    metrics: MC.storageMetrics(state),
    payloadKb: Math.round(JSON.stringify(state).length/102.4)/10,
    sync: {
      cloudConfigured: cloudEnabled(),
      pantryId: (()=>{ try{ const u = localStorage.getItem('meridian_supabase_url'); return u ? u.split('//')[1]?.split('.')[0]+'...' : ''; }catch(e){ return ''; } })(),
      baseRev: MC.sync.baseRev(),
      dirtyStores: ['core','overload','surplus','csgraph'].filter(k=>MC.sync.isDirtyCloud(k)),
      lastMessage: dataMsg.text,
      lastMessageBad: dataMsg.bad,
    },
    model: {
      // AI (DeepSeek via OpenRouter) is available iff the cloud proxy is set up.
      configured: cloudEnabled(),
      model: 'DeepSeek v4 Pro',
      keyPreview: '',
    },
  });
}

/* ================= TAB ROUTER ================= */
document.querySelectorAll('#tabbar button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#tabbar button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('on'));
    const t=b.getAttribute('data-t');
    document.getElementById('pane-'+t).classList.add('on');
    if(t==='workout') renderWorkout();
    if(t==='knowledge') renderKnowledge();
    if(t==='weight') renderWeight();
    if(t==='data')  renderData();
  };
});

/* Repaint every tab after a cloud pull merges new data into the globals.
   Panes are always in the DOM (just hidden), so rendering an inactive tab is
   safe — switching to it then shows synced data with no reload. Each is
   isolated so one failing render can't abort the rest. */
function renderAll(){
  try{ renderKnowledge(); }catch(e){}
  try{ renderWorkout();  }catch(e){}
  try{ renderWeight();   }catch(e){}
  try{ renderData();     }catch(e){}
}

/* ================= BOOT ================= */
(async function init(){
  await loadCore();
  paintSaveChip();
  document.getElementById('pane-knowledge').classList.add('on');
  renderKnowledge();
  // Pull from cloud in background after UI is ready
  if (cloudEnabled()) {
    setTimeout(async () => {
      try {
        const applied = await MC.sync.pull();
        if (applied) {
          renderAll();
        }
      } catch (e) { /* offline — fine */ }
    }, 2000);
  }
})();

/* ============ DURABILITY: flush every dirty store on exit/background ============
   Mobile Safari kills debounce timers when you switch apps or lock the screen,
   so pending saves were lost. Force a synchronous-as-possible flush on the
   moments the OS gives us: visibilitychange->hidden, pagehide, beforeunload. */
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){ flushAll('hidden'); return; }
  if(cloudEnabled() && !anyDirty()){
    try{ const applied = await MC.sync.pull(); if(applied) renderAll(); }catch(e){}
  }
});
window.addEventListener('pagehide',()=>flushAll('pagehide'));
window.addEventListener('beforeunload',()=>flushAll('beforeunload'));

/* ============ HARNESS: prove persistence works across sessions ============
   Increments a boot counter and round-trips a probe value. If the counter
   never climbs past 1 across real app restarts, storage is NOT persisting
   in this environment — surfaced visibly instead of failing silently. */
