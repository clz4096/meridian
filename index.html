   +'</div>'+(kgTarget!=='all'?('<div class="note" style="margin-top:6px">'+allTargetItems().length+' questions tagged '+kgTarget+' across all topics \u00b7 <button class="mbtn" id="kg-target-all" style="padding:3px 8px;font-size:11px">Study them all</button></div>'):'')+'</div>';
  h+='<div class="timebar" style="margin-top:10px">'+['all','5','15','30'].map(tm=>'<button class="'+(tm===kgTime?'on':'')+'" data-ktime="'+tm+'">'+({all:'All','5':'Quick \u00b7 5m','15':'Standard \u00b7 15m','30':'Deep \u00b7 30m'}[tm]||tm)+'</button>').join('')+'</div>';

  h+=shown.map(it=>{
    const m=KG.mastery[it.id]||0; const full=(it.flow!=='flip');
    let c='<div class="qcard" id="qc-'+it.id+'"><div class="qtop"><span class="qtime">'+it.mins+' min \u00b7 '+(full?'attempt':'flip')+'</span>'
      +(m?'<span class="masterbadge" style="background:'+masterColor(m)+'22;color:'+masterColor(m)+'">'+masterLabel(m)+'</span>':'')+'</div>';
    c+='<div class="qprompt">'+esc(it.prompt)+'</div>';
    c+='<div class="qsrc">'+bookRef(it.src.book,it.src.ref)+'</div>';
    // in-app answer box for attempt items
    if(full){ c+='<textarea class="ans dictxt" id="ans-'+it.id+'" style="min-height:80px;margin-top:8px" placeholder="Write your answer here, then reveal to compare \u2014 active recall beats just reading."></textarea>'; }
    c+='<div class="qactions"><button class="mbtn" data-reveal="'+it.id+'">'+(full?'Reveal model answer':'Show answer')+'</button>'
      +(full?'<button class="mbtn" data-aigrade="'+it.id+'">AI grade my answer</button>':'')+'</div>';
    c+='<div id="ai-'+it.id+'" class="note" style="margin-top:6px"></div>';
    c+='<div class="reveal" id="rv-'+it.id+'">'+fmtReveal(it.reveal)
      +'<div class="mrow" style="margin-top:8px"><button class="mbtn" data-review="'+it.id+'">\u2795 Add to review queue</button></div>'
      +'<div class="rate" id="rate-'+it.id+'">'
      +'<span style="color:var(--dim);font-size:11px;align-self:center">Rate recall:</span>'
      +[1,2,3,4,5].map(n=>'<button data-rate="'+it.id+'|'+n+'">'+n+' '+masterLabel(n)+'</button>').join('')+'</div></div>';
    c+='</div>';
    return c;
  }).join('');

  paneKnow.innerHTML=h; wireKnowledge();
}

function wireKnowledge(){
  paneKnow.querySelectorAll('[data-kt]').forEach(b=>b.onclick=()=>{ kgTopic=b.getAttribute('data-kt'); kgTime='all'; renderKnowledge(); });
  const rb=document.getElementById('kg-review'); if(rb) rb.onclick=()=>{ kgTopic='__review__'; kgTime='all'; kgGym=false; renderKnowledge(); };
  paneKnow.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{
    const id=b.getAttribute('data-review');
    KG.srs[id]={ due: shift(dstr(),1), ivl:1, ease:2.3, n:0 };
    kgMarkDirty(); b.textContent='\u2713 Queued for tomorrow'; b.disabled=true;
  });
  paneKnow.querySelectorAll('[data-ktarget]').forEach(b=>b.onclick=()=>{ kgTarget=b.getAttribute('data-ktarget'); renderKnowledge(); });
  { const ta=document.getElementById('kg-target-all'); if(ta) ta.onclick=()=>{ kgTopic='__target__'; kgGym=false; renderKnowledge(); }; }
  const gb=document.getElementById('kg-gym'); if(gb) gb.onclick=()=>{ kgGym=!kgGym; renderKnowledge(); };
  paneKnow.querySelectorAll('[data-gymdone]').forEach(el=>el.onclick=()=>{ const k=el.getAttribute('data-gymdone'); KG.gymDone[k]=!KG.gymDone[k]; kgMarkDirty(); renderKnowledge(); });
  paneKnow.querySelectorAll('[data-aigrade]').forEach(b=>b.onclick=async()=>{
    const id=b.getAttribute('data-aigrade'); const it=allKGItems().find(x=>x.id===id);
    const ans=(document.getElementById('ans-'+id)||{}).value||''; const out=document.getElementById('ai-'+id);
    if(!ans.trim()){ out.style.color='var(--deficit)'; out.textContent='Write an answer first.'; return; }
    out.style.color='var(--muted)'; out.textContent='Grading\u2026';
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:400,
        messages:[{role:'user',content:'You are grading a technical interview answer. Question: '+it.prompt+'\n\nModel answer: '+it.reveal+'\n\nCandidate answer: '+ans+'\n\nGive a 1-2 sentence assessment of what was right and what was missed, then on a new line output exactly: SCORE: N (where N is 1-5 recall quality). Be concise and honest.'}]
      })});
      const data=await r.json(); let txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
      const mm=txt.match(/SCORE:\s*([1-5])/); const sc=mm?+mm[1]:null;
      out.style.color='var(--text)'; out.innerHTML=esc(txt.replace(/SCORE:\s*[1-5]/,'').trim());
      const rv=document.getElementById('rv-'+id); if(rv) rv.classList.add('on');
      if(sc){ const rateBtns=document.querySelectorAll('[data-rate="'+id+'|'+sc+'"]'); if(rateBtns[0]){ rateBtns[0].style.borderColor='var(--teal)'; rateBtns[0].style.color='var(--text)'; } out.innerHTML+='<br><span style="color:var(--teal)">AI suggests recall '+sc+'/5 \u2014 tap to confirm.</span>'; }
    }catch(e){ out.style.color='var(--deficit)'; out.textContent='Grading failed \u2014 rate yourself after revealing.'; }
  });
  paneKnow.querySelectorAll('[data-ktime]').forEach(b=>b.onclick=()=>{ kgTime=b.getAttribute('data-ktime'); renderKnowledge(); });
  paneKnow.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{ const id=b.getAttribute('data-reveal'); const rv=document.getElementById('rv-'+id); rv.classList.toggle('on'); b.textContent=rv.classList.contains('on')?'Hide':'Show answer'; });
  paneKnow.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
    const [id,n]=b.getAttribute('data-rate').split('|'); const score=+n;
    KG.mastery[id]=score;
    const sc=schedule(id,score);
    const it=allKGItems().find(x=>x.id===id);
    KG.log.push({id,date:dstr(),score,topic:kgTopic});
    kgMarkDirty();
    // cross-link into Study/Today: count a solved problem when score>=4
    CORE.entries.push({id:uid(),date:dstr(),stream:'kg',problem:(it?it.prompt.slice(0,42)+'\u2026':id),topic:kgTopic,status:score>=4?'solved':'attempted',score,xp:score*4});
    markDirty();
    renderKnowledge();
  });
}

/* ================= WEIGHT GAIN (Surplus) — real data model =================
   Storage: surplus-tracker-state = { settings:{current,goal,maintenance,proteinTarget,surplus}, days:{iso:[meal]} }
   meal = { id, name, cal, protein, est }
   AI meal estimator via Anthropic API (claude-sonnet-4-6). */
const paneWeight = document.getElementById('pane-weight');
let SG = { settings:{}, days:{}, tad:{} };
let sgLoaded=false, sgDirty=false, sgDate=null;

function sgMarkDirty(){ sgDirty=true; paintSaveChip(); }
async function sgLoad(){ const s=await rawGet(KEYS.surplus);
  if(s){ try{ const st=JSON.parse(s); SG={settings:st.settings||{},days:st.days||{},tad:st.tad||{}}; }catch(e){ SG={settings:{},days:{},tad:{}}; } }
  // Fresh device → bake in your real bulk targets so the header is correct immediately.
  const DEF={current:120,goal:147,maintenance:2200,surplus:500,proteinTarget:147};
  if(!SG.settings || Object.keys(SG.settings).length===0) SG.settings={...DEF};
  if(!SG.settings.maintenance) SG.settings.maintenance=DEF.maintenance;
  if(!SG.settings.surplus) SG.settings.surplus=DEF.surplus;
  if(!SG.settings.proteinTarget) SG.settings.proteinTarget=DEF.proteinTarget;
  if(!SG.settings.current) SG.settings.current=DEF.current;
  if(!SG.settings.goal) SG.settings.goal=DEF.goal;
  sgLoaded=true; if(!SG.tad) SG.tad={}; if(!sgDate) sgDate=dstr(); snapshotClean();
}
function dayMeals(d){ return SG.days[d]||[]; }
function sumCal(d){ return dayMeals(d).reduce((a,x)=>a+(+x.cal||0),0); }
function sumPro(d){ return dayMeals(d).reduce((a,x)=>a+(+x.protein||0),0); }

function renderWeight(){
  if(!sgLoaded){ paneWeight.innerHTML='<div class="empty">Loading\u2026</div>'; sgLoad().then(renderWeight); return; }
  const s=SG.settings, d=sgDate, isToday=(d===dstr());
  const target=(+s.maintenance||0)+(+s.surplus||0);
  const cal=sumCal(d), pro=sumPro(d);
  const calPct=target?Math.min(100,Math.round(100*cal/target)):0;
  const proPct=s.proteinTarget?Math.min(100,Math.round(100*pro/s.proteinTarget)):0;

  let h='';
  // goal header
  h+='<div class="panel"><p class="panel-t">Bulk target</p><div class="statgrid">'
   +'<div class="stat"><div class="v">'+(s.current||'\u2014')+'</div><div class="k">current lb</div></div>'
   +'<div class="stat"><div class="v" style="color:var(--teal)">'+(s.goal||'\u2014')+'</div><div class="k">goal lb</div></div>'
   +'<div class="stat"><div class="v">'+target+'</div><div class="k">daily kcal</div></div>'
   +'<div class="stat"><div class="v" style="color:var(--protein)">'+(s.proteinTarget||'\u2014')+'g</div><div class="k">protein</div></div>'
   +'</div>'
   +'<div class="mrow" style="margin-top:10px"><button class="mbtn" id="wg-settings">Edit targets</button></div></div>';

  // today's intake
  h+='<div class="panel"><div class="mrow" style="justify-content:space-between"><p class="panel-t" style="margin:0">Intake</p>'
   +'<div class="mrow"><button class="mbtn" id="wg-prev">\u2039</button>'
   +'<span style="font-family:var(--mono);font-size:12px;min-width:150px;text-align:center">'+dLabel(d)+'</span>'
   +'<button class="mbtn" id="wg-next">\u203a</button>'
   +(isToday?'':'<button class="mbtn" id="wg-today">\u2192 Today</button>')+'</div></div>';
  h+='<div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin:6px 0">'+d+'</div>';
  h+='<div class="slabel">Calories '+cal+' / '+target+'</div><div class="bar"><div style="width:'+calPct+'%;background:var(--fuel)"></div></div>';
  h+='<div class="slabel">Protein '+pro+'g / '+(s.proteinTarget||0)+'g</div><div class="bar"><div style="width:'+proPct+'%;background:var(--protein)"></div></div>';
  const surplusNow=cal-(+s.maintenance||0);
  h+='<div class="note" style="margin-top:6px">'+(surplusNow>=0?('+'+surplusNow+' over maintenance'):(surplusNow+' under maintenance'))+(cal>=target?' \u00b7 target hit \u2713':'')+'</div>';

  // meals list
  const meals=dayMeals(d);
  h+='<div style="margin-top:10px">'+(meals.length?meals.map(m=>
     '<div class="sentry"><span style="flex:1">'+esc(m.name)+(m.est?' <span class="mchip" style="background:var(--panel2);color:var(--teal)">est</span>':'')+'</span>'
     +'<span style="font-family:var(--mono);color:var(--muted);font-size:12px">'+m.cal+' kcal \u00b7 '+m.protein+'g</span>'
     +'<span class="rm" data-delm="'+m.id+'">\u00d7</span></div>').join(''):'<div class="empty">No meals logged.</div>')+'</div>';
  h+='</div>';

  // tadalafil panel (real data: SG.tad[date] = count)
  const tadCount=(SG.tad&&SG.tad[d])||0;
  // steady-state: count doses in the last 5 days
  let recent=0; for(let i=0;i<5;i++){ recent += (SG.tad[shift(d,-i)]||0); }
  h+='<div class="panel"><div class="mrow" style="justify-content:space-between"><p class="panel-t" style="margin:0">Tadalafil</p>'
   +'<div class="mrow"><button class="mbtn" id="tad-minus">\u2212</button>'
   +'<span style="font-family:var(--mono);font-size:20px;min-width:44px;text-align:center">'+tadCount+'\u00d79mg</span>'
   +'<button class="mbtn" id="tad-plus">+</button></div></div>'
   +'<div class="note">'+recent+' doses in the last 5 days'+(recent>=10?' \u00b7 steady state':'')+'</div></div>';

  // quick-add presets (one tap)
  h+='<div class="panel mpanel"><p class="panel-t">Quick add</p><div class="mrow" style="flex-wrap:wrap;gap:8px">'
   +'<button class="mbtn" id="preset-cp">+ Core Power Elite · 230 / 42g</button>'
   +'<button class="mbtn" id="preset-cu">+ Cook Unity · 900 / 40g</button>'
   +'</div></div>';
  // add meal (manual)
  h+='<div class="panel mpanel"><p class="panel-t">Add meal</p><div class="mrow"><input id="meal-name" placeholder="meal" style="flex:1;min-width:120px"><input id="meal-cal" type="number" placeholder="kcal" style="width:80px"><input id="meal-pro" type="number" placeholder="protein" style="width:90px"><button class="mbtn primary" id="meal-add">Add</button></div><div id="meal-status" class="note" style="margin-top:6px"></div>';
  // AI estimate
  h+='<div style="margin-top:10px"><p class="slabel" style="margin-bottom:6px">Or estimate from a description</p><div class="mrow"><input id="meal-desc" placeholder="e.g. 2 eggs, oatmeal, banana, whole milk" style="flex:1;min-width:160px"><button class="mbtn" id="meal-est">Estimate with AI</button></div><div id="meal-eststatus" class="note" style="margin-top:6px"></div></div></div>';

  paneWeight.innerHTML=h; wireWeight();
}
function wireWeight(){
  const g=id=>document.getElementById(id);
  g('wg-prev').onclick=()=>{ sgDate=shift(sgDate,-1); renderWeight(); };
  g('wg-next').onclick=()=>{ sgDate=shift(sgDate,1); renderWeight(); };
  { const tb=g('wg-today'); if(tb) tb.onclick=()=>{ sgDate=dstr(); renderWeight(); }; }
  g('wg-settings').onclick=()=>{
    const cur=prompt('Current weight (lb):',SG.settings.current||''); if(cur!==null&&cur!=='') SG.settings.current=+cur;
    const goal=prompt('Goal weight (lb):',SG.settings.goal||''); if(goal!==null&&goal!=='') SG.settings.goal=+goal;
    const maint=prompt('Maintenance calories:',SG.settings.maintenance||''); if(maint!==null&&maint!=='') SG.settings.maintenance=+maint;
    const sur=prompt('Daily surplus (kcal above maintenance):',SG.settings.surplus||''); if(sur!==null&&sur!=='') SG.settings.surplus=+sur;
    const pt=prompt('Protein target (g):',SG.settings.proteinTarget||''); if(pt!==null&&pt!=='') SG.settings.proteinTarget=+pt;
    sgMarkDirty(); renderWeight();
  };
  const mstat=(msg,bad)=>{ const e=g('meal-status'); if(!e) return; e.style.color=bad?'var(--deficit)':'var(--ok)'; e.textContent=msg; setTimeout(()=>{ if(e) e.textContent=''; },2500); };
  const addMeal=(name,cal,pro,est)=>{
    const c=+cal||0, p=+pro||0;
    name=(name||'').trim();
    if(!name && !c && !p){ mstat('Enter a meal name, or calories/protein.',true); return; }
    if(!name) name='Meal';                       // macros given but no label \u2014 still log it
    if(!sgDate) sgDate=dstr();
    if(!SG.days[sgDate]) SG.days[sgDate]=[];
    SG.days[sgDate].push({id:uid(),name,cal:c,protein:p,est:!!est});
    sgMarkDirty();
    renderWeight();
    mstat('\u2713 Added '+name+' \u00b7 '+c+' kcal \u00b7 '+p+'g');
  };
  const tp=g('tad-plus'), tm=g('tad-minus');
  if(tp) tp.onclick=()=>{ SG.tad[sgDate]=((SG.tad[sgDate]||0)+1); sgMarkDirty(); renderWeight(); };
  if(tm) tm.onclick=()=>{ SG.tad[sgDate]=Math.max(0,(SG.tad[sgDate]||0)-1); sgMarkDirty(); renderWeight(); };
  const submitMeal=()=>{
    const n=g('meal-name'), c=g('meal-cal'), p=g('meal-pro');
    addMeal(n?n.value:'', c?c.value:'', p?p.value:'', false);
    if(n) n.value=''; if(c) c.value=''; if(p) p.value='';
  };
  { const b=g('meal-add'); if(b) b.onclick=submitMeal; }
  ['meal-name','meal-cal','meal-pro'].forEach(k=>{ const el=g(k); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submitMeal(); } }); });
  { const b=g('preset-cp'); if(b) b.onclick=()=>addMeal('Core Power Elite',230,42,false); }
  { const b=g('preset-cu'); if(b) b.onclick=()=>addMeal('Cook Unity',900,40,false); }
  paneWeight.querySelectorAll('[data-delm]').forEach(el=>el.onclick=()=>{ const id=el.getAttribute('data-delm'); SG.days[sgDate]=(SG.days[sgDate]||[]).filter(m=>String(m.id)!==id); sgMarkDirty(); renderWeight(); });
  g('meal-est').onclick=async()=>{
    const desc=g('meal-desc').value.trim(); if(!desc) return;
    const st=g('meal-eststatus'); st.style.color='var(--muted)'; st.textContent='Estimating\u2026';
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:300,
        messages:[{role:'user',content:'Estimate total calories and protein grams for this food. Reply ONLY as compact JSON: {"name":"short label","cal":number,"protein":number}. Food: '+desc}]
      })});
      const data=await r.json();
      let txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('').replace(/```json|```/g,'').trim();
      const obj=JSON.parse(txt);
      addMeal(obj.name||desc.slice(0,40), obj.cal, obj.protein, true);
      st.textContent='Added: '+(obj.cal)+' kcal \u00b7 '+(obj.protein)+'g';
    }catch(e){ st.style.color='var(--deficit)'; st.textContent='Estimate failed \u2014 add manually.'; }
  };
}

/* ================= BOOT ================= */
let pendingPush=false;
(async function init(){
  // If cloud is configured, pull first so this device shows the latest across devices.
  if(cloudEnabled()){
    try{
      const r=await cloudPull();
      const localM = parseInt(lsGet('meridian_local_mtime')||'0',10)||0;
      const cloudM = r.ok && r.data ? (+r.data.syncedAt||0) : 0;
      const hasLocal = !!lsGet(KEYS.overload) || !!lsGet(KEYS.core);
      if(r.ok && r.data && (!hasLocal || cloudM > localM)){
        await cloudApply(r.data, cloudM);            // cloud is newer (or device is empty) \u2014 safe
      } else if(hasLocal && localM > cloudM && cloudEnabled()){
        pendingPush = true;                          // LOCAL is newer \u2014 push it up instead
      }
    }catch(e){}
  }
  await loadCore();
  paintSaveChip();
  renderToday();
  document.getElementById('pane-study').classList.add('on'); renderStudy();
  await persistenceSelfTest();
  if(pendingPush){ try{ const r=await cloudPush(); if(r.ok) localStorage.setItem('meridian_cloud_mtime',String(r.at)); }catch(e){} }   // harness: verify storage actually persists across sessions
  // live clock refresh on Today (pause while typing)
  setInterval(()=>{
    const p=document.getElementById('pane-today');
    if(p&&p.classList.contains('on')){
      const ae=document.activeElement, tg=ae&&ae.tagName;
      if(tg!=='INPUT'&&tg!=='SELECT'&&tg!=='TEXTAREA') renderToday();
    }
  },30000);
})();

/* ============ DURABILITY: flush every dirty store on exit/background ============
   Mobile Safari kills debounce timers when you switch apps or lock the screen,
   so pending saves were lost. Force a synchronous-as-possible flush on the
   moments the OS gives us: visibilitychange->hidden, pagehide, beforeunload. */
function flushAll(reason){
  let wroteSomething=false;
  try{
    // Synchronous localStorage writes as the hard-kill backstop (window.storage/IDB may not finish).
    if(typeof dirty!=='undefined' && dirty && coreHydrated){ lsSet(KEYS.core, JSON.stringify(CORE)); lsSet(KEYS.core+'__v', String(Date.now())); wroteSomething=true; }
    if(typeof wkDirty!=='undefined' && wkDirty && wkLoaded){ lsSet(KEYS.overload, JSON.stringify(WK)); lsSet(KEYS.overload+'__v', String(Date.now())); wroteSomething=true; }
    if(typeof sgDirty!=='undefined' && sgDirty && sgLoaded){ lsSet(KEYS.surplus, JSON.stringify(SG)); lsSet(KEYS.surplus+'__v', String(Date.now())); wroteSomething=true; }
    if(typeof KG!=='undefined' && KG && typeof kgLoaded!=='undefined' && kgLoaded && kgDirtyFlag){ lsSet(KEYS.csgraph, JSON.stringify(KG)); lsSet(KEYS.csgraph+'__v', String(Date.now())); wroteSomething=true; }
    // Also kick the full async save (may complete on soft-close); harmless if it doesn't finish.
    saveAll(true);
    try{ localStorage.setItem('meridian_last_flush', new Date().toISOString()+' ('+(reason||'')+')');
         if(wroteSomething) localStorage.setItem('meridian_local_mtime', String(Date.now())); }catch(e){}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAll('hidden'); });
window.addEventListener('pagehide',()=>flushAll('pagehide'));
window.addEventListener('beforeunload',()=>flushAll('beforeunload'));

/* ============ HARNESS: prove persistence works across sessions ============
   Increments a boot counter and round-trips a probe value. If the counter
   never climbs past 1 across real app restarts, storage is NOT persisting
   in this environment — surfaced visibly instead of failing silently. */
async function persistenceSelfTest(){
  const probeKey='meridian_persist_probe';
  const bootKey='meridian_boot_count';
  let report={ backend: hasWS?'window.storage(+localStorage)':'localStorage', boots:1, roundtrip:false, lastFlush:null };
  try{
    // round-trip probe
    const token='ok-'+Date.now();
    await rawSet(probeKey, token);
    const got=await rawGet(probeKey);
    report.roundtrip=(got===token);
    // boot counter (persists across sessions if storage works)
    const prev=await rawGet(bootKey);
    const n=(prev?parseInt(prev,10):0)+1;
    await rawSet(bootKey, String(n));
    report.boots=n;
    report.lastFlush=lsGet('meridian_last_flush');
  }catch(e){ report.error=e.message; }
  renderStorageHealth(report);
  return report;
}
function renderStorageHealth(r){
  // small badge on the Today pane header; tap for detail
  const host=document.getElementById('pane-today'); if(!host) return;
  let bar=document.getElementById('storage-health');
  if(!bar){ bar=document.createElement('div'); bar.id='storage-health'; bar.style.cssText='margin:8px 0;padding:8px 10px;border-radius:8px;font-family:var(--mono),monospace;font-size:11px;cursor:pointer'; host.insertBefore(bar, host.firstChild); }
  const healthy = r.roundtrip && r.boots>1;
  const warn = r.roundtrip && r.boots<=1;   // writes work this session but no prior boot seen yet
  const bad = !r.roundtrip;
  bar.style.background = bad?'rgba(220,80,80,.15)': warn?'rgba(220,180,60,.15)':'rgba(80,200,140,.12)';
  bar.style.color = bad?'#e57373': warn?'#d4b03c':'#5ac88c';
  const label = bad?'⚠ storage NOT persisting — data will not save':
                warn?'storage OK this session · restart to confirm persistence':
                '✓ storage healthy · session #'+r.boots;
  bar.textContent = label;
  bar.title = JSON.stringify(r,null,2);
  bar.onclick=()=>alert('Storage health\n\nBackend: '+r.backend+'\nWrite round-trip: '+(r.roundtrip?'PASS':'FAIL')+'\nSessions recorded: '+r.boots+'\nLast flush: '+(r.lastFlush||'none')+(r.error?('\nError: '+r.error):'')+'\n\nIf sessions stays at 1 after fully reopening the app, this environment is wiping storage between sessions.');
}
