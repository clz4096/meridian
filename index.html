<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meridian">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Meridian</title>
<style>
:root{
  --bg:#0E1116; --panel:#161B22; --panel2:#1C222B; --line:rgba(255,255,255,.10);
  --text:#E7EBF2; --muted:#8B95A7; --dim:#5C6678; --track:#232A33;
  --teal:#4FB0A5; --tealSoft:#10241d; --fuel:#E0A64B; --ok:#1D9E75; --deficit:#D8654F;
  --protein:#8A6FD1; --interview:#D8654F;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
.appwrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
.brandrow{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px;position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:20}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em}
.brand b{color:var(--teal)}
/* save status chip */
.savechip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.lift.exdone{opacity:.55}
.lift.exdone .lift-name{text-decoration:line-through}
.discardfab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:24px;padding:12px 16px;font-family:var(--mono);font-size:12px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
.savefab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;border:none;border-radius:24px;padding:12px 22px;cursor:pointer;user-select:none;background:var(--panel2,#1a1c22);color:var(--muted);box-shadow:0 6px 20px rgba(0,0,0,.45);transition:background .15s,color .15s}
.savefab .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savefab.dirty{background:var(--fuel);color:#0e0f13;font-weight:600}
.savefab.dirty .dot{background:#0e0f13}
.savefab.saving{opacity:.7}
.appwrap{padding-bottom:150px}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip.dirty{cursor:pointer;border-color:var(--fuel);color:var(--fuel)}
.savechip.dirty .dot{background:var(--fuel)}
.savechip.saving{color:var(--muted)}
/* tab bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(0,0,0,.35)}
.navbar button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--dim);cursor:pointer;padding:8px 2px;font-family:inherit}
.navbar button .ni{font-size:17px;line-height:1;display:block;padding:3px 14px;border-radius:14px;transition:background .15s,color .15s}
.navbar button .nl{font-size:10.5px;letter-spacing:.02em}
.navbar button.on{color:var(--teal)}
.navbar button.on .ni{background:var(--tealSoft,rgba(90,200,140,.16));color:var(--teal)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--panel2);color:var(--text);border-color:var(--teal)}
.tabpane{display:none}
.tabpane.on{display:block}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:var(--mono);margin:0 0 12px}
.empty{color:var(--dim);font-size:13px}
.placeholder{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;color:var(--dim);text-align:center;margin-top:14px;font-size:14px}
/* buttons/inputs */
.mbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font-size:13.5px;font-family:var(--sans)}
.mbtn:hover{border-color:var(--dim)}
.mbtn.primary{background:var(--teal);color:#04211d;border:none;font-weight:600}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mpanel input,.mpanel select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;border-radius:8px;padding:8px 10px;outline:none}
.mpanel input:focus,textarea:focus{border-color:var(--teal)}
/* today stat row */
.statgrid{display:flex;gap:22px;flex-wrap:wrap}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500}
.stat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
/* schedule rows */
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px;margin:3px 0;font-size:14px;border:1px solid transparent}
.tdrow.tnow{background:var(--panel2);border-color:var(--teal)}
.tdrow.done{opacity:.5}.tdrow.done .lab{text-decoration:line-through}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ok);font-weight:700;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;gap:2px}
.lab{}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim)}
.nowtag{font-size:10px;background:var(--teal);color:#04211d;padding:1px 6px;border-radius:8px;margin-left:4px}
.bar{height:8px;background:var(--track);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar>div{height:100%;background:var(--ok);border-radius:6px}
.goalrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.goalrow:last-child{border-bottom:none}
.chiprow{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:96px}
.chip .cv{font-family:var(--mono);font-size:17px}
.chip .ck{font-size:10px;color:var(--dim);text-transform:uppercase}
.savedflash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#04211d;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.savedflash.show{opacity:1}
.note{font-size:12px;color:var(--muted)}
.dictxt{width:100%;min-height:150px;font-family:var(--mono);font-size:11px}
/* study */
.slabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.sched-edit{display:flex;align-items:center;gap:8px;padding:8px 4px;border-radius:8px;margin:2px 0;font-size:13.5px;border:1px solid transparent}
.sched-edit.tnow{background:var(--panel2);border-color:var(--teal)}
.sched-edit .ed,.sched-edit .rm{color:var(--dim);cursor:pointer;font-size:12px;font-family:var(--mono)}
.sched-edit .ed:hover{color:var(--text)}.sched-edit .rm:hover{color:var(--deficit)}
.subblocks{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px 30px}
.sb{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.sb.work{color:var(--teal);border-color:var(--tealSoft);background:var(--tealSoft)}
.sb.rest{color:var(--dim)}
.mapline{font-family:var(--mono);font-size:11px;color:var(--fuel);margin:2px 0 0 30px}
.noteline{font-size:12px;color:var(--muted);margin:2px 0 0 30px}
.sentry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sentry:last-child{border-bottom:none}
.sentry .rm{margin-left:auto;color:var(--dim);cursor:pointer;padding:0 5px}
.sentry .rm:hover{color:var(--deficit)}
.mchip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:12px;font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);color:var(--muted);padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text)}
/* workout */
.lift{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.lift-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lift-name{font-size:16px;font-weight:600}
.cue{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:12px;white-space:nowrap}
.cue.bump{background:var(--tealSoft);color:var(--teal)}
.cue.hold{background:var(--panel2);color:var(--muted)}
.cue.add{background:#2a2010;color:var(--fuel)}
.cue.deload{background:#3a1a1a;color:var(--deficit)}
.lift-target{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:3px}
.setrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.setrow input{width:66px;text-align:center}
.setrow.done{opacity:.85;padding:6px 0}
.setrow.cur{background:var(--tealSoft);border-radius:8px;padding:4px 6px;margin-left:-6px}
.lastline{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.logged{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.setpill{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
/* knowledge */
.ktabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.ktabs::-webkit-scrollbar{display:none}

.tprog{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--teal)}
.ktab{flex:1 1 auto;min-width:calc(33.333% - 6px);background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 10px;font-size:12px;cursor:pointer;white-space:nowrap;text-align:center}
@media(max-width:420px){.ktab{min-width:calc(50% - 6px)}}
.ktab.on{background:var(--panel2);color:var(--text);border-color:var(--protein)}
.ktab .cnt{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:5px}
.timebar{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 10px}

.rate button{min-height:44px;min-width:44px}
.timebar button{min-height:44px;border:0;background:var(--panel2);color:var(--muted);padding:6px 11px;font-family:var(--mono);font-size:11px;cursor:pointer}
.timebar button.on{background:var(--protein);color:#0d0716}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtime{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--protein);white-space:nowrap}
.qprompt{font-size:14.5px;margin:8px 0 6px;line-height:1.55}
.qsrc{font-family:var(--mono);font-size:11px;color:var(--fuel)}
.qsrc a,.klink a{color:var(--teal)}
.qvid{font-size:12px;margin-top:4px}.qvid a{color:var(--teal)}
.qactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reveal{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line);font-size:13.5px;line-height:1.55;display:none}
.reveal.on{display:block}
.rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rate button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.rate button:hover{border-color:var(--protein);color:var(--text)}
.masterbadge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:9px}
.klink{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12.5px}
.klink b{color:var(--text)}
.stub{color:var(--dim);font-size:13px;margin-top:10px}
</style>

<div class="appwrap">
  <div class="brandrow">
    <div class="brand"><b>Meridian</b></div>
    <script>document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); if(typeof saveAll==='function') saveAll(false); } });</script>
  </div>


  <div class="tabpane on" id="pane-today"></div>
  <div class="tabpane" id="pane-study"></div>
  <div class="tabpane" id="pane-knowledge"></div>
  <div class="tabpane" id="pane-workout"></div>
  <div class="tabpane" id="pane-weight"></div>
  <div class="tabpane" id="pane-data"></div>
</div>
<nav class="navbar" id="tabbar" role="navigation" aria-label="Main">
  <button data-t="today" class="on" aria-label="Today"><span class="ni">◉</span><span class="nl">Today</span></button>
  <button data-t="knowledge" aria-label="Study"><span class="ni">◈</span><span class="nl">Study</span></button>
  <button data-t="workout" aria-label="Workout"><span class="ni">▲</span><span class="nl">Workout</span></button>
  <button data-t="weight" aria-label="Meals"><span class="ni">●</span><span class="nl">Meals</span></button>
  <button data-t="data" aria-label="Data"><span class="ni">▦</span><span class="nl">Data</span></button>
</nav>
<div class="restbar" id="restbar" style="display:none">
  <div style="flex:1"><div id="resttxt" style="font-family:var(--mono);font-size:12px"></div>
  <div class="bar" style="margin-top:5px;height:5px"><div id="restfill" style="width:0%"></div></div></div>
  <button class="mbtn" id="rest-stop" style="margin-left:10px">Done</button>
</div>
<button class="discardfab" id="discardfab" style="display:none">↺ Discard</button>
<button class="savefab" id="savechip"><span class="dot"></span><span id="savetxt">All changes saved</span></button>
<div class="savedflash" id="savedflash">Saved \u2713</div>

<script>
/* =========================================================================
   MERIDIAN v2 — SAVE / SYNC CORE  (slice 1)
   - Keeps the 4 existing v1 storage keys so old data survives.
   - Adds an explicit save layer: in-memory state + a Save chip that shows
     "Unsaved changes" the moment anything changes, and commits on demand.
   - Auto-commit is ALSO on (debounced) so nothing is ever lost, but the
     chip gives you manual control + visible confirmation (kills the
     "did my data save?" anxiety that caused v1 data loss).
   ========================================================================= */
const KEYS = {
  core:    'meridian-core',          // schedule + study entries (this app owns)
  overload:'overload-tracker-state', // workout (v1)
  surplus: 'surplus-tracker-state',  // weight gain + tadalafil (v1)
  csgraph: 'csgraph_profile_v2'       // knowledge graph (v1)
};
const hasWS = (typeof window!=='undefined' && window.storage && window.storage.get);

/* ---- Durable storage: three backends, newer-wins ----
   - IndexedDB  : primary local store (survives iOS eviction, large quota)
   - localStorage: synchronous fast copy (survives hard-kill mid-write)
   - window.storage: Claude-account store → shared across mobile + browser
   Every write stamps a version (timestamp) in a companion key in each backend.
   Every read returns the copy with the newest version, so a stale/dropped
   write can never overwrite good data. Writes are explicit + awaited. */

// IndexedDB minimal promise wrapper
const IDB = (function(){
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        const r=indexedDB.open('meridian_db',1);
        r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function get(key){ try{ const db=await open(); return await new Promise((res)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(key); t.onsuccess=()=>res(t.result==null?null:t.result); t.onerror=()=>res(null); }); }catch(e){ return null; } }
  async function set(key,val){ try{ const db=await open(); return await new Promise((res)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }
  return {get,set, ok:(typeof indexedDB!=='undefined')};
})();

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key,v){ try{ localStorage.setItem(key,v); return true; }catch(e){ return false; } }
async function wsGet(key){ if(!hasWS) return null; try{ const r=await window.storage.get(key); return (r&&r.value!=null)?r.value:null; }catch(e){ return null; } }
async function wsSet(key,v){ if(!hasWS) return false; try{ await window.storage.set(key,v); return true; }catch(e){ return false; } }

async function rawGet(key){
  const vk=key+'__v';
  // gather (value, version) from all three backends
  const lv=lsGet(key), lvv=parseInt(lsGet(vk)||'0',10)||0;
  const iv=await IDB.get(key), ivv=parseInt((await IDB.get(vk))||'0',10)||0;
  let wv=null,wvv=0; if(hasWS){ wv=await wsGet(key); wvv=parseInt((await wsGet(vk))||'0',10)||0; }
  const cands=[[lv,lvv],[iv,ivv],[wv,wvv]].filter(c=>c[0]!=null);
  if(!cands.length) return null;
  cands.sort((a,b)=>b[1]-a[1]);           // newest version first
  const best=cands[0];
  // heal the other backends toward the newest copy (so all converge)
  if(best[0]!=null){ lsSet(key,best[0]); lsSet(vk,String(best[1]||Date.now())); IDB.set(key,best[0]); IDB.set(vk,String(best[1]||Date.now())); }
  return best[0];
}
async function rawSet(key,val){
  const vk=key+'__v', now=Date.now();
  lsSet(key,val); lsSet(vk,String(now));          // sync — survives hard kill
  await IDB.set(key,val); await IDB.set(vk,String(now));   // durable local
  if(hasWS){ await wsSet(key,val); await wsSet(vk,String(now)); }  // cross-device
  return true;
}

// ---- CORE (this app's own store): { schedule:{date:[tasks]}, entries:[] } ----
let CORE = { schedule:{}, entries:[] };
let dirty = false;
let saveTimer = null;
// Snapshot of the last known-clean (saved or freshly loaded) state, for Discard.
let cleanState={core:null,overload:null,surplus:null,csgraph:null};
function snapshotClean(){
  try{
    if(typeof coreHydrated!=='undefined'&&coreHydrated) cleanState.core=JSON.stringify(CORE);
    if(typeof wkLoaded!=='undefined'&&wkLoaded)         cleanState.overload=JSON.stringify(WK);
    if(typeof sgLoaded!=='undefined'&&sgLoaded)         cleanState.surplus=JSON.stringify(SG);
    if(typeof kgLoaded!=='undefined'&&kgLoaded)         cleanState.csgraph=JSON.stringify(KG);
  }catch(e){}
}
function discardChanges(){
  try{
    if(cleanState.core)     CORE=JSON.parse(cleanState.core);
    if(cleanState.overload) WK=JSON.parse(cleanState.overload);
    if(cleanState.surplus)  SG=JSON.parse(cleanState.surplus);
    if(cleanState.csgraph)  KG=JSON.parse(cleanState.csgraph);
  }catch(e){ return false; }
  dirty=false;
  if(typeof wkDirty!=='undefined') wkDirty=false;
  if(typeof sgDirty!=='undefined') sgDirty=false;
  if(typeof kgDirtyFlag!=='undefined') kgDirtyFlag=false;
  if(typeof stopRest==='function') stopRest(true);
  paintSaveChip();
  // repaint whichever panes are live
  try{
    if(document.getElementById('pane-today').classList.contains('on')){ renderToday(); renderStudy(); }
    if(document.getElementById('pane-workout').classList.contains('on')) renderWorkout();
    if(document.getElementById('pane-weight').classList.contains('on')) renderWeight();
    if(document.getElementById('pane-knowledge').classList.contains('on')) renderKnowledge();
  }catch(e){}
  return true;
}

/* ================= CLOUD BACKEND (Pantry REST store) =================
   A real cross-device backend: a free hosted JSON store reached over HTTP.
   Setup once: get a Pantry ID at getpantry.cloud, paste it in Data > Cloud.
   Model: cloud is the source of truth. Save -> push. Load -> pull.
   The Pantry ID lives only in localStorage (never synced, never in exports). */
const PANTRY_BASE='https://getpantry.cloud/apiv1/pantry';
const BASKET='meridian';
function cloudId(){ try{ return localStorage.getItem('meridian_pantry_id')||''; }catch(e){ return ''; } }
function setCloudId(v){ try{ localStorage.setItem('meridian_pantry_id', v||''); }catch(e){} }
function cloudEnabled(){ return !!cloudId(); }

function baseRev(){ return parseInt(lsGet('meridian_base_rev')||'0',10)||0; }
function setBaseRev(r){ try{ localStorage.setItem('meridian_base_rev', String(r)); }catch(e){} }

// Push with optimistic concurrency: refuse to overwrite if the cloud has moved
// on since we last pulled. force=true is only used by an explicit user override.
async function cloudPush(force){
  const id=cloudId(); if(!id) return {ok:false,err:'no id'};
  // read current cloud revision first
  let cloudRev=0, cloudAt=0;
  try{ const cur=await cloudPull(); if(cur.ok&&cur.data){ cloudRev=+cur.data.rev||0; cloudAt=+cur.data.syncedAt||0; } }catch(e){}
  if(!force && cloudRev > baseRev()){
    return {ok:false, conflict:true, cloudRev, cloudAt,
            err:'Cloud has newer changes (rev '+cloudRev+' vs your '+baseRev()+'). Pull first, then save again.'};
  }
  const payload={ rev:cloudRev+1, syncedAt:Date.now(),
    core: JSON.stringify(CORE),
    overload: await rawGet(KEYS.overload),
    surplus:  await rawGet(KEYS.surplus),
    csgraph:  await rawGet(KEYS.csgraph)
  };
  try{
    const r=await fetch(PANTRY_BASE+'/'+encodeURIComponent(id)+'/basket/'+BASKET,{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!r.ok) return {ok:false,err:'HTTP '+r.status};
    setBaseRev(payload.rev);
    return {ok:true,at:payload.syncedAt,rev:payload.rev};
  }catch(e){ return {ok:false,err:e.message}; }
}
async function cloudPull(){
  const id=cloudId(); if(!id) return {ok:false,err:'no id'};
  try{
    const r=await fetch(PANTRY_BASE+'/'+encodeURIComponent(id)+'/basket/'+BASKET);
    if(!r.ok) return {ok:false,err:'HTTP '+r.status};
    const d=await r.json();
    return {ok:true,data:d,at:d.syncedAt};
  }catch(e){ return {ok:false,err:e.message}; }
}
// apply a pulled payload into all stores (cloud authoritative), then persist locally
async function cloudApply(d, stamp){
  // Use the CLOUD's own timestamp, never Date.now() — stamping a stale copy as
  // "new" is what let old cloud data permanently overwrite good local data.
  const now=+stamp || +(d&&d.syncedAt) || Date.now();
  // safety snapshot so nothing is ever unrecoverable
  try{ localStorage.setItem('meridian_prev_snapshot', JSON.stringify({
    at:Date.now(), core:lsGet(KEYS.core), overload:lsGet(KEYS.overload),
    surplus:lsGet(KEYS.surplus), csgraph:lsGet(KEYS.csgraph)})); }catch(e){}
  const put=async(key,val)=>{ if(val==null) return; lsSet(key,val); lsSet(key+'__v',String(now)); await IDB.set(key,val); await IDB.set(key+'__v',String(now)); };
  await put(KEYS.core, d.core);
  await put(KEYS.overload, d.overload);
  await put(KEYS.surplus, d.surplus);
  await put(KEYS.csgraph, d.csgraph);
  try{ localStorage.setItem('meridian_local_mtime', String(now));
       localStorage.setItem('meridian_cloud_mtime', String(now)); }catch(e){}
  setBaseRev(+(d&&d.rev)||0);
}

function markDirty(){
  dirty = true;
  paintSaveChip();
  // No aggressive autosave. Explicit Save button is primary; a long safety net + flush-on-hide back it up.
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveAll(true), 20000);
}
function anyDirty(){
  return dirty
    || (typeof wkDirty!=='undefined' && wkDirty)
    || (typeof sgDirty!=='undefined' && sgDirty)
    || (typeof kgDirtyFlag!=='undefined' && kgDirtyFlag);
}
function paintSaveChip(){
  const c=document.getElementById('savechip'), t=document.getElementById('savetxt');
  const d=document.getElementById('discardfab');
  if(d) d.style.display = anyDirty()? 'block':'none';
  if(!c) return;
  if(anyDirty()){ c.className='savefab dirty'; t.textContent='Unsaved \u2014 tap to Save'; }
  else { c.className='savefab'; t.textContent='All changes saved'; }
}
// Explicit, awaited save of EVERY store. This is the button the user presses.
async function saveAll(silent){
  const c=document.getElementById('savechip'), t=document.getElementById('savetxt');
  if(c){ c.className='savefab saving'; if(t) t.textContent='Saving\u2026'; }

  // Each store saves INDEPENDENTLY and is VERIFIED by reading it back.
  // (Previously all four shared one try/catch, so one failure silently
  //  skipped every store after it — which is how workout data was lost.)
  const jobs=[
    {name:'schedule', key:KEYS.core,     ready:()=>coreHydrated,                            dirtyFn:()=>dirty,     clear:()=>{dirty=false;},        data:()=>JSON.stringify(CORE)},
    {name:'workout',  key:KEYS.overload, ready:()=>(typeof wkLoaded!=='undefined'&&wkLoaded), dirtyFn:()=>(typeof wkDirty!=='undefined'&&wkDirty), clear:()=>{wkDirty=false;}, data:()=>JSON.stringify(WK)},
    {name:'meals',    key:KEYS.surplus,  ready:()=>(typeof sgLoaded!=='undefined'&&sgLoaded), dirtyFn:()=>(typeof sgDirty!=='undefined'&&sgDirty), clear:()=>{sgDirty=false;}, data:()=>JSON.stringify(SG)},
    {name:'knowledge',key:KEYS.csgraph,  ready:()=>(typeof kgLoaded!=='undefined'&&kgLoaded), dirtyFn:()=>(typeof kgDirtyFlag!=='undefined'&&kgDirtyFlag), clear:()=>{ kgDirtyFlag=false; }, data:()=>JSON.stringify(KG)}
  ];
  const failed=[], saved=[];
  for(const j of jobs){
    let ready=false; try{ ready=!!j.ready(); }catch(e){ ready=false; }
    if(!ready) continue;
    let isDirty=false; try{ isDirty=!!j.dirtyFn(); }catch(e){ isDirty=false; }
    if(!isDirty) continue;
    try{
      const payload=j.data();
      await rawSet(j.key, payload);
      const back=await rawGet(j.key);           // VERIFY the write actually landed
      if(back===payload){ j.clear(); saved.push(j.name); }
      else { failed.push(j.name+' (verify)'); }
    }catch(e){ failed.push(j.name+' ('+(e&&e.message?e.message:'error')+')'); }
  }
  const ok = failed.length===0;
  paintSaveChip();
  if(!ok && c){ c.className='savefab dirty'; if(t) t.textContent='Save failed: '+failed.join(', '); console.error('Meridian save failures:',failed); }
  if(ok && !silent) flashSaved();
  if(saved.length){ try{ localStorage.setItem('meridian_local_mtime', String(Date.now())); }catch(e){} }
  if(ok) snapshotClean();

  // Cloud push is AWAITED so swiping the app away cannot kill it mid-flight.
  if(ok && cloudEnabled() && saved.length){
    if(t) t.textContent='Syncing\u2026';
    let r={ok:false,err:'unknown'};
    try{ r=await cloudPush(); }catch(e){ r={ok:false,err:e.message}; }
    if(!r.ok){
      if(r.conflict){
        if(t) t.textContent='Saved locally \u00b7 CLOUD CONFLICT \u2014 pull first';
        if(c) c.className='savefab dirty';
        if(!silent) alert('Saved on this device, but NOT to the cloud.\n\n'+r.err+'\n\nAnother device saved changes after your last sync. Open Data \u2192 Pull now to get them, then save again.');
      } else if(t) t.textContent='Saved locally \u00b7 cloud sync failed';
    }
    else { try{ localStorage.setItem('meridian_cloud_mtime', String(r.at||Date.now())); }catch(e){} paintSaveChip(); }
  }
  return ok;
}
function flashSaved(){
  const f=document.getElementById('savedflash');
  if(f){ f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),1200); }
}
document.getElementById('savechip').addEventListener('click',()=>saveAll(false));
document.getElementById('discardfab').addEventListener('click',()=>{
  if(!anyDirty()) return;
  if(!confirm('Discard all unsaved changes and return to the last saved state?')) return;
  if(discardChanges()) flashSaved();
});

async function loadCore(){
  const s = await rawGet(KEYS.core);
  if(s){ try{ CORE = JSON.parse(s); }catch(e){ CORE={schedule:{},entries:[]}; } }
  if(!CORE.schedule) CORE.schedule={};
  if(!CORE.entries)  CORE.entries=[];
  if(!Object.keys(CORE.schedule).length) CORE.schedule = seedSchedule();
  coreHydrated=true; snapshotClean();
}
let coreHydrated=false;

/* ---- helpers ---- */
let _uidSeq=0;
// Date.now()+Math.random() collides: at ~1.78e12 the double mantissa leaves only
// ~4k distinct fractions per millisecond. Counter guarantees in-session uniqueness.
function uid(){ _uidSeq=(_uidSeq+1)%1000000;
  return Date.now().toString(36)+'-'+_uidSeq.toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dstr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toMin(hm){ const p=hm.split(':'); return +p[0]*60 + +p[1]; }
function fromMin(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function h12(hm){ const p=hm.split(':'); let H=+p[0]; const m=p[1]; const ap=H<12?'AM':'PM'; let h=H%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
const CATC={prep:'#378ADD',gym:'#6BBF73',math:'#8A6FD1',physics:'#8A6FD1',course:'#E0A64B',interview:'#D8654F',rest:'#8B95A7'};

function seedSchedule(){
  // minimal starter so Today isn't empty on first run; Study tab (slice 2) owns editing
  const t = dstr();
  return { [t]: [
    {id:uid(),start:'07:00',label:'Protein + structural hour',cat:'prep',done:false,mins:120},
    {id:uid(),start:'09:00',label:'Fluency hour \u2014 timed mediums',cat:'prep',done:false,mins:120},
    {id:uid(),start:'11:00',label:'Gym',cat:'gym',done:false,mins:180},
    {id:uid(),start:'15:00',label:'C++ depth + delta review',cat:'prep',done:false,mins:90},
    {id:uid(),start:'16:30',label:'Math Academy',cat:'math',done:false,mins:30}
  ]};
}

/* ---- read-only peeks into the other 3 stores (for Today cross-links) ---- */
async function peekProteinToday(){
  const s = await rawGet(KEYS.surplus); if(!s) return null;
  try{
    const st = JSON.parse(s); const day = (st.days && st.days[dstr()]) || [];
    if(!Array.isArray(day)) return null;
    const p = day.reduce((a,x)=>a + (+((x&&x.protein)||0)),0);
    return p;
  }catch(e){ return null; }
}
async function peekTadToday(){
  const s = await rawGet(KEYS.surplus); if(!s) return null;
  try{ const st=JSON.parse(s); return (st.tad && st.tad[dstr()])||0; }catch(e){ return null; }
}
async function peekLiftedToday(){
  const s = await rawGet(KEYS.overload); if(!s) return false;
  try{ const st=JSON.parse(s); return !!(st.days && st.days[dstr()]); }catch(e){ return false; }
}

const paneToday = document.getElementById('pane-today');
async function renderToday(){
  const t = dstr();
  const tasks = (CORE.schedule[t]||[]).slice().sort((a,b)=> a.start<b.start?-1:1);
  const now = nowMin();
  let curIdx=-1; tasks.forEach((x,i)=>{ if(toMin(x.start)<=now) curIdx=i; });
  const done = tasks.filter(x=>x.done).length;
  const pct = tasks.length? Math.round(100*done/tasks.length):0;

  const nd = new Date();
  const dateStr = nd.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const timeStr = nd.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'});

  // study-today stats
  const te = (CORE.entries||[]).filter(e=>e.date===t);
  const xp = te.filter(e=>e.stream==='kg'||e.stream==='math').reduce((a,e)=>a+(+e.xp||0),0);
  const probs = te.filter(e=>e.stream==='kg'||e.stream==='leetcode');
  const solved = probs.filter(e=>e.status==='solved').length;

  // knowledge review due
  let kgDue=0; try{ if(!kgLoaded) await kgLoad(); kgDue=dueCount(); }catch(e){}
  const tad = await peekTadToday();
  // cross-links
  const protein = await peekProteinToday();
  const lifted = await peekLiftedToday();

  let h='';
  h += '<div class="panel"><div style="font-size:15px">'+dateStr+'</div>'
     + '<div style="font-family:var(--mono);color:var(--teal);font-size:20px;margin-top:2px">'+timeStr+'</div></div>';

  // at-a-glance chips (cross-links)
  h += '<div class="panel"><p class="panel-t">Today at a glance</p><div class="chiprow">'
     + chip(xp,'XP','var(--fuel)')
     + chip(solved,'Solved','var(--teal)')
     + chip(probs.length,'Attempted','var(--text)')
     + chip(protein==null?'\u2014':(protein+'g'),'Protein','var(--protein)')
     + chip(lifted?'\u2713':'\u2014','Lifted','var(--ok)')
     + chip(tad?(tad+'\u00d79'):'\u2014','Tadalafil','var(--muted)')
     + chip(kgDue,'Review due', kgDue?'var(--protein)':'var(--dim)')
     + '</div></div>';

  // schedule
  h += '<div class="panel"><p class="panel-t">Today \u00b7 '+t+'</p>';
  if(!tasks.length){ h+='<div class="empty">No schedule yet. Add tasks in the Study tab.</div>'; }
  else{
    h += '<div class="bar"><div style="width:'+pct+'%"></div></div>'
       + '<div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:8px">'+done+' / '+tasks.length+' done</div>';
    h += tasks.map((x,i)=>{
      const col=CATC[x.cat]||'#8B95A7'; const isNow=(i===curIdx&&!x.done);
      const ns = i+1<tasks.length? tasks[i+1].start : null;
      const range = h12(x.start) + (ns?(' \u2013 '+h12(ns)):'');
      return '<div class="tdrow'+(x.done?' done':'')+(isNow?' tnow':'')+'">'
        + '<span class="chk" data-tog="'+x.id+'">'+(x.done?'\u2713':'')+'</span>'
        + '<span class="dot" style="background:'+col+'"></span>'
        + '<span class="main"><span class="lab">'+esc(x.label)+(isNow?' <span class="nowtag">NOW</span>':'')+'</span>'
        + '<span class="meta">'+range+' \u00b7 '+(x.cat)+(x.mins?(' \u00b7 '+x.mins+'m'):'')+'</span></span>'
        + '</div>';
    }).join('');
  }
  h += '</div>';

  // workout goals — top-set target per exercise, from the real plan
  let wg='';
  try{
    if(!wkLoaded) await wkLoad();
    h+='<details class="panel" style="margin-bottom:10px"><summary style="cursor:pointer;font-size:13px;color:var(--teal)">Training notes \u00b7 frequency, order, progression</summary>'
   +'<div class="note" style="margin-top:10px;line-height:1.65">'
   +'<b style="color:var(--text)">How often:</b> 4 gym days a week is the target \u2014 upper / lower / upper / lower, e.g. Mon Tue Thu Fri. That hits every muscle <b>twice a week</b>, which beats once at the same total volume. Three days works if life gets busy (the split just rotates), but at three you lose a session per muscle every other week. Cardio can be every day \u2014 it barely costs recovery.<br><br>'
   +'<b style="color:var(--text)">Weekly volume:</b> 10\u201320 hard sets per muscle per week is the productive range. Below 10 is maintenance; above 20 you are usually buying fatigue, not growth.<br><br>'
   +'<b style="color:var(--text)">Order within a session:</b> heaviest compounds first (bench, leg press), isolation after, and <b>grip work absolutely last</b> \u2014 fatigued forearms compromise your lat pulldown. Never open with wrist curls.<br><br>'
   +'<b style="color:var(--text)">Progression:</b> the top set is the one number that matters. Hit '+REP_HI+' reps and the weight goes up by that exercise\u2019s stack increment; otherwise hold and add a rep. Warm-ups and back-offs scale automatically \u2014 do not chase them.<br><br>'
   +'<b style="color:var(--text)">Curls:</b> you now have three bicep movements. Hammer curls hit the brachioradialis the supinated ones miss, so if volume feels high, drop one of the plain curls rather than adding a fourth. Start hammer and wrist work <b>light</b> \u2014 forearms and elbows punish ego loading, and wrist work is high-rep (12\u201320) by design.<br><br>'
   +'<b style="color:var(--text)">Bulking:</b> progression stalls without the calories. Your logged intake has been running well under the 2,700 target on most days \u2014 that is the limiter on these numbers moving, not the programming.'
   +'</div></details>';
  const exs=allExercises().filter(e=>!isCardio(e));
    const rows=exs.map(e=>{ const p=buildPlan(e,t); if(!p||!p.top) return ''; 
      const bump=p.bumped?' <span style="color:var(--teal);font-family:var(--mono);font-size:11px">\u2191</span>':'';
      return '<div class="goalrow"><span style="flex:1">'+esc(e)+'</span><span style="font-family:var(--mono);color:var(--text)">'+p.top.w+' \u00d7 '+p.top.reps+'</span>'+bump+'</div>'; }).filter(Boolean).join('');
    wg = rows || '<div class="empty">No workout history yet \u2014 log a set in the Workout tab.</div>';
  }catch(e){ wg='<div class="empty">Open the Workout tab to load targets.</div>'; }
  h += '<div class="panel"><p class="panel-t">Today\u2019s top-set targets</p>'+wg+'</div>';

  paneToday.innerHTML = h;
  paneToday.querySelectorAll('[data-tog]').forEach(el=>{
    el.onclick=()=>{
      const id=el.getAttribute('data-tog');
      const task=(CORE.schedule[t]||[]).find(x=>x.id===id);
      if(task){ task.done=!task.done; markDirty(); renderToday(); }
    };
  });
}

      await put(KEYS.core,s.core); await put(KEYS.overload,s.overload); await put(KEYS.surplus,s.surplus); await put(KEYS.csgraph,s.csgraph);
      try{ localStorage.setItem('meridian_local_mtime',String(now)); }catch(e){}
      cmsg('\u2713 Restored. Reloading\u2026'); setTimeout(()=>location.reload(),700);
    }; }
  document.getElementById('d-pantry-save').onclick=()=>{
    const v=(document.getElementById('d-pantry').value||'').trim();
    setCloudId(v);
    cmsg(v?'Saved. Cloud sync is ON. Tap "Test connection" to verify.':'Cleared. Cloud sync is OFF.');
  };
  document.getElementById('d-test').onclick=async()=>{
    if(!cloudEnabled()){ cmsg('Add a Pantry ID first.',true); return; }
    cmsg('Testing\u2026');
    const r=await cloudPush();   // push writes the basket (also creates it)
    if(r.ok){ const p=await cloudPull(); cmsg(p.ok?'\u2713 Connection works. Cloud sync is live.':('Push ok but read failed: '+p.err),!p.ok); }
    else cmsg('\u2717 Could not reach cloud: '+r.err+'. The sandbox may block network calls \u2014 use manual backup below.',true);
  };
  document.getElementById('d-push').onclick=async()=>{
    if(!cloudEnabled()){ cmsg('Add a Pantry ID first.',true); return; }
    cmsg('Pushing\u2026'); await saveAll(true); const r=await cloudPush();
    cmsg(r.ok?('\u2713 Pushed at '+new Date(r.at).toLocaleTimeString()+'. Other devices pull on open, or tap Pull.'):'Push failed: '+r.err, !r.ok);
  };
  document.getElementById('d-pull').onclick=async()=>{
    if(!cloudEnabled()){ cmsg('Add a Pantry ID first.',true); return; }
    cmsg('Pulling\u2026'); const r=await cloudPull();
    if(!r.ok){ cmsg('Pull failed: '+r.err,true); return; }
    if(!r.data){ cmsg('Cloud is empty. Push from another device first.',true); return; }
    const unsaved = (typeof dirty!=='undefined'&&dirty) || (typeof wkDirty!=='undefined'&&wkDirty) || (typeof sgDirty!=='undefined'&&sgDirty);
    const lm=parseInt(lsGet('meridian_local_mtime')||'0',10)||0, cm=+r.data.syncedAt||0;
    if(unsaved || lm>cm){
      if(!confirm('WARNING: this device has changes the cloud does not have'+(unsaved?' (including unsaved edits)':'')+'.\n\nPulling REPLACES them with the cloud copy. A snapshot is kept (Data \u2192 Undo last cloud overwrite), but anything unsaved here will be lost.\n\nContinue?')){ cmsg('Pull cancelled.'); return; }
    }
    await cloudApply(r.data, +r.data.syncedAt||Date.now()); cmsg('\u2713 Pulled '+(r.at?('from '+new Date(r.at).toLocaleString()):'')+'. Reloading\u2026');
    setTimeout(()=>location.reload(),700);
  };

  document.getElementById('d-exp').onclick=async()=>{
    // ensure current in-memory CORE is captured even if unsaved
    const bundle = { meridian_v2:1, exportedAt:dstr(), data:{
      core: JSON.stringify(CORE),
      overload: await rawGet(KEYS.overload),
      surplus:  await rawGet(KEYS.surplus),
      csgraph:  await rawGet(KEYS.csgraph)
    }};
    io().value = JSON.stringify(bundle);
    msg('Exported all 4 stores.');
  };
  document.getElementById('d-copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(io().value||''); msg('Copied.'); }
    catch(e){ io().select(); msg('Select+copy manually.',true); }
  };
  document.getElementById('d-single-imp').onclick=async()=>{
    const raw=(document.getElementById('d-single-io').value||'').trim();
    if(!raw){ msg('Paste a backup first.',true); return; }
    let parsed; try{ parsed=JSON.parse(raw); }catch(e){ msg('Invalid JSON: '+e.message,true); return; }
    const which=document.getElementById('d-single-key').value;
    const key=KEYS[which];
    const payload=JSON.stringify(parsed);
    msg('Saving '+(payload.length)+' chars to '+which+'\u2026');
    let ok=false;
    // write to BOTH window.storage (if present) and localStorage, so mobile always persists
    try{ if(hasWS){ const r=await window.storage.set(key,payload); ok=!!r; } }catch(e){ msg('storage.set error: '+e.message,true); }
    try{ localStorage.setItem(key,payload); ok=true; }catch(e){ if(!ok){ msg('localStorage error: '+e.message,true); return; } }
    // verify it landed
    let check=null; try{ check = hasWS ? (await window.storage.get(key)) : null; }catch(e){}
    const lsCheck = (()=>{ try{ return localStorage.getItem(key); }catch(e){ return null; } })();
    if(!ok && !lsCheck){ msg('Import failed \u2014 nothing was written.',true); return; }
    msg('\u2713 Imported '+which+' ('+(lsCheck?lsCheck.length:payload.length)+' chars). Reloading\u2026');
    setTimeout(()=>location.reload(),900);
  };
  document.getElementById('d-imp').onclick=async()=>{
    const raw=io().value.trim(); if(!raw){ msg('Paste a backup first.',true); return; }
    let p; try{ p=JSON.parse(raw); }catch(e){ msg('Invalid JSON.',true); return; }
    if(!p||!p.meridian_v2||!p.data){ msg('Not a Meridian v2 backup.',true); return; }
    const d=p.data; const S=v=> (typeof v==='string'?v:JSON.stringify(v));
    if(d.core!=null){ await rawSet(KEYS.core,S(d.core)); }
    if(d.overload!=null) await rawSet(KEYS.overload,S(d.overload));
    if(d.surplus!=null)  await rawSet(KEYS.surplus,S(d.surplus));
    if(d.csgraph!=null)  await rawSet(KEYS.csgraph,S(d.csgraph));
    msg('Imported. Reloading\u2026'); setTimeout(()=>location.reload(),700);
  };
}

/* ================= STUDY ================= */
const paneStudy = document.getElementById('pane-study');
let selDate = dstr();
const CATS=['prep','gym','math','physics','course','interview','rest'];

function dLabel(ds){ const p=ds.split('-'); const dt=new Date(+p[0],+p[1]-1,+p[2]); const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]; const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]; return (ds===dstr()?'Today \u00b7 ':'')+wd+', '+mo+' '+dt.getDate(); }
function shift(ds,n){ const p=ds.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return dstr(d); }
function dayName(ds){ const p=ds.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]; }
function roundUp5(m){ return Math.ceil(m/5)*5; }
function endMin(x){ return toMin(x.start)+(x.mins||60); }
function parsePom(s){ const m=(s||'').match(/(\d+)\s*\/\s*(\d+)/); return m?[+m[1],+m[2]]:null; }
function subBlocks(start,mins,pom){ const work=pom[0],rest=pom[1]; let cur=toMin(start),left=mins,out=[],g=0;
  while(left>0&&g++<48){ const w=Math.min(work,left); out.push({t0:fromMin(cur),t1:fromMin(cur+w),kind:'work'}); cur+=w; left-=w;
    if(left>0){ out.push({t0:fromMin(cur),t1:fromMin(cur+rest),kind:'rest'}); cur+=rest; } } return out; }
function focusTask(tasks,isToday){
  const undone=tasks.filter(x=>!x.done); if(!undone.length) return null;
  if(!isToday) return undone[0];
  const nm=nowMin();
  const on=undone.filter(x=>toMin(x.start)<=nm&&endMin(x)>nm); if(on.length) return on[0];
  const up=undone.filter(x=>toMin(x.start)>nm).sort((a,b)=>toMin(a.start)-toMin(b.start)); if(up.length) return up[0];
  return undone[undone.length-1];
}
function carryOver(){
  const y=shift(dstr(),-1); const undone=(CORE.schedule[y]||[]).filter(x=>!x.done);
  if(!undone.length){ alert('Nothing unfinished from yesterday.'); return; }
  const today=dstr(); if(!CORE.schedule[today]) CORE.schedule[today]=[];
  let cur=roundUp5(nowMin()); (CORE.schedule[today]||[]).forEach(x=>{ cur=Math.max(cur,endMin(x)); });
  undone.forEach(t=>{ CORE.schedule[today].push({id:uid(),start:fromMin(cur),label:t.label,cat:t.cat,done:false,mins:t.mins||30,pom:t.pom,note:'\u21a9 from '+y+(t.note?(' \u00b7 '+t.note):''),maps:t.maps}); cur+=(t.mins||30); });
  selDate=today; markDirty(); renderStudy();
  alert('Moved '+undone.length+' task'+(undone.length>1?'s':'')+' into today.');
}
function row2(e){
  let lab,pill;
  if(e.stream==='kg'){ lab='<b>'+esc(e.problem||'KG')+'</b> <span style="color:var(--dim)">'+esc(e.topic||'knowledge')+'</span>'; pill='<span class="mchip" style="background:var(--panel2);color:var(--teal)">kg</span>'; }
  else if(e.stream==='leetcode'){ lab='<b>'+esc(e.problem)+'</b> <span style="color:var(--dim)">'+esc(e.pattern||'')+'</span>'; pill='<span class="mchip" style="background:var(--panel2);color:var(--fuel)">'+(e.difficulty||'lc')+'</span>'; }
  else { lab='<b>'+(e.xp||0)+' XP</b> '+esc(e.source||''); pill='<span class="mchip" style="background:var(--panel2);color:var(--protein)">xp</span>'; }
  return '<div class="sentry">'+pill+'<span style="flex:1">'+lab+'</span><span class="rm" data-del="'+e.id+'">\u00d7</span></div>';
}

function renderStudy(){
  const isToday=(selDate===dstr());
  const tasks=(CORE.schedule[selDate]||[]).slice().sort((a,b)=> a.start<b.start?-1:1);
  const done=tasks.filter(x=>x.done).length;
  const focus=focusTask(tasks,isToday);
  const nd=new Date();
  const dateStr=nd.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  let h='';

    const col=CATC[x.cat]||'#8B95A7'; const isF=focus&&x.id===focus.id;
    return '<div class="sched-edit'+(isF?' tnow':'')+'"'+(x.done?' style="opacity:.5"':'')+'>'

  h+='<div class="mrow" style="margin-top:6px"><input id="a-note" placeholder="detail / course \u2192 WGU mapping (optional)" style="flex:1;min-width:180px"></div>';

  // current focus
  h+='<div class="panel"><p class="panel-t">Current focus</p>';
  if(!focus) h+='<div class="empty">'+(tasks.length?'All done for the day \u2014 nice.':'Nothing scheduled.')+'</div>';
  else{
    const col=CATC[focus.cat]||'#8B95A7'; const range=h12(focus.start)+(focus.mins?(' \u2013 '+h12(fromMin(toMin(focus.start)+focus.mins))):'');
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="dot" style="background:'+col+'"></span><span style="font-size:17px">'+esc(focus.label)+'</span></div>';
    h+='<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">'+range+' \u00b7 '+focus.cat+(focus.mins?(' \u00b7 '+focus.mins+'m'):'')+'</div>';
    if(focus.pom&&focus.mins){ const sb=subBlocks(focus.start,focus.mins,focus.pom); h+='<div class="subblocks" style="margin-left:0">'+sb.map(b=>'<span class="sb '+b.kind+'">'+h12(b.t0)+'\u2013'+h12(b.t1)+(b.kind==='rest'?' rest':'')+'</span>').join('')+'</div>'; }
    if(focus.maps) h+='<div class="mapline" style="margin-left:0">\u2192 WGU '+esc(focus.maps)+'</div>';

  }
  h+='</div>';

  // log math/physics XP
  h+='<div class="panel mpanel"><p class="panel-t">Log math / physics XP</p><div class="mrow"><div class="seg" id="m-src"><button data-s="Math Academy" class="on">Math Academy</button><button data-s="PhysicsGraph">PhysicsGraph</button></div><input id="m-xp" type="number" placeholder="XP" style="width:90px"><button class="mbtn primary" id="m-add">Add XP</button></div></div>';

  h+='<div class="panel"><p class="panel-t">Work logged today'+(wlxp?(' \u00b7 '+wlxp+' XP'):'')+'</p>'+(wl.length?wl.slice().reverse().map(row2).join(''):'<div class="empty">No work logged yet. Knowledge problems show here once scored.</div>')+'</div>';

  paneStudy.innerHTML=h;

function segv(id,a){ const el=document.getElementById(id); const on=el&&el.querySelector('button.on'); return on?on.getAttribute('data-'+a):''; }

  paneStudy.querySelectorAll('[data-ed]').forEach(el=>{ el.onclick=()=>{ const id=el.getAttribute('data-ed'); const t=(CORE.schedule[selDate]||[]).find(x=>x.id===id); if(!t) return;

  const df=paneStudy.querySelector('[data-donefocus]'); if(df) df.onclick=()=>{ const id=df.getAttribute('data-donefocus'); const t=(CORE.schedule[selDate]||[]).find(x=>x.id===id); if(t){ t.done=true; markDirty(); renderStudy(); } };
  const seg=g('m-src'); if(seg) seg.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; });
  g('m-add').onclick=()=>{ const x=+g('m-xp').value; if(!x) return; CORE.entries.push({id:uid(),date:dstr(),stream:'math',source:segv('m-src','s'),xp:x}); markDirty(); renderStudy(); };
}

  restFor=ex+'|'+type; restStart=Date.now(); restTarget=restSecs(ex,type);
  if(restTimer) clearInterval(restTimer);
  restTimer=setInterval(paintRest,250); paintRest();
}
function stopRest(silent){ if(restTimer) clearInterval(restTimer); restTimer=null; restFor='';
  const bar=document.getElementById('restbar'); if(bar) bar.style.display='none';
  if(!silent) renderWorkout(true); }
// Kill the rest clock if it belongs to an exercise that just got marked done.
function dismissRestFor(ex){ if(restFor && restFor.split('|')[0]===ex) stopRest(true); }
function paintRest(){
  const el=document.getElementById('restbar');
  if(!el){ if(restTimer){ clearInterval(restTimer); restTimer=null; } return; }
  const el2=document.getElementById('resttxt'); const el3=document.getElementById('restfill');
  const s=Math.floor((Date.now()-restStart)/1000);
  const over=s>=restTarget;
  el.style.display='flex';
  if(el2) el2.textContent=(over?'\u2713 Rested ':'Rest ')+fmtClock(s)+' / '+fmtClock(restTarget)+' \u00b7 '+restFor.split('|')[0];
  if(el3){ el3.style.width=Math.min(100,Math.round(100*s/restTarget))+'%'; el3.style.background=over?'var(--ok)':'var(--fuel)'; }
}   // 'all' | 'lower' | 'upper'
const LOWER_MUSCLES=['quads','hamstrings','glutes','calves','hips','cardio'];
const UPPER_MUSCLES=['chest','back','biceps','triceps','shoulders','forearms'];
function exSplit(ex){ const m=(exMeta(ex).muscle||'').toLowerCase();
  if(m==='cardio'||isCardio(ex)) return 'both';        // cardio every day
  if(LOWER_MUSCLES.includes(m)) return 'lower';
  if(UPPER_MUSCLES.includes(m)) return 'upper';
  return 'other'; }
// Which split is due today: alternate from the most recent session that had lifts.
function suggestedSplit(forDate){
  const target=forDate||wkDate||dstr();
  const tally=day=>{ const sets=(WK.days[day]||[]).filter(x=>x.type!=='cardio');
    let lo=0,up=0; sets.forEach(x=>{ const sp=exSplit(x.ex); if(sp==='lower')lo++; else if(sp==='upper')up++; });
    return (lo===0&&up===0)?null:(lo>=up?'lower':'upper'); };
  // If the viewed date already has lifting logged, show THAT split.
  const own=tally(target);
  if(own) return {due:own, last:own, lastDate:target, logged:true};
  // Otherwise alternate from the most recent session BEFORE this date.
  const ds=Object.keys(WK.days).sort().filter(d=>d<target);
  for(let i=ds.length-1;i>=0;i--){
    const t=tally(ds[i]);
    if(t) return {due:(t==='lower'?'upper':'lower'), last:t, lastDate:ds[i], logged:false};
  }
  return {due:'upper', last:null, lastDate:null, logged:false};
}
let wkDeload={};   // session-only "feel weak / missed days" recalibration per exercise

// derive the TYPICAL set template (counts + ratios) from history, so an
// incomplete last session never drops warm-ups or back-offs.
function template(ex){
  const sess=exSessions(ex).map(d=>({date:d,sets:(WK.days[d]||[]).filter(s=>s.ex===ex)})).filter(s=>topOf(s.sets)).slice(-6);
  if(!sess.length) return null;
  const wc={},bc={};
  sess.forEach(s=>{ const w=s.sets.filter(x=>x.type==='warm').length,b=s.sets.filter(x=>x.type==='back').length; wc[w]=(wc[w]||0)+1; bc[b]=(bc[b]||0)+1; });
  const mode=o=>{ let k=0,c=-1; Object.keys(o).forEach(x=>{ if(o[x]>c||(o[x]===c&&+x>+k)){c=o[x];k=+x;} }); return k; };
  const ratioAt=(type,i)=>{ let sum=0,n=0,reps=null; sess.forEach(s=>{ const top=topOf(s.sets),arr=s.sets.filter(x=>x.type===type); if(arr[i]&&top){ sum+=(+arr[i].weight)/(+top.weight||1); n++; reps=+arr[i].reps; } }); return n?{r:sum/n,reps}:null; };
  const nW=mode(wc),nB=mode(bc),warms=[],backs=[];
  for(let i=0;i<nW;i++){ const x=ratioAt('warm',i); if(x) warms.push(x); }
  for(let i=0;i<nB;i++){ const x=ratioAt('back',i); if(x) backs.push(x); }
  return {warms,backs};
}
function buildPlan(ex,today){
  const last=lastSession(ex,today); if(!last) return null;
  const top=topOf(last.sets); if(!top) return {cardio:true};
  const tw=+top.weight||1, tr=+top.reps||0, incr=inferIncr(ex); const STEP=incr;
  let bumped = tr>=REP_HI;
  let newTop = bumped ? roundTo(tw+incr,STEP) : tw;
  let topReps = bumped ? 6 : tr;
  if(wkDeload[ex]){ newTop=roundTo(newTop*0.9,STEP); topReps=Math.max(5,Math.min(topReps,REP_HI-2)); bumped=false; } // rebuild session
  const tmpl=template(ex);
  const warms=(tmpl?tmpl.warms:[]).map(w=>({w:roundTo(w.r*newTop,STEP),reps:w.reps}));
  const backs=(tmpl?tmpl.backs:[]).map(b=>({w:roundTo(b.r*newTop,STEP),reps:b.reps}));
  return {warms,top:{w:newTop,reps:topReps},backs,bumped,deload:!!wkDeload[ex],incr,lastTopW:tw,lastTopReps:tr,lastDate:last.date};
}

function logSet(ex,type,w,reps){
  if(!ex||!w||!reps) return;
  const td=wkDate||dstr(); if(!WK.days[td]) WK.days[td]=[];
  const m=exMeta(ex);
  WK.days[td].push({id:uid(), ex, muscle:m.muscle, group:m.group, type, weight:w, reps});
  wkMarkDirty();
  autoCompleteChecks(ex);
  patchLift(ex);          // update ONLY this card — nothing on the page moves
}
// When every prescribed set for an exercise is logged, tick it done automatically.
// When every exercise on today's split is done, mark the session complete and SAVE.
function plannedSetCount(ex){
  if(isCardio(ex)) return 1;
  const p=buildPlan(ex, wkDate||dstr());
  if(!p||p.cardio) return 1;
  return (p.warms?p.warms.length:0) + 1 + (p.backs?p.backs.length:0);
}
function autoCompleteChecks(ex){
  const td=wkDate||dstr();
  const logged=(WK.days[td]||[]).filter(s=>s.ex===ex).length;
  if(!WK.done) WK.done={}; if(!WK.done[td]) WK.done[td]=[];
  if(logged>=plannedSetCount(ex) && WK.done[td].indexOf(ex)<0){
    WK.done[td].push(ex); wkMarkDirty(); dismissRestFor(ex);
    const el=document.querySelector('[data-exdone="'+ex.replace(/"/g,'')+'"]');
    if(el){ el.textContent='\u2713'; const card=document.getElementById('lift-'+cssId(ex)); if(card) card.classList.add('exdone'); }
  }
  // all exercises on this split complete -> auto-complete the session and save
  const exs=allExercises().filter(e=> wkSplit==='all' || exSplit(e)===wkSplit || exSplit(e)==='both');
  const allDone = exs.length>0 && exs.every(e=>(WK.done[td]||[]).indexOf(e)>=0);
  if(allDone && !(WK.sessionDone&&WK.sessionDone[td])){
    if(!WK.sessionDone) WK.sessionDone={};
    WK.sessionDone[td]=true; wkMarkDirty(); stopRest(true);
    renderWorkout(true);
    saveAll(false);                        // auto-save on session completion
  }
  updateSessionCounter();
}
// Patch a single exercise card in place: logged pills + current-set marker + session counter.
function patchLift(ex){
  const id=cssId(ex), td=wkDate||dstr();
  const todayLog=(WK.days[td]||[]).filter(s=>s.ex===ex);
  const box=document.getElementById('logged-'+id);
  if(box){
    box.innerHTML=todayLog.map(s=>'<span class="setpill" data-del="'+td+'|'+s.id+'">'+(s.type&&s.type!=='cardio'?s.type[0].toUpperCase()+':':'')+s.weight+'\u00d7'+s.reps+' \u00d7</span>').join('');
    box.querySelectorAll('[data-del]').forEach(el=>{ el.onclick=()=>{ const [d,sid]=el.getAttribute('data-del').split('|');
      WK.days[d]=(WK.days[d]||[]).filter(s=>String(s.id)!==sid); wkMarkDirty(); patchLift(ex); }; });
  }
  // advance the ▶ current-set marker inside this card only
  const card=document.getElementById('lift-'+id);
  if(card){
    const rows=[...card.querySelectorAll('.setrow')];
    rows.forEach((r,i)=>{ r.classList.toggle('cur', i===todayLog.length);
      const lab=r.querySelector('span'); if(lab){ const t=lab.textContent.replace(/^\u25b6\s*/,''); lab.textContent=(i===todayLog.length?'\u25b6 ':'')+t;
        lab.style.color=(i===todayLog.length)?'var(--teal)':'var(--dim)'; } });
  }
  updateSessionCounter();
}
function updateSessionCounter(){
  const el=document.getElementById('sess-count'); if(!el) return;
  const exs=allExercises().filter(e=> wkSplit==='all' || exSplit(e)===wkSplit || exSplit(e)==='both');
  const done=exs.filter(e=>exDone(e)).length;
  el.textContent = sessionDone()? '\u2713 Session complete' : (done+' / '+exs.length+' done');
  const bar=document.getElementById('sess-bar'); if(bar) bar.style.width=(exs.length?Math.round(100*done/exs.length):0)+'%';
}
function wireWorkout(){
  const g=id=>document.getElementById(id);
  g('bw-add').onclick=()=>{ const v=+g('bw-in').value; if(!v) return; WK.bw[wkDate||dstr()]=v; if(!WK.settings.bwCurrent) WK.settings.bwCurrent=v; wkMarkDirty(); renderWorkout(true); };
  paneWorkout.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{ wkSplit=b.getAttribute('data-split'); wkSplitTouched=true; renderWorkout(); });
  { const p=g('wk-prev'); if(p) p.onclick=()=>{ wkDate=shift(wkDate||dstr(),-1); wkSplitTouched=false; renderWorkout(); }; }
  { const n=g('wk-next'); if(n) n.onclick=()=>{ wkDate=shift(wkDate||dstr(),1); wkSplitTouched=false; renderWorkout(); }; }
  { const t=g('wk-today'); if(t) t.onclick=()=>{ wkDate=dstr(); wkSplitTouched=false; renderWorkout(); }; }
  { const b=g('wk-sessdone'); if(b) b.onclick=()=>toggleSessionDone(); }
  paneWorkout.querySelectorAll('[data-incr]').forEach(b=>b.onclick=()=>{
    const ex=b.getAttribute('data-incr');
    const cur=inferIncr(ex);
    const v=prompt('Smallest weight step for '+ex+' at your gym (lb).\n\nPlate-loaded: 5 or 10. Selectorized stack: often 10, 12.5, 15 or 20.',cur);
    if(v===null||v==='') return;
    if(!WK.incr) WK.incr={}; WK.incr[ex]=Math.max(1,+v||5); wkMarkDirty(); renderWorkout(true);
  });
  paneWorkout.querySelectorAll('[data-exdone]').forEach(el=>el.onclick=()=>toggleExDone(el.getAttribute('data-exdone')));
  paneWorkout.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{ const [ex,type]=b.getAttribute('data-rest').split('|'); startRest(ex,type); });
  { const rs=document.getElementById('rest-stop'); if(rs) rs.onclick=()=>stopRest(true); }
  if(restTimer) paintRest();
  paneWorkout.querySelectorAll('[data-deload]').forEach(b=>b.onclick=()=>{ const ex=b.getAttribute('data-deload'); wkDeload[ex]=!wkDeload[ex]; renderWorkout(true); });
  paneWorkout.querySelectorAll('[data-log]').forEach(btn=>{ btn.onclick=()=>{ const [ex,type,wid,rid]=btn.getAttribute('data-log').split('|'); logSet(ex,type,+g(wid).value,+g(rid).value); startRest(ex,type); }; });
  paneWorkout.querySelectorAll('[data-del]').forEach(el=>{ el.onclick=()=>{ const [d,id]=el.getAttribute('data-del').split('|'); WK.days[d]=(WK.days[d]||[]).filter(s=>String(s.id)!==id); wkMarkDirty(); renderWorkout(true); }; });
  const cl=g('c-log'); if(cl) cl.onclick=()=>{ logSet(g('c-ex').value.trim(), g('c-type').value, +g('c-w').value, +g('c-r').value); };
}

let KG_ITEMS = {};        // loaded from questions/*.json (content lives in the repo, not in this file)
let KG_MANIFEST = null;

// Fetch the question bank. Content is separate from user state by design:
// questions = static repo files (versioned, cached by the service worker);
// progress/mastery/SRS = Pantry + local storage.
async function loadQuestionBank(){
  try{
    const r = await fetch('questions/index.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    KG_MANIFEST = await r.json();
    const topics = Object.keys(KG_MANIFEST.topics||{});
    await Promise.all(topics.map(async t=>{
      try{
        const rr = await fetch(KG_MANIFEST.topics[t].file, {cache:'no-cache'});
        if(rr.ok) KG_ITEMS[t] = await rr.json();
      }catch(e){ }
    }));
    try{ localStorage.setItem('kg_bank_cache', JSON.stringify(KG_ITEMS)); }catch(e){}
    return true;
  }catch(e){
    // offline / file:// fallback — use last good cache
    try{ const c=localStorage.getItem('kg_bank_cache'); if(c){ KG_ITEMS=JSON.parse(c); return true; } }catch(e2){}
    return false;
  }
}

/* ---- spaced repetition (SM-2 style, driven by the 1..5 self-rating) ---- */
function addDaysISO(n){ return shift(dstr(), n); }
function allKGItems(){ const out=[]; Object.keys(KG_ITEMS).forEach(tp=>{ (KG_ITEMS[tp]||[]).forEach(it=>out.push(Object.assign({topic:tp},it))); }); return out; }
function srsOf(id){ return (KG.srs&&KG.srs[id])||null; }
function schedule(id, rating){
  if(!KG.srs) KG.srs={};
  let s = KG.srs[id] || {interval:0, ease:2.5, reps:0};
  if(rating<=1){ s.reps=0; s.interval=1; }                 // lapse: retest tomorrow
  else {
    if(s.reps===0) s.interval=1;
    else if(s.reps===1) s.interval=3;
    else s.interval=Math.round(s.interval*s.ease);
    s.reps+=1;
    s.ease = Math.max(1.3, s.ease + (0.1 - (5-rating)*(0.08+(5-rating)*0.02)));
  }
  s.due = addDaysISO(s.interval);
  s.last = dstr();
  KG.srs[id]=s;
  return s;
}
function dueItems(){ return allKGItems().filter(it=>{ const s=srsOf(it.id); return s && s.due<=dstr(); }); }
function dueCount(){ return dueItems().length; }

function bookRef(bk,ref){ const b=KG_BOOKS[bk]; if(!b) return esc(ref||''); return '<a href="'+b.u+'" target="_blank" rel="noopener">'+esc(b.t.split(' \u2014 ')[0])+'</a> \u00b7 '+esc(ref); }
function masterColor(m){ return ['','#D8654F','#E0A64B','#E0A64B','#6BBF73','#4FB0A5'][m]||'#5C6678'; }
function masterLabel(m){ return ['','shaky','learning','learning','solid','mastered'][m]||'new'; }

// Lead sentence bolded, rest as body — makes reveals scannable instead of a wall of text.
function fmtReveal(txt){
  if(!txt) return '';
  const m=String(txt).match(/^(.*?[.!?])(\s+)([\s\S]*)$/);
  if(!m) return '<b>'+esc(txt)+'</b>';
  return '<b style="color:var(--text)">'+esc(m[1])+'</b><div style="margin-top:7px">'+esc(m[3])+'</div>';
}
function renderKnowledge(){
  if(!kgLoaded){ paneKnow.innerHTML='<div class="empty">Loading\u2026</div>'; kgLoad().then(renderKnowledge); return; }
  const items = kgTopic==='__review__' ? dueItems() : kgTopic==='__target__' ? allTargetItems() : (KG_ITEMS[kgTopic]||[]);

  let h='<div class="ktabs">'+KG_TOPICS.map(tp=>{
    const arr=(KG_ITEMS[tp.id]||[]); const n=arr.length;
    const done=arr.filter(it=>(KG.mastery[it.id]||0)>=4).length;
    const pct=n?Math.round(100*done/n):0;

     +'<div class="note">Interleaved recall across all topics \u2014 the highest-value thing you can do today.</div></div>';

    h+='<div class="mrow" style="margin-top:10px;gap:8px"><button class="mbtn'+(kgGym?' primary':'')+'" id="kg-gym">\ud83c\udfa7 '+(kgGym?'\u2190 Back to questions':'Gym session')+'</button>'
      +'<span class="note" style="align-self:center">'+(kgGym?'Videos + readings for the gym':'Recall practice')+'</span></div>';

    const gm=KG_GYM[kgTopic];

      + vids.filter(x=>x[0]!=='practice').map((x,i)=>{const v=x[1];const k=kgTopic+'|c|'+i;const done=!!KG.gymDone[k];
          return '<div class="goalrow"><span class="chk" data-gymdone="'+k+'" style="width:20px;height:20px">'+(done?'\u2713':'')+'</span><span style="flex:1'+(done?';opacity:.5;text-decoration:line-through':'')+'">'+esc(v[0])+'</span><a href="'+v[1]+'" target="_blank" rel="noopener" style="color:var(--teal)">open \u2197</a></div>';}).join('')
      + '</div>'
      + ((gm.practice&&gm.practice.length)?('<div class="panel"><p class="panel-t">Apply \u2014 worked problems &amp; implementation</p>'
        + gm.practice.map((v,i)=>{const k=kgTopic+'|p|'+i;const done=!!KG.gymDone[k];
          return '<div class="goalrow"><span class="chk" data-gymdone="'+k+'" style="width:20px;height:20px">'+(done?'\u2713':'')+'</span><span style="flex:1'+(done?';opacity:.5;text-decoration:line-through':'')+'">'+esc(v[0])+'</span><a href="'+v[1]+'" target="_blank" rel="noopener" style="color:var(--teal)">open \u2197</a></div>';}).join('')
        + '</div>'):'');
    h+='<div class="panel"><p class="panel-t">Read \u2014 sections for this topic</p>'
      + gm.reading.map((r,i)=>{const b=KG_BOOKS[r[0]];const k=kgTopic+'|r|'+i;const done=!!KG.gymDone[k];return '<div class="goalrow"><span class="chk" data-gymdone="'+k+'" style="width:20px;height:20px">'+(done?'\u2713':'')+'</span><span style="flex:1'+(done?';opacity:.5;text-decoration:line-through':'')+'">'+esc(r[1])+'</span>'+(b?'<a href="'+b.u+'" target="_blank" rel="noopener" style="color:var(--teal)">'+esc(b.t.split(' \u2014 ')[0])+' \u2197</a>':'')+'</div>';}).join('')
      + '</div>';
    paneKnow.innerHTML=h; wireKnowledge(); return;

  if(topic && topic.books.length){ h+='<div class="klink"><b>Sources for '+esc(topic.name)+':</b> '+topic.books.map(bk=>{const b=KG_BOOKS[bk];return '<a href="'+b.u+'" target="_blank" rel="noopener">'+esc(b.t)+'</a>';}).join(' \u00b7 ')+'</div>'; }

  if(!items.length){
    h+='<div class="stub">This topic is scaffolded \u2014 questions land here next. Tap \u201cGym session\u201d above for videos and readings while this fills in.</div>';

  h+='<div class="panel" style="margin-top:10px"><p class="panel-t">Studying for</p><div class="timebar" style="flex-wrap:wrap">'
