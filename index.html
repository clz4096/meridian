<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meridian">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Meridian</title>
<style>
:root{
  /* dark elevation: higher surface = lighter (Material/dark-mode canon) */
  --bg:#0E1116; --surface-1:#171C24; --surface-2:#1E242E; --surface-3:#272E3A;
  --panel:var(--surface-1); --panel2:var(--surface-2);
  /* borders as hairlines; elevation carries most of the separation */
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#E7EBF2; --muted:#9AA4B4; --dim:#727D8E; --track:#232A33;
  --teal:#4FB0A5; --tealSoft:#10241d; --fuel:#E0A64B; --ok:#3BB98C; --deficit:#D8654F;
  --protein:#A78BEA; --interview:#D8654F;
  /* 8pt spacing scale */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px;
  /* radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* type scale (sans for UI, mono for numbers) */
  --fs-micro:11px; --fs-caption:12px; --fs-body:14px; --fs-h3:15px; --fs-h2:19px; --fs-h1:26px; --fs-hero:40px;
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.22s;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
.appwrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
.brandrow{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px;position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:20}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em}
.brand b{color:var(--teal)}
/* save status chip */
.savechip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.lift.exdone{opacity:.55}
.lift.exdone .lift-name{text-decoration:line-through}
.discardfab{min-height:44px;position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:24px;padding:12px 16px;font-family:var(--mono);font-size:12px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
.savefab{min-height:44px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;border:none;border-radius:24px;padding:12px 22px;cursor:pointer;user-select:none;background:var(--panel2,#1a1c22);color:var(--muted);box-shadow:0 6px 20px rgba(0,0,0,.45);transition:background .15s,color .15s}
.savefab .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savefab.dirty{background:var(--fuel);color:#0e0f13;font-weight:600}
.savefab.dirty .dot{background:#0e0f13}
.savefab.saving{opacity:.7}
.appwrap{padding-bottom:150px}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savechip.dirty{cursor:pointer;border-color:var(--fuel);color:var(--fuel)}
.savechip.dirty .dot{background:var(--fuel)}
.savechip.saving{color:var(--muted)}
/* tab bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(0,0,0,.35)}
.navbar button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--dim);cursor:pointer;padding:8px 2px;font-family:inherit}
.navbar button .ni{font-size:17px;line-height:1;display:block;padding:3px 14px;border-radius:14px;transition:background .15s,color .15s}
.navbar button .nl{font-size:12px;letter-spacing:.02em}
.navbar button.on{color:var(--teal)}
.navbar button.on .ni{background:var(--tealSoft,rgba(90,200,140,.16));color:var(--teal)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.tabbar button.on{background:var(--panel2);color:var(--text);border-color:var(--teal)}
.tabpane{display:none}
.tabpane.on{display:block}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel-t{font-family:var(--sans);font-size:var(--fs-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 var(--sp3)}
.empty{color:var(--dim);font-size:var(--fs-body)}
/* progress charts */
.prog{margin-top:var(--sp5)}
.prog-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);margin-bottom:var(--sp3)}
.prog-h .panel-t{margin:0}
.prog-hl{display:flex;align-items:baseline;gap:var(--sp2);min-width:0}
.prog-hl .note{font-size:var(--fs-caption);white-space:nowrap;color:var(--muted)}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg button{font-family:var(--sans);font-size:var(--fs-caption);font-weight:500;line-height:1;border:0;background:transparent;color:var(--dim);padding:7px 9px;border-radius:6px;cursor:pointer;min-width:30px;transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.seg-row{display:flex;gap:var(--sp2)}
/* hero stat */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp4);margin:var(--sp3) 0 var(--sp2)}
.hero-k{font-family:var(--sans);font-size:var(--fs-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--sp1)}
.hero-v{font-family:var(--mono);font-size:var(--fs-hero);font-weight:600;line-height:1;letter-spacing:-.02em}
.hero-u{font-size:var(--fs-h2);color:var(--muted);font-weight:500}
.hero-d{font-family:var(--mono);font-size:var(--fs-body);font-weight:600;color:var(--dim)}
.hero-d.up{color:var(--ok)} .hero-d.down{color:var(--deficit)}
.chart{margin:var(--sp2) 0;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp3) var(--sp4)}
.chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp2);margin-bottom:var(--sp1)}
.chart-t{font-family:var(--sans);font-size:var(--fs-body);font-weight:500;color:var(--muted)}
.chart-v{font-family:var(--mono);font-size:var(--fs-h2);font-weight:600;letter-spacing:-.01em}
.chart svg{width:100%;height:auto;display:block;margin-top:var(--sp1)}
.chart-empty{font-family:var(--sans);font-size:var(--fs-caption);color:var(--dim);padding:var(--sp5) 0;text-align:center}
.prog-lift{display:flex;gap:var(--sp2);overflow-x:auto;margin:var(--sp3) 0 var(--sp1);padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.prog-lift::-webkit-scrollbar{display:none}
.prog-lift button{font-family:var(--sans);font-size:var(--fs-caption);font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface-1);color:var(--muted);padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;min-height:32px;transition:all var(--dur) var(--ease)}
.prog-lift button.on{border-color:var(--fuel);color:var(--fuel);background:rgba(224,166,75,.08)}
/* graphs-first navigation: Progress screen CTA + Detail screen back */
.cta-log{display:flex;align-items:center;justify-content:space-between;gap:var(--sp2);width:100%;margin-top:var(--sp5);font-family:var(--sans);font-size:var(--fs-h3);font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp4);cursor:pointer;min-height:56px;transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.cta-log:hover{background:var(--surface-3)}
.cta-log:active{transform:scale(.99)}
.cta-arrow{color:var(--teal);font-size:var(--fs-h2);line-height:1}
.backbtn{display:inline-flex;align-items:center;gap:var(--sp2);font-family:var(--sans);font-size:var(--fs-body);font-weight:600;color:var(--muted);background:transparent;border:0;padding:var(--sp2) 0;margin:var(--sp1) 0 var(--sp3);cursor:pointer;min-height:40px;transition:color var(--dur) var(--ease)}
.backbtn:hover{color:var(--text)}
/* entrance motion (plays on tab switch; not on in-tab repaints) */
.tabpane.on{animation:paneIn .28s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.placeholder{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;color:var(--dim);text-align:center;margin-top:14px;font-size:14px}
/* buttons/inputs */
.mbtn{min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font-size:13.5px;font-family:var(--sans)}
.mbtn:hover{border-color:var(--dim)}
.mbtn.primary{background:var(--teal);color:#04211d;border:none;font-weight:600}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mpanel input,.mpanel select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;border-radius:8px;padding:8px 10px;outline:none}
.mpanel input:focus,textarea:focus{border-color:var(--teal)}
/* today stat row */
.statgrid{display:flex;gap:22px;flex-wrap:wrap}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500}
.stat .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
/* schedule rows */
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px;margin:3px 0;font-size:14px;border:1px solid transparent}
.tdrow.tnow{background:var(--panel2);border-color:var(--teal)}
.tdrow.done{opacity:.5}.tdrow.done .lab{text-decoration:line-through}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ok);font-weight:700;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;gap:2px}
.lab{}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
.nowtag{font-size:12px;background:var(--teal);color:#04211d;padding:1px 6px;border-radius:8px;margin-left:4px}
.bar{height:8px;background:var(--track);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar>div{height:100%;background:var(--ok);border-radius:6px}
.goalrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.goalrow:last-child{border-bottom:none}
.chiprow{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:96px}
.chip .cv{font-family:var(--mono);font-size:17px}
.chip .ck{font-size:12px;color:var(--dim);text-transform:uppercase}
.savedflash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#04211d;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.savedflash.show{opacity:1}
.note{font-size:12px;color:var(--muted)}
.dictxt{width:100%;min-height:150px;font-family:var(--mono);font-size:12px}
/* study */
.slabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.sched-edit{display:flex;align-items:center;gap:8px;padding:8px 4px;border-radius:8px;margin:2px 0;font-size:13.5px;border:1px solid transparent}
.sched-edit.tnow{background:var(--panel2);border-color:var(--teal)}
.sched-edit .ed,.sched-edit .rm{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;font-size:12px;font-family:var(--mono)}
.sched-edit .ed:hover{color:var(--text)}.sched-edit .rm:hover{color:var(--deficit)}
.subblocks{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px 30px}
.sb{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.sb.work{color:var(--teal);border-color:var(--tealSoft);background:var(--tealSoft)}
.sb.rest{color:var(--dim)}
.mapline{font-family:var(--mono);font-size:12px;color:var(--fuel);margin:2px 0 0 30px}
.noteline{font-size:12px;color:var(--muted);margin:2px 0 0 30px}
.sentry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sentry:last-child{border-bottom:none}
.sentry .rm{margin-left:auto;color:var(--dim);cursor:pointer;padding:0 5px}
.sentry .rm:hover{color:var(--deficit)}
.mchip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:12px;font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);color:var(--muted);padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text)}
/* workout */
.lift{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp3) var(--sp4);margin-top:var(--sp3)}
.lift-h{display:flex;align-items:center;gap:var(--sp3);cursor:pointer;min-height:36px;user-select:none}
.lift-name{font-size:var(--fs-h3);font-weight:600;flex:1;min-width:0}
.lift-sum{font-family:var(--mono);font-size:var(--fs-caption);color:var(--dim);white-space:nowrap}
.lift-chev{color:var(--dim);font-size:var(--fs-body);width:14px;text-align:center;flex:0 0 auto}
.cue{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:12px;white-space:nowrap}
.cue.bump{background:var(--tealSoft);color:var(--teal)}
.cue.hold{background:var(--panel2);color:var(--muted)}
.cue.add{background:#2a2010;color:var(--fuel)}
.cue.deload{background:#3a1a1a;color:var(--deficit)}
.lift-target{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:3px}
.setrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.setrow input{width:66px;text-align:center}
.setrow.done{opacity:.85;padding:6px 0}
.setrow.cur{background:var(--tealSoft);border-radius:8px;padding:4px 6px;margin-left:-6px}
.lastline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:6px}
.logged{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.setpill{min-height:44px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
/* knowledge */
.ktabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.ktabs::-webkit-scrollbar{display:none}

.tprog{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--teal)}
.ktab{min-height:44px;flex:1 1 auto;min-width:calc(33.333% - 6px);background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 10px;font-size:12px;cursor:pointer;white-space:nowrap;text-align:center}
@media(max-width:420px){.ktab{min-width:calc(50% - 6px)}}
.ktab.on{background:var(--panel2);color:var(--text);border-color:var(--protein)}
.ktab .cnt{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:5px}
.timebar{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 10px}

.rate button{min-height:44px;min-width:44px}
.timebar button{min-height:44px;border:0;background:var(--panel2);color:var(--muted);padding:6px 11px;font-family:var(--mono);font-size:12px;cursor:pointer}
.timebar button.on{background:var(--protein);color:#0d0716}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtime{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--protein);white-space:nowrap}
.qprompt{font-size:14.5px;margin:8px 0 6px;line-height:1.55}
.qsrc{font-family:var(--mono);font-size:12px;color:var(--fuel)}
.qsrc a,.klink a{color:var(--teal)}
.qvid{font-size:12px;margin-top:4px}.qvid a{color:var(--teal)}
.qactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reveal{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:9px;border:1px solid var(--line);font-size:13.5px;line-height:1.55;display:none}
.reveal.on{display:block}
.rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rate button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.rate button:hover{border-color:var(--protein);color:var(--text)}
.masterbadge{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:9px}
.klink{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12.5px}
.klink b{color:var(--text)}
.stub{color:var(--dim);font-size:13px;margin-top:10px}


/* ==================================================================
   Accessibility & platform conventions
   WCAG 2.2 AA (2.4.7 focus, 2.3.3 motion, 2.5.8 target size),
   Apple HIG 44pt targets, Material 3 48dp navigation.
   ================================================================== */

/* 2.4.7 Focus Visible — keyboard users had no indicator at all. */
:focus-visible{
  outline:2px solid var(--teal);
  outline-offset:2px;
  border-radius:6px;
}
/* Only suppress the ring for pointer input, never for keyboard. */
:focus:not(:focus-visible){ outline:none; }

/* 2.3.3 Animation from Interactions — honour the OS-level preference. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* 2.5.8 Target Size (Minimum): 24px is the AA floor; 44px is the
   Apple/Material comfort target. Applied to every interactive control
   that was previously sized only by its text. */
button,.chk,.setpill,.rm,a.mbtn{ min-height:44px; }
.chk{ min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

/* Light mode: the app was dark-only, which ignores an explicit OS setting. */
@media (prefers-color-scheme: light){
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#F0F2F6;
    --line:rgba(0,0,0,.34);
    --text:#12161C; --muted:#4A5464; --dim:#5F6B7C;
    --track:#E3E7ED; --tealSoft:#DCF2EC;
    /* Accents darkened for a white surface. The dark-theme values sit at
       2.2-3.6:1 on white and fail WCAG 1.4.3; these clear 4.5:1 while
       preserving hue, so the palette reads the same in both themes. */
    --teal:#3A827A; --fuel:#966F32; --ok:#198663;
    --deficit:#BC5845; --interview:#BC5845; --protein:#7F6AB2;
  }
}

/* --- Workout density: progressive disclosure --- */
.setrow.logged-line,.setrow.next-line{display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.setlabel{min-width:74px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.setlabel.cur{color:var(--teal)}
.setval{font-family:var(--mono);font-size:14px;color:var(--text)}
